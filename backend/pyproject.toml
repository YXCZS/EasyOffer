[project]
name = "easyoffer-backend"
version = "0.1.0"
description = "EasyOffer technical interview quiz MVP backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "uvicorn[standard]>=0.30,<1.0",
  "aiomysql>=0.2,<1.0",
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "PyJWT>=2.9,<3.0",
  "httpx>=0.27,<1.0",
  "python-multipart>=0.0.9,<1.0",
  "langchain-core>=0.3,<2.0",
  "langgraph>=1.0,<2.0",
  "langchain-openai>=0.2,<2.0",
  "langchain-milvus>=0.1,<1.0",
  "pymilvus>=2.5,<3.0",
  "langchain-tavily>=0.2,<1.0",
  "langchain-community>=0.3,<1.0",
  "langchain-text-splitters>=0.3,<2.0",
  "dashscope>=1.20,<2.0",
  "pypdf>=5.0,<7.0",
  "PyMuPDF>=1.24,<2.0",
  "docx2txt>=0.8,<1.0",
  "python-docx>=1.1,<2.0",
  "PyYAML>=6.0,<7.0",
  "cos-python-sdk-v5>=1.9,<2.0",
  "Pillow>=10,<13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<7.0",
]
eval = [
  "ragas>=0.4,<0.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
