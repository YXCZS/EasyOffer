- query_id: g-091
  scenario_type: stable_technical
  topic: 计算机网络
  query: '计算机网络: HTTP 和 HTTPS 有什么区别？'
  role: backend
  difficulty: medium
  expected_technologies:
  - 计算机网络
  relevance:
    0c3e7b964d92c26a736126337f137017183daa05565f8bcb8c4c67e6339d246a: 2
  expected_knowledge_points:
  - 计算机网络
  reference_answer: '根据 计算机网络面试题速记通关版; page 19：HTTP 和 HTTPS 有什么区别？

    HTTP 和 HTTPS 的本质区别在于安全性，HTTPS 不是新的协议，⽽是 HTTP 跑在 SSL/TLS 之上。

    1）通信内容加密

    HTTP 明⽂传输，中间⼈能直接看到请求和响应内容。HTTPS 在 TCP 握⼿后、HTTP 通信前，先通过 SSL/TLS 协议协

    商密钥，后续数据都⽤对称加密传输。⽐如浏览器访问⽀付宝，账号密码要是⾛ HTTP，⽹络⾥的路由器都能看⻅。

    2）⾝份认证

    HTTPS 需要证书来证明“你真的是你”。服务端把数字证书发给客户端，客户端通过 CA（⽐如 Let''s Encrypt、

    DigiCert）验证证书合法性。没有这⼀步，钓⻥⽹站随便仿个淘宝⻚⾯就搞定了。

    3）防篡改

    TLS 会对数据做完整性校验，⽤ M AC（消息认证码）机制。哪怕中间有⼈改了⼀个字节，接收⽅解密时就会发现校验

    失败，直接断开。

    性能上，HTTPS 多了握⼿过程，⾸次建⽴连接要多花 1-2 个 RTT。但现代 TLS 1.3 已优化到 1-RTT 甚⾄ 0-RTT，加上

    CDN 普遍⽀持，实际差距很⼩。主流站点像 G oogle、淘宝、微信⽀付全默认 HTTPS。

    代码层⾯，J ava ⾥⽤ HttpsURLConnection 替代 HttpURLConnection ，关键是要信任的证书库。Netty 或

    Spring W ebFlux 中配置 SSLContext 即可启⽤。

    现在没有理由再⽤纯 HTTP，搜索引擎也优先收录 HTTPS 站点。⼩项⽬可以⽤ Nginx + 免费证书快速上 HTTPS。'
