  reference_answer: '根据 Redis 面试题速记通关版; page 2：Redis 中常⻅的数据类型有哪些？

    Redis ⽀持⼏种核⼼数据结构，每种都有明确的使⽤场景。

    字符串（String）是最基础的类型，能存⽂本、序列化对象，也常⽤来做计数器。⽐如⽤ INCR 实现接⼝调⽤次数统

    计，简单⾼效。

    列表（List）底层是双向链表，⽀持从头尾插⼊删除，适合做消息队列。但随机访问慢，⼀般不推荐当数组⽤。

    LPOP/RPOP 配合 LPU SH/RPU SH 能实现简单的⽣产消费模型。

    集合（Set）是⽆序不重复的字符串集合，底层⽤哈希表实现，所以增删查都是 O(1)。可以⽤在⽤户标签管理、社交关

    系去重这些需要快速判断成员存在的场景。

    有序集合（Sorted Set）在 Set 基础上加了 score 排序，⽐如排⾏榜类需求，ZADD 加数据，ZRANG E 按排名取，性能

    很好。score 可重复，m em ber 才是唯⼀键。

    哈希（Hash）适合存储对象字段，⽐如⽤户信息，ﬁeld 对应属性名，value 存值。相⽐直接序列化整个对象，可以单

    独更新某个 ﬁeld，省带宽也省内存。

    这五种是⽇常最常⽤的，像 Stream 、G eo、Bitm ap 这些属于特定场景扩展类型，⽤得相对少⼀些。'
