  reference_answer: '根据 Spring Boot 面试题速记通关版; page 9：什么是 Spring Actuator？它有什么优势？

    Spring Actuator 是 Spring Boot 项⽬⾥的⼀个模块，它给应⽤加了⼀层监控和管理能⼒。你不⽤改业务代码，只要引

    ⼊ starter，就能通过 HTTP 或 J M X 暴露⼀些预定义的端点（endpoints），⽐如查看健康状态、内存使⽤、线程堆

    栈、请求指标等。

    这些端点能帮你快速定位⽣产问题。⽐如服务挂了，调⽤ /actuator/health ⼀看就知道是数据库连不上还是

    Redis 超时。再⽐如流量突增，⽤ /actuator/metrics/jvm.memory.used 结合 G rafana 能看出内存是不是在缓

    慢上涨。

    1）暴露的端点默认有安全限制，⽣产上必须配合认证开启，避免信息泄露

    2）可以⾃定义端点，⽐如加个 /actuator/feature-toggle 来动态开关功能

    3）和 M icrom eter 集成后，能把指标推送到 Prom etheus，实现全链路监控

    代码上就两步：加依赖，开端点。

    <dependency>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-starter-actuator</artifactId>

    </dependency>

    management:

    endpoints:

    web:

    exposure:

    include: health,info,metrics

    其实它的价值不在功能多炫，⽽是统⼀了微服务的观测⼊⼝。你在⽤ Spring Cloud G ateway 还是 Eureka，所有服务

    的健康检查、指标格式都是⼀致的，运维脚本和告警规则能复⽤，省掉⼀堆脏活累活。'
