  reference_answer: '根据 设计模式面试题速记通关版; page 5：什么是⾥⽒替换原则？

    ⾥⽒替换原则讲的是⼦类应该能够替换它的⽗类，程序的⾏为不会因此出错。你⽤⽗类定义的地⽅，换成⼦类对象，

    系统照样能正常跑。

    1）关键在于⾏为⼀致性。⼦类可以扩展功能，但不能改变⽗类原有的正确⾏为。⽐如⽗类的某个⽅法约定返回正数，

    ⼦类重写后就不能返回负数，这会破坏调⽤⽅的预期。

    2）常⻅违反场景是重写⽅法时抛出意外异常，或者对输⼊输出做不合理限制。像集合框架⾥ ArrayList 和 Vector 都继

    承⾃ AbstractList，它们都能替换抽象⽗类出现在参数、变量中，这就是遵循了该原则。

    3）它和多态有关联但不是⼀回事。多态是语⾔机制，允许运⾏时决定调⽤哪个⽅法；⽽⾥⽒替换是⼀种设计约束，确

    保这种替换是安全的。搞不定这点，继承体系就会变得脆弱，上游⼀改，下游全挂。

    这个原则压根不关⼼你⽤了多少继承层次，只关⼼替换后逻辑是否成⽴。⽤的时候记住⼀点：别让⼦类“背叛”⽗类

    承诺。'
