    典型适⽤场景⽐如缓存容器、配置中⼼本地快照，像 Nacos 客户端就⽤它来保护服务实例列表的读写。压根不经过内

    核态切换，完全是⽤户态的 CAS 操作，性能扛得住⼏千上万 QPS 的读。

    不过 API 设计较反⼈类，try 和 release 必须配对，且 stam p 失效后要⼿动重试，得包⼀层⼯具⽅法才好⽤。'
