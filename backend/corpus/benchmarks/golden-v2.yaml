  query: 'Java 集合: J ava 中 ConcurrentHashM ap 1.7 和 1.8 之间有哪些区别？'
  role: backend
  difficulty: medium
  expected_technologies:
  - Java 集合
  relevance:
    2ebe0b4a33775e4c0c32606634bb9032b43bf9d4ce5f92323d8d2b6321f80ae4: 2
