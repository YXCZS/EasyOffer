  reference_answer: '根据 计算机网络面试题速记通关版; page 13：TCP 协议是如何保证可靠传输的？

    TCP 保证可靠传输不是靠单⼀机制，⽽是⼏个关键设计组合起来的结果。连接建⽴、数据排序、确认应答、超时重

    传、流量控制和拥塞控制这⼏点缺⼀不可。

    1）三次握⼿建⽴连接，确保双⽅收发能⼒正常。客户端和服务端各⾃初始化序列号（ISN），后续数据包都带 Seq 和

    Ack 号，实现有序传输和双向确认。

    2）每个发送的数据段都有序列号，接收⽅按序提交给应⽤层。如果收到乱序包，会暂存但重复发送上⼀个确认号的

    ACK，触发快重传。

    3）发送⽅启动定时器等待 ACK，⼀旦超时就重发。同时通过滑动窗⼝做流量控制，接收⽅通告⾃⼰的接收能⼒，防⽌

    缓冲区溢出。

    4）拥塞控制动态调整发送速率。慢启动阶段指数增⻓，到阈值后线性增⻓。⼀旦丢包，认为⽹络拥塞，cwnd 直接减

    半进⼊拥塞避免。

    代码上看，应⽤层调⽤ socket.send() 后，内核负责分段、加 TCP 头、维护发送队列。只有收到 ACK 才删除对应

    数据。丢包重试对应⽤透明。

    整个过程⾥，序列号、确认机制和重传策略是可靠传输的三⼤⽀柱。没有这些，像 HTTP、M ySQL 这类依赖稳定连接

    的应⽤根本搞不定。'
