  reference_answer: '根据 MySQL 面试题速记通关版; page 24：什么是 W rite-Ahead Logging (W AL) 技术？它的优点是什么？M
    ySQL 中是否⽤到了 W AL？

    WAL 的核⼼思路是：在修改数据前，先确保修改操作的⽇志落盘。只要⽇志持久化了，数据⻚后续再刷盘也没问题。

    即使中途崩溃，重启后靠⽇志重放就能恢复未写⼊的数据。

    这种机制让数据库的随机写变成了⽇志的顺序写。磁盘或 SSD 对顺序写优化得多好，你懂的。性能提升的关键就在

    这。

    优点直接拉满： 1）提升性能。写⽇志是追加操作，⽐随机更新数据⻚快⼀个数量级。 2）保证持久性。只要⽇志

    fsync 到磁盘，事务就可以返回成功，数据不会丢。 3）简化恢复。崩溃后⽤⽇志 replay 状态，⽐检查整个数据⽂件⾼

    效多了。

    M ySQL 的 InnoDB 引擎就是靠这个撑起来的。它的 redo log 就是典型的 WAL 实现。你执⾏⼀条 UPDATE，InnoDB

    先写 redo log buﬀer，事务提交时刷到磁盘的 redo log ⽂件，之后才异步刷脏⻚到 ibd ⽂件。

    // 伪代码⽰意 WAL 流程

    write_log_to_buffer(log); // 写⽇志到内存

    fsync_log_file(); // ⽇志落盘（关键步骤）

    apply_change_to_data_page(); // 数据⻚可以晚点刷

    整个过程像极了记账：不急着改总账本，先在流⽔本上记⼀笔，回头慢慢对账。这流⽔本就是 redo log。'
