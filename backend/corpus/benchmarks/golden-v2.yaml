- query_id: g-053
  scenario_type: stable_technical
  topic: RabbitMQ
  query: 'RabbitMQ: RabbitM Q 如何与其他消息队列（如 Kafka）进⾏对⽐？它们适⽤的场景有哪些？'
  role: backend
  difficulty: medium
  expected_technologies:
  - RabbitMQ
  relevance:
    13ce9dc68b41cbeaab7ad523d9c6a08c4d8ec4ba958687446effb991412da46c: 2
  expected_knowledge_points:
  - RabbitMQ
  reference_answer: '根据 RabbitMQ 面试题速记通关版; page 12：RabbitM Q 如何与其他消息队列（如 Kafka）进⾏对⽐？它们适⽤的场景有哪些？

    RabbitM Q 和 K afka 看起来都是发消息的中间件，但设计⽬标差得挺远。⼀个偏向传统企业级消息传递，另⼀个是为

    ⾼吞吐流式数据准备的。

    RabbitM Q 基于 AM QP 协议，⽤ Erlang 写的，天⽣适合做复杂路由。⽐如订单系统要通知库存、物流、积分多个服

    务，每个可能还要按规则过滤，这时候⽤它的 exchange + binding 机制就很顺⼿。它⽀持多种交换机类型：direct、

    topic、fanout、headers，灵活得很。不过吞吐量⼀般，单机⼏万 TPS 就顶天了。

    K afka 完全是另⼀个路⼦。它不搞复杂路由，所有消息按 topic 分区追加到⽇志⽂件⾥，顺序写磁盘+ m m ap 读取，

    单机轻松扛住⼏⼗万甚⾄上百万条/秒。它适合⽇志收集、⽤户⾏为追踪这类场景，⽐如⽤ Flink 实时分析⽤户点击

    流，数据从 K afka 进去再出去。

    1）RabbitM Q 更适合业务解耦、任务异步处理，像电商下单后发短信、⽣成优惠券这种。 2）K afka 专注⼤数据管道

    和流处理，常⻅于 ELK ⽇志链路、实时数仓，跟 Spark、Flink 配合多。 3）RabbitM Q 消息确认机制强，⽀持事务

    （虽然很少⽤），能保证不丢消息；K afka 依赖消费者⾃⼰管理 oﬀset，控制粒度更细但容易误操作。

    代码上差别也明显：

    // RabbitMQ 发送

    channel.basicPublish("orders", "new", null, msg.getBytes());

    // Kafka 发送

    producer.send(new ProducerRecord<>("user-behavior", userId, event));

    要不要持久化、要不要ACK ，两边配置逻辑完全不同。'
  reference_context_ids:
  - 13ce9dc68b41cbeaab7ad523d9c6a08c4d8ec4ba958687446effb991412da46c
