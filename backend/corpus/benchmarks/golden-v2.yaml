- query_id: g-051
  scenario_type: stable_technical
  topic: RabbitMQ
  query: 'RabbitMQ: 如何在 RabbitM Q 中配置消息的 TTL（过期时间）？'
  role: backend
  difficulty: medium
  expected_technologies:
  - RabbitMQ
  relevance:
    0c86c66aed647717961292986dcfc6fcf03d2f3709d14d2f217fc847cf012876: 2
  expected_knowledge_points:
  - RabbitMQ
  reference_answer: '根据 RabbitMQ 面试题速记通关版; page 6：如何在 RabbitM Q 中配置消息的 TTL（过期时间）？

    消息过期时间 TTL 是控制消息⽣命周期的关键机制，RabbitM Q 提供了两种配置⽅式，适⽤不同场景。

    1）为队列设置统⼀的 TTL

    所有进⼊该队列的消息都会共享同⼀个过期时间。⽐如你希望订单系统⾥未处理的消息最多存留 5 分钟，就可以在声

    明队列时指定：

    Map<String, Object> args = new HashMap<>();

    args.put("x-message-ttl", 300000); // 毫秒

    channel.queueDeclare("order.queue", true, false, false, args);

    2）为单条消息设置 TTL

    更灵活的⽅式是在发送消息时单独指定，适合不同消息⽣命周期差异⼤的场景：

    AMQP.BasicProperties props = new AMQP.BasicProperties.Builder()

    .expiration("60000") // 60 秒后过期

    .build();

    channel.basicPublish("", "queue.name", props, body);

    注意：如果队列和消息都设置了 TTL，以较短的那个为准。⽽且 TTL 到期后消息不会⽴刻消失，只有当它到达队头被

    消费或清理时才会被移除。

    死信队列常配合 TTL 使⽤。过期消息会被⾃动路由到 DLX（死信交换机），可⽤于实现延迟任务，⽐如⽤ RabbitM Q 模

    拟订单超时取消，结合 TTL 和 DLX 就能搞定。'
