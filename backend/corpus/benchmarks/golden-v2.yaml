  reference_answer: '根据 Spring Cloud 面试题速记通关版; page 29：分布式和微服务有什么区别？

    分布式和微服务听起来像⼀对双胞胎，其实它们关注的层⾯不⼀样。

    1） 分布式系统本质是把⼀个⼤应⽤拆到多台机器上跑，核⼼⽬标是解耦硬件依赖、提升可⽤性和性能。⽐如数据库主

    从分离、Redis 集群，都是典型的分布式场景。它解决的是“怎么让多个节点⼀起⼲活”的问题，不关⼼业务⻓啥样。

    2） 微服务则是业务架构的演进，把单体应⽤按业务域拆成⼀堆⼩服务，每个服务独⽴开发、部署、伸缩。像订单、⽀

    付、库存各是⼀个服务，⽤ Spring Cloud 或 Dubbo 做通信。重点在“⾼内聚、低耦合”的业务组织⽅式。

