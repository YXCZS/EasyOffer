  relevance:
    3d09a46063e6bd8e49d6f7b8b5c632bb2d73564eafe9f40e4a1d13f294560966: 2
  expected_knowledge_points:
  - Java 集合
  reference_answer: '根据 Java 集合面试题速记通关版; page 4：J ava 中的 W eakHashM ap 是什么 ？

    W eakHashM ap 的关键在于它对内存的敏感处理。它的 key 是弱引⽤，只要 G C 扫到了，不管内存够不够，这个 key

    就会被回收。

    这意味着，哪怕你还在⽤ value，只要 key 被回收了，整个 entry 就失效了。所以它适合做缓存，但不是那种要求强⼀

    致的缓存。

    典型场景是监听器注册表，⽐如 Swing ⾥的事件监听。注册的时候把 listener 当 key 放进去，⼀旦外⾯没⼈引⽤它，

    W eakHashM ap ⾃动就清理了，避免内存泄漏。

    对⽐ HashM ap，它不会⾃动清理；⽽ W eakHashM ap 在 key 回收后，下次 get 或 size 的时候会触发

    expungeStaleEntries，把陈旧的 entry 清掉。

    代码上其实⽤法差不多：

    Map<SomeObject, String> map = new WeakHashMap<>();

    SomeObject key = new SomeObject();

    map.put(key, "data");

    key = null; // 失去强引⽤

    System.gc(); // 极端情况下触发

    // 下次访问 map ，可能就拿不到数据了

    1）不要指望 W eakHashM ap 存⻓期数据

    2）别把它当普通 M ap ⽤，尤其是 key 会被频繁丢弃的场景

    3）G C 触发时机不确定，⾏为有延迟性'
