  reference_answer: '根据 Spring Cloud 面试题速记通关版; page 3：HTTP 与 RPC 之间的区别？

    HTTP 是应⽤层协议，本质是通信规范，⽽ RPC 是⼀种编程模型，⽬标是让远程服务调⽤像本地⽅法调⽤⼀样简单。

    1）通信协议上，HTTP 通常基于⽂本或⼆进制格式（如 HTTP/1.1、HTTP/2），⾛的是标准端⼝，天然⽀持跨平台和浏

    览器交互。RPC 框架可以⾃定义协议，⽐如 Dubbo ⽤ Netty + ⾃定义私有协议，gRPC 基于 HTTP/2 但封装了严格的

    接⼝契约。

    2）调⽤⽅式差异明显。HTTP ⼀般通过 RESTful ⻛格的 U RL + ⽅法（G ET/POST）交互，数据多⽤ J SON 传输，⼈眼

    可读。RPC 更关注接⼝抽象，客户端直接调 userService.getUser(1001) ，底层⾃动序列化、⽹络传输、服务

    寻址，开发者⼏乎感知不到⽹络细节。

    3）性能⽅⾯，RPC 协议更轻量，压根不经过浏览器那⼀套解析逻辑，序列化也常⽤ Protobuf 这类⾼效格式，延迟通

    常⽐ HTTP 低 30% 以上。像 gRPC 在内部微服务之间调⽤就很常⻅，扛住⾼并发没问题。

    4）典型场景：对外暴露 API 给前端或第三⽅，基本都⽤ HTTP + REST + J SON。内部服务间调⽤，尤其是对延迟敏感

    的场景，⽐如订单系统调库存，就更适合⽤ RPC 框架，⽐如 Dubbo 或 gRPC。

    图中左侧是外部 HTTP 访问路径，右侧是内部服务通过 RPC 直接交互，职责清晰。'
