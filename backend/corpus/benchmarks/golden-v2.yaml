  relevance:
    00ddc2d6d898e8cfa7ca5172fec75e96b5f2af9acbd8e6475e587305f5e7aa94: 2
  expected_knowledge_points:
  - Spring Cloud
  reference_answer: '根据 Spring Cloud 面试题速记通关版; page 17：说说什么是 API ⽹关？它有什么作⽤？

    API ⽹关本质是所有外部请求进⼊系统的统⼀⼊⼝，有点像⼩区的⻔卫。所有流量都得先经过它，再决定往哪⾛。

    它的核⼼价值不是转发，⽽是把⼀堆通⽤的、和业务⽆关的脏活累活给拦下来。⽐如你⽤ Spring Cloud G ateway 或者

    K ong，其实都是在配置这些能⼒。

    1）鉴权校验。接⼝不是谁都能调的，⽹关层可以检查 J W T token，没带或者过期了直接 401 拒掉，压根不经过后端服

    务。 2）限流熔断。防⽌突发流量把系统打崩，按 IP 或⽤户维度限制 QPS，超过阈值就返回 503，保护下游。 3）⽇

    志监控。统⼀记录请求响应时间、状态码，上报到 ELK 或 Prom etheus，排查问题不⽤挨个服务翻⽇志。 4）协议转

    换。前端调 REST，但内部微服务可能⾛ gRPC，⽹关做⼀层翻译，让前端少操⼼。 5）路由转发。根据 path 路由到不

    同服务，⽐如 /user/** 转发到 user-service，路径规则集中管理，后端改了也不⽤前端跟着变。

    拿电商系统举例，下单请求进来，⽹关先看是不是登录⽤户，再判断当前流量有没有超限，然后记⼀笔 traceId ⽅便链

    路追踪，最后才放⾏到订单服务。要是没有⽹关，每个服务都得⾃⼰实现这⼀套，重复代码多，策略还不⼀致。'
