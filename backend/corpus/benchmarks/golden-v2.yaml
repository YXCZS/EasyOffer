  reference_answer: '根据 Elasticsearch 面试题速记通关版; page 55：如何优化 Elasticsearch 索引阶段的性能？

    索引阶段的性能瓶颈通常出现在数据写⼊时的分词、刷盘、段合并等环节。优化的核⼼是让写⼊更⾼效，减少资源争

    抢。

    1）调整刷新间隔

    默认 1 秒刷新⼀次，会频繁⽣成⼩ segm ent，增加 m erge 压⼒。写⼊密集场景可以调⼤到 30s 甚⾄ -1（⼿动控制）。

    PUT /my-index/_settings

    { "refresh_interval": "30s" }

    2）批量写⼊代替单条提交

    bulk API 批量提交能显著降低⽹络和 I/O 开销。建议每批 5M B‒15M B 数据，避免过⼤导致超时。

    3）临时关闭副本

    写多读少时，可将 number_of_replicas 设为 0，写完再恢复。副本同步要等主分⽚落盘，关掉能提速 50% 以

    上。

    4）使⽤更快的合并策略

    默认 TieredM ergePolicy 会⾃动合并⼩段，但可能太激进。写⼊⾼峰期可调⾼ merge.policy.floor_segment ，

    减少⼩合并。

    5）禁⽤不必要的特性

    不需要评分或⾼亮的字段，设为 index: false ；全量⽂本才需要分词，其他字段尽量⽤ keyword 避免分析开

    销。

    6）J VM 与磁盘协同

    堆内存别超过 32G B，避免指针压缩失效。索引⽬录挂载 SSD，⽂件系统⽤ noop 或 deadline 调度器减少延迟。

    写⼊前做压测，观察 thread pool queue 和 segm ent count，指标飙⾼就得调参数。记住，segm ent 是关键观测点。'
