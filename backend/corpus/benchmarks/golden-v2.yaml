  reference_answer: '根据 Spring 面试题速记通关版; page 22：Spring WebFlux 是什么？它与 Spring M VC
    有何不同？

    Spring W ebFlux 是 Spring 5 引⼊的响应式编程框架，⽤来构建异步⾮阻塞的服务。它不是对 Spring M VC 的替代，⽽

    是多了⼀种选择，特别是在 I/O 密集或⾼并发场景下能更好地利⽤线程资源。

    1）运⾏模型不同

    Spring M VC 基于 Servlet 容器，每个请求对应⼀个线程，阻塞时线程挂起，吞吐量受限于线程池⼤⼩。⽐如 Tom cat

    默认最⼤线程数 200，超过就得排队。W ebFlux 则基于 Reactor 模型，使⽤少量事件循环线程处理⼤量连接，数据流

    通过 响应式流（Reactive Stream s）传播，压根不经过传统同步 IO。

    2）编程范式不同

    M VC 是命令式编程，代码⼀⾏⾏执⾏，调试直观。W ebFlux 推荐函数式⻛格，⽤ Mono 和 Flux 表达异步数据

    流。⽐如返回单个结果⽤ Mono<String> ，⽽不是 String 。

    @GetMapping("/async")

    public Mono<String> getData() {

    return service.getDataAsync(); // ⾮阻塞调⽤

    }

    3）适⽤场景有差异

    如果业务逻辑简单、依赖少，⽤ M VC 更稳更熟。但如果你在做⽹关类服务，⽐如集成 Spring Cloud G ateway，或者

    需要⻓连接⽀持（如 W ebSocket、SSE），W ebFlux 能扛住更⾼并发。

    4）容器⽀持也不同

    M VC 可以跑在任何 Servlet 容器上。W ebFlux 要么⽤ Netty，要么⽤⽀持异步 Servlet 3.1+ 的容器（如 U ndertow），

    Tom cat 虽然也能跑，但优势不如在 Netty 上明显。

    要不要上 W ebFlux，关键看你的瓶颈是不是在 I/O。如果是 CPU 密集型，两者差别不⼤。⽽且响应式栈对数据库驱动

    Tom cat 虽然也能跑，但优势不如在 Netty 上明显。

    要不要上 W ebFlux，关键看你的瓶颈是不是在 I/O。如果是 CPU 密集型，两者差别不⼤。⽽且响应式栈对数据库驱动

    也有要求，像 R2DBC 才能真正实现全链路异步，传统 J DBC 会把整个链路堵死。'
  reference_context_ids:
  - 0432b410413bd0c3fc32c8e5e1e212bba27014d37dd1677f293d62b94aeda8ea
