  relevance:
    1567f4a2f62e97a5bf33eba3116fb844321b352dc901e4222a32b094a662cede: 2
  expected_knowledge_points:
  - 操作系统
  reference_answer: '根据 操作系统面试题速记通关版; page 8：什么是分段、什么是分⻚？

    分段和分⻚是操作系统管理虚拟内存的两种机制，解决程序地址空间如何映射到物理内存的问题。

    分段把程序按逻辑模块划分，⽐如代码段、数据段、堆栈段。每个段有独⽴的基地址和⻓度，通过段表做映射。这样

    做的好处是便于实现共享和保护，⽐如多个进程可以共⽤同⼀个代码段。但容易产⽣外部碎⽚，内存利⽤率低，因为

    段⼤⼩不⼀，回收后留下零散空隙。

    分⻚则把虚拟和物理内存都切成固定⼤⼩的块，虚拟内存叫⻚，物理内存叫⻚帧，⼀般⼤⼩是 4K B。通过⻚表把虚拟

    ⻚号映射到物理⻚帧号。由于块⼤⼩统⼀，分配和回收不会产⽣外部碎⽚，只有少量内部碎⽚（最后⼀⻚⽤不满）。但

    ⻚对⽤户不可⻅，不利于程序的模块化管理和共享。

    举个例⼦，⼀个程序要访问虚拟地址，先拆解出⻚号和⻚内偏移，查⻚表得到对应⻚帧号，拼接偏移量就得到物理地

    址。这个过程由 M M U 硬件⾃动完成，多数情况下还能借助 TLB 缓存加速。

    两者根本区别在于划分⽅式：分段是逻辑驱动的变⻓划分，分⻚是硬件驱动的等⻓划分。现代系统通常采⽤段⻚式结

    合，先分段再分⻚，兼顾逻辑隔离和内存效率。'
