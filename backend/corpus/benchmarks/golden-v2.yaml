  relevance:
    023b3c5c7eed97fcb84acb5b36ce702e41028dd37f43e7418ead980864139a84: 2
  expected_knowledge_points:
  - MySQL
  reference_answer: '根据 MySQL 面试题速记通关版; page 3：M ySQL 中 varchar 和 char 有什么区别？

    varchar 和 char 都是⽤来存字符串的，但⽤法和底层处理差别挺⼤。

    char 是定⻓的，你定义成 char(10)，那它就占 10 个字符的空间，不管实际存的是 "a" 还是 "hello"，都会补空格到

    10。查询快，适合存⻓度固定的值，⽐如性别、状态码这种 1-2 位的标识。但浪费空间，尤其是字段定义得⼤⽽实际

    内容短的时候。

    varchar 是变⻓的，存多少占多少，最⼤⽀持 65535 字节（受限于⾏⼤⼩）。它需要额外 1-2 个字节记录⻓度，所以读

    写时多⼀点开销。适合⻓度不⼀的场景，⽐如⽤户名、地址这些。但因为⻓度可变，在⾏内存储结构上更灵活，空间

    利⽤率⾼。

    1）char 全部按固定⻓度分配存储，尾部空格会被截断（除⾮启⽤ PAD_CHAR_TO_FULL_LENGTH 模式） 2）

    varchar 实际占⽤空间 = 内容⻓度 + ⻓度标识字节（内容⼩于 255 字节⽤ 1 字节，否则 2 字节） 3）两者在检索时，

    char 的性能略好，因为位置固定；varchar 要先读⻓度再定位内容

    举个例⼦：

    CREATE TABLE t (a char(10), b varchar(10));

    INSERT INTO t VALUES (''abc'', ''abc'');

    这⾏数据中，a 列实际占 10 字符，b 列只占 3 字符 + 1 字节⻓度信息。

    注意⾏⼤⼩限制，⼀张表所有列加起来不能超过约 65KB，所以别随便把⼤⽂本塞进 char 或超⻓ varchar。'
