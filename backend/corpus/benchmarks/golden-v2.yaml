  reference_answer: '根据 Redis 面试题速记通关版; page 9：Redis 性能瓶颈时如何处理？

    Redis 出现性能瓶颈，⼀般先看是 CPU 、内存、⽹络还是磁盘成了短板。⼤多数情况瓶颈在单线程模型处理⼤量请求

    时的吞吐上限。

    1）先⽤ INFO stats 和 redis-cli --latency 观察指标。如果 QPS 上不去但 CPU 没到顶，可能是⼤ key 或

    慢查询拖累。像 KEYS 这种阻塞命令得禁⽤，改⽤ SCAN 。

    2）⼤ key 拆分是常⻅优化⼿段。⽐如⼀个包含 10 万元素的 hash，读写都慢。可以按业务维度拆成多个⼩ hash，或

    者⽤ Redis Hash 的 slot 机制分散。

    3）数据结构选型也很关键。⽐如⽤ ZSET 做时间排序队列没问题，但如果频繁修改分数，O(log N) 的复杂度在百万

    级数据下就明显了。这时候可以考虑降级为 LIST + 外部索引，或者引⼊ Redis Stream s，它更适合⾼吞吐的消息

    场景。

    4）真扛不住就横向扩展。Redis Cluster 能⾃动分⽚，数据按 key 分布到 16384 个 slot，跨节点访问会重定向。不过

    m ulti-key 操作必须在同⼀个 slot，可以⽤ hash tag 强制路由，⽐如 user:{1000}:profile 和 user:

    {1000}:orders 。

    5）极端场景下，本地缓存加⼀层 Caﬀeine 或 G uava Cache，把最热的数据挡在 Redis 前⾯。⽐如⽤户登录信息，

    99% 请求集中在 10% 的 key 上，本地缓存能减少 80% 以上的远程调⽤。'
