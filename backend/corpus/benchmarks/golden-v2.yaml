  query: '操作系统: Select、Poll、Epoll 之间有什么区别？'
  role: backend
  difficulty: medium
  expected_technologies:
  - 操作系统
  relevance:
    214d5a16eb9ed9742fead6795d7a0e92d9f1fa8bbe7c1190061f62c50859c5a8: 2
  expected_knowledge_points:
  - 操作系统
  reference_answer: '根据 操作系统面试题速记通关版; page 12：Select、Poll、Epoll 之间有什么区别？

    select、poll 和 epoll 都是 Linux 下处理 I/O 多路复⽤的机制，⽤来让⼀个线程能同时监控多个⽂件描述符的读写状

    态。它们的核⼼⽬标是⼀样的，但实现⽅式和性能差异很⼤。

    1）select 使⽤固定⼤⼩的位图来表⽰ fd 集合，通常最⼤⽀持 1024 个 fd。每次调⽤都要把整个 fd 集合从⽤户态拷⻉

    到内核态，返回后还要遍历所有 fd 判断是否就绪。这种⽅式在连接数多时开销⼤，效率低。

    2）poll 其实跟 select 差不多，只是换成了链表结构传递 fd，突破了 1024 的限制。但它依然需要遍历所有 fd，⽽且每

    次都要传全量数据，没有解决根本的性能问题。

    3）epoll 完全换了个思路，它在内核⾥⽤红⿊树管理 fd，⽤就绪队列回调通知。调⽤ epoll_ctl 添加 fd 时注册回调函

    数，⼀旦有事件触发，内核直接把 fd 放进就绪队列。epoll_wait 调⽤时只返回就绪的 fd，不⽤遍历全部。这种机制让

    单个线程轻松扛住⼏万并发，Nginx、Netty 都靠它撑着。

    简单说，select 和 poll 是“你有没有事？我去挨个问⼀遍”，⽽ epoll 是“有事我主动告诉你”。连接少的时候差别不

    ⼤，上⼏千并发时，epoll 的优势就压倒性了。'
