  reference_answer: '根据 RabbitMQ 面试题速记通关版; page 2：如何在 RabbitM Q 中声明⼀个队列？有哪些必要参数？

    声明⼀个队列，本质上是让 RabbitM Q 知道这个队列的存在，并设置它的⾏为。你可以在客户端通过 AM QP 协议发送

    QueueDeclare 命令来完成，⼀般⽤ channel.queueDeclare() 这个⽅法。

    1）队列名（queueNam e）

    这是最直观的参数，⽐如 "order.delay.queue" 。可以为空，RabbitM Q 会⽣成⼀个随机唯⼀的名字，适合临时

    队列。

    2）持久化（durable）

    设为 true 表⽰队列本⾝在 Broker 重启后依然存在。注意这只是队列元数据不丢，消息是否持久还要看消息属性和交

    换机绑定⽅式。

    3）独占性（exclusive）

    true 表⽰只有创建它的连接能使⽤，断开后⾃动删除。常⽤于 RPC 回调这种私有场景。

    4）⾃动删除（autoDelete）

    当没有消费者监听时，队列会被⾃动移除。适合短期任务或⼴播场景，⽐如⽤完即⾛的通知队列。

    5）额外参数（argum ents）

    ⽤来设置 x-m essage-ttl、x-m ax-length、x-dead-letter-exchange 等策略。⽐如延迟队列就靠 x-dead-letter-

    exchange 配合 TTL 实现。

    代码⻓这样：

    channel.queueDeclare("my.queue", true, false, false,

    Map.of("x-message-ttl", 60000));

    如果⽣产者或消费者都尝试声明同⼀个队列，只要参数⼀致就没问题。参数冲突会直接报错。所以通常建议由消费者

    端来声明，避免消息发到不符合预期的队列。'
