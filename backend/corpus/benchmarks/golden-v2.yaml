- query_id: g-074
  scenario_type: stable_technical
  topic: Spring Cloud
  query: 'Spring Cloud: 负载均衡的实现⽅式有哪些？'
  role: backend
  difficulty: medium
  expected_technologies:
  - Spring Cloud
  relevance:
    0da76e8ef46d3a8010124a8129f7e1f719f6bf6eb8ef336e059d3eca9b448875: 2
  expected_knowledge_points:
  - Spring Cloud
  reference_answer: '根据 Spring Cloud 面试题速记通关版; page 34：负载均衡的实现⽅式有哪些？

    负载均衡的实现⽅式从层级上看，主要分四层和七层两⼤类。四层基于 IP 和端⼝转发，核⼼是 LVS 这种⼯具，靠

    NAT、DR 或 TU N 模式把请求打到后端机器，性能强，每秒能扛⼏万并发，适合做最外层⼊⼝。七层在应⽤层做，⽐

    如 Nginx 或 Envoy，能解析 HTTP 头，按路径、域名甚⾄ Header 内容分流，灵活但性能损耗⾼点。

    1）⽹络层⽤ LVS 时，DR 模式最常⻅，前端通过修改 M AC 地址把请求直接发给真实服务器，响应不⾛调度器，吞吐

    ⾼，但要求所有机器在同⼀个局域⽹。

    2）HTTP 服务⼀般⽤ Nginx 做反向代理，配置 upstream 就能实现轮询、权重或 IP 哈希，加个 keepalived 还能防单

    点故障。

    3）服务发现场景下，像 Spring Cloud LoadBalancer 或 Dubbo 的内置负载策略，客户端⾃⼰选节点，减少中间环

    节，压根不经过独⽴⽹关。

    4）云环境⾥基本都⽤⼚商⽅案，⽐如阿⾥云 SLB、AW S ALB，背后是集群化 ETSI 转发，⾃动扩缩，运维成本低。

    代码上，Nginx 配置轮询很简单：

    upstream backend {

    server 192.168.1.10:8080;

    server 192.168.1.11:8080;

    }

    LVS 的 DR 模式要注意 ARP 抑制，不然服务器可能收不到包。⽽七层⽅案得留意连接耗尽问题，尤其是代理⼤量后端

    时，⽂件描述符要调优。'
