  reference_answer: '根据 MyBatis 面试题速记通关版; page 11：能详细说说 M yBatis 的执⾏流程吗？

    M yBatis 的执⾏流程，从发起⼀次 SQL 查询说起。你调⽤ M apper 接⼝⽅法那⼀刻，其实背后⾛了⼀整套拦截、解

    析、执⾏的机制。

    1）⾸先，M apper 接⼝并不是实现类，⽽是通过动态代理⽣成的代理对象。每次你调

    userMapper.selectById(1) ，代理就会根据⽅法名和参数，找到对应的 SQL 语句。

    2）接下来进⼊ SqlSession，它负责统筹全局。SqlSession 会拿着M appedStatem ent（封装了SQL和配置）去执⾏查

    询。如果开启了⼆级缓存，先查⼆级缓存；没有就往下⾛。

    3）然后到 Executor，这是执⾏引擎的核⼼。它先查⼀级缓存（基于 SqlSession 的本地缓存），命中直接返回。没命

    中就创建 Statem entHandler。

    4）Statem entHandler 负责处理 J DBC 的 Statem ent，做 SQL 拼接、参数映射。Param eterHandler 把你的⼊参按规

    则塞进预编译 SQL ⾥，⽐如 ? 替换成实际值。

    5）接着交给 J DBC 执⾏，ResultSet 返回后，ResultSetHandler 开始⼯作。它通过反射和类型处理器 TypeHandler，

    把数据库字段映射成 J ava 对象。

    6）结果出来后，写⼊⼀级缓存，如果有⼆级缓存且配置了，则在事务提交时刷⼊⼆级缓存。

    整个过程链路清晰，组件各司其职。⽐如⼀级缓存默认开启，作⽤域是同⼀个 SqlSession；⼆级缓存需要⼿动开启，

    跨 SqlSession 共享，但要注意并发问题。'
