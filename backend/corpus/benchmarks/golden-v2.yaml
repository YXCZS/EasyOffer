  relevance:
    191bae560cbdc624f653ea042f6c2c29b79c970ad0785b9afed8da6ffe1cb63d: 2
  expected_knowledge_points:
  - 操作系统
  reference_answer: '根据 操作系统面试题速记通关版; page 12：什么是物理地址，什么是逻辑地址？

    物理地址是内存芯⽚级别的真实地址，CPU 通过它直接访问内存硬件。你程序⾥看到的变量地址都不是这个，⽽是逻

    辑地址。

    逻辑地址是操作系统给每个进程“画”的独⽴内存空间，⽐如 32 位系统就是从 0 到 4G B 的虚拟范围。每个进程都觉

    得⾃⼰独占内存，其实这是被系统管理过的假象。

    真正⼲活的是 M M U （内存管理单元），它靠⻚表把逻辑地址翻译成物理地址。每次内存访问都要查⻚表，命中就转成

    物理地址去取数据，没命中就触发缺⻚中断，由操作系统从磁盘加载数据并更新⻚表。

    这样设计的好处很明显：进程隔离、内存保护、⽀持⽐物理内存更⼤的寻址空间。像 J ava 程序⾥的对象引⽤，全都是

    在逻辑地址空间⾥跑，压根不经过物理地址。

    举个例⼦，两个进程都访问地址 0x1000，M M U 会根据各⾃的⻚表映射到不同的物理位置，互不影响。

    ⻚⼤⼩通常是 4K B，⼀个进程的逻辑⻚可以映射到任意物理⻚框，实现⾮连续内存分配，解决外部碎⽚问题。'
