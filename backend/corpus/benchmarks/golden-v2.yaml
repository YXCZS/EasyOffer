  reference_answer: '根据 Java 虚拟机面试题速记通关版; page 14：Java 中有哪些垃圾回收算法？

    J ava 的垃圾回收算法主要围绕怎么找垃圾、怎么清理垃圾展开。不同算法适合不同场景，⼀般 CM S、G 1 这些收集器

    会组合使⽤多种算法。

    1）标记-清除（M ark-Sweep）

    先标记所有存活对象，然后统⼀回收未被标记的垃圾。最⼤的问题是会产⽣内存碎⽚，⽐如⽼年代⽤ Serial 收集器时

    就⽤这个算法，⻓时间运⾏后可能因为碎⽚触发 Full G C。

    2）复制（Copying）

    把内存分成两块，每次只⽤其中⼀块。当这⼀块满了，就把存活对象复制到另⼀块，然后清空原来的那块。效率⾼，

    不会产⽣碎⽚，但可⽤内存直接砍半。年轻代的 M inor G C 基本都⽤这个思路，⽐如 ParNew 和 G 1 在年轻代阶段。

    3）标记-整理（M ark-Com pact）

    标记过程和“标记-清除”⼀样，但后续不是直接清理，⽽是把存活对象往⼀端滑动，再清理边界外的内存。适合⽼年

    代这种对象多、回收少的场景，避免碎⽚问题。CM S 在并发失败降级后就会⽤这个算法做 Full G C。

    4）分代收集（G enerational Collection）

    这不是具体算法，⽽是策略。基于对象⽣命周期分布：90% 对象朝⽣⼣死。年轻代⽤复制算法，回收快；⽼年代⽤标

    记-清除或标记-整理。G 1 和 ZG C 都是基于分代思想演进出来的。

    像 G 1 会把堆拆成多个 Region，逻辑上保留分代，回收时优先选垃圾多的区域，实现“增量整理”。ZG C 和

    Shenandoah 更激进，主打并发整理，停顿时间控制在 10m s 以内。'
