  reference_answer: '根据 Elasticsearch 面试题速记通关版; page 49：什么是 Elasticsearch 中的相关性得分？有哪些影响因素？

    相关性得分是 Elasticsearch 对搜索结果与查询关键词匹配程度的量化评分，分数越⾼代表⽂档越“相关”。这个分值

    由 TF-IDF 和 BM 25 等相似度算法计算得出，默认从 ES 5.x 开始使⽤ BM 25。

    1）词频（Term Frequency）：检索词在⽂档某个字段中出现的次数越多，相关性越⾼。⽐如⼀篇⽂档⾥“J ava”出现

    了 10 次，⼤概率⽐只出现 1 次的更相关。

    2）逆⽂档频率（Inverse Docum ent Frequency）：检索词在整个索引中出现的⽂档数越少，它的区分能⼒越强，权重

    就越⾼。“分布式”这种常⻅词 IDF 低，“ZooK eeper”这种少⻅词 IDF ⾼。

    3）字段⻓度归⼀化：短字段⽐⻓字段更容易获得⾼分。如果标题字段⾥命中了关键词，通常⽐在⼏万字的正⽂⾥命中

    更有意义。

    4）布尔逻辑和查询结构：must 、should 、filter ⼦句的影响不同。filter 不影响得分，纯⽤于过滤；⽽

    should 会贡献匹配分值。

    5）⾃定义权重控制：可以⽤ boost 参数提升某些查询或字段的优先级。例如给商品名称字段设置 boost=2 ，让

    它⽐描述字段更重要。

    代码上体现为 _score 字段：

    {

    "query": {

    "match": {

    "title": {

    "query": " ⾼性能 ",

    "boost": 3

    }

    }

    }

    }

    实际应⽤中，像电商搜索、⽇志分析这些场景都依赖精准的相关性排序。如果搞不定得分逻辑，搜出来⼀堆不相⼲的

    结果，⽤户体验直接崩掉。'
