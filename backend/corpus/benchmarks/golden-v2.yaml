    spring-boot-autoconfigure （核⼼配置，含 META-

    INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports ⽂件声明配置

    类）。

    INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports ⽂件声明配置

    类）。

