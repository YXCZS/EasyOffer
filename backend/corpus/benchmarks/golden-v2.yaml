  reference_answer: '根据 Java 虚拟机面试题速记通关版; page 22：你了解 Java 的类加载器吗？

    J ava 的类加载器不是简单的⽂件读取⼯具，它负责在运⾏时动态将 .class ⽂件加载到 J VM 中，并转换成

    java.lang.Class 对象。

    整个机制基于双亲委派模型。当⼀个类加载请求到来时，当前类加载器不会⾃⼰先去加载，⽽是交给它的⽗类加载器

    处理。只有当⽗类加载器⽆法完成加载（⽐如在指定路径找不到类），⼦加载器才会尝试⾃⼰加载。这种设计保证了像

    java.lang.Object 这种核⼼类不会被⾃定义加载器篡改，保障了安全性和⼀致性。

    J VM 内置三类加载器： 1）启动类加载器（Bootstrap ClassLoader）由 C++ 实现，加载 $JAVA_HOME/lib 下的核

    ⼼类库，⽐如 rt.jar 。 2）扩展类加载器（Extension ClassLoader）加载 $JAVA_HOME/lib/ext ⽬录下的类。

    3）应⽤程序类加载器（Application ClassLoader）加载⽤户 classpath 指定的类。

    你可以⾃定义类加载器，继承 ClassLoader 并重写 findClass() ⽅法。典型场景包括热部署（如 Tom cat 隔离

    各个 W eb 应⽤）、模块化加载（OSG i）或远程类加载。

    public class CustomClassLoader extends ClassLoader {

    @Override

    protected Class<?> findClass(String name) throws ClassNotFoundException {

    byte[] classData = loadClassData(name);

    if (classData == null) throw new ClassNotFoundException();

    return defineClass(name, classData, 0, classData.length);

    }

    return defineClass(name, classData, 0, classData.length);

    }

    }

    打破双亲委派的少数情况是线程上下⽂类加载器，⽤来解决⽗类加载器需要加载应⽤级别的实现，⽐如 J NDI 服务加载

    数据库驱动。'
