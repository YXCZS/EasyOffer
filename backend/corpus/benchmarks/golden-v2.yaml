  reference_answer: '根据 ZooKeeper 面试题速记通关版; page 59：ZooKeeper 中的 ACL 权限模型是否⽀持递归权限管理？如果不⽀持，如何实现？

    ZooKeeper 的 ACL 权限模型本⾝不⽀持递归继承。你给某个 znode 设置的权限，它的⼦节点压根不会⾃动继承这套

    规则，每个节点都是独⽴的。

    这就意味着，如果你在 /app 上设置了 ACL，新建的 /app/config 还是得重新设置⼀遍权限，不然客户端可能连

    不上。这种设计其实是为了灵活性，避免误操作导致权限扩散，但带来的问题是管理成本⾼，尤其是树形结构深的时

    候。

    要想实现类似“递归权限”的效果，得靠⾃⼰写代码控制。常⻅的做法是在创建⼦节点时，主动把⽗节点的 ACL 拷⻉

    过去。ZooKeeper 提供了 getACL 和 setACL 接⼝，你可以先读⽗节点的 ACL，再应⽤到新⼦节点上。

    List<ACL> acl = zooKeeper.getACL("/app", null);

    zooKeeper.create("/app/config", data, acl, CreateMode.PERSISTENT);

    这种⽅式适⽤于 Curator 这类框架做⼆次封装的场景。⽐如⽤ Curator 的 Transaction 批量创建节点时，统⼀带上

    同⼀套 ACL 策略，就能减少重复操作。

    有些公司会在中间件层封装 ZooKeeper 客户端，在 create() 调⽤⾥⾃动处理 ACL 传递逻辑，对业务透明。这属

    于脏活累活交给基础设施去扛的典型思路。

    要不要搞这套，得看你的节点数量和安全要求。如果就⼏个节点，⼿动设也⾏；要是成百上千个路径，建议在客户端

    做⼀层⾃动同步。'
