  reference_answer: '根据 Spring 面试题速记通关版; page 29：什么是 AOP？

    AOP，也就是⾯向切⾯编程，本质是为了解决横切关注点的代码复⽤和集中管理。像⽇志记录、权限校验、事务管理

    这些功能，散落在各个业务⽅法⾥，改起来费劲还容易漏。AOP 就是把这些横切逻辑抽出来，统⼀织⼊到⽬标⽅法的

    特定位置。

    Spring AOP 的实现依赖动态代理。如果⽬标类实现了接⼝，默认⽤ J DK 动态代理；没有接⼝就⽤ CG LIB。整个过程不

    需要修改原有代码，通过配置或注解就能把切⾯加进去。⽐如你⽤ @Around 写个环绕通知，就能在⽅法执⾏前后插

    ⼊逻辑。

    1）切点（Pointcut）决定哪些⽅法要被拦截，通常⽤表达式匹配⽅法签名

    2）通知（Advice）定义在切点的哪个时机执⾏，⽐如前置、后置、环绕

    3）切⾯（Aspect）是切点和通知的组合，描述“在哪执⾏”和“执⾏什么”

    典型场景就是 Controller 层统⼀打⽇志，或者 Service ⽅法上加 @Transactional 。但别滥⽤，像业务逻辑本⾝就

    不该塞进切⾯⾥，否则别⼈看不懂流程。简单说，AOP 是⼯具，不是魔法，⽤好了事半功倍，⽤歪了就是坑。

    Spring ⼀共有⼏种注⼊⽅式？

    Spring 的依赖注⼊⽅式主要就三种：构造器注⼊、Setter 注⼊、字段注⼊。实际项⽬⾥最常⻅的是前两种。

    1）构造器注⼊是现在推荐的⽅式，尤其在类的依赖不可变时。它能保证依赖不为空，也⽅便写单元测试。Lom bok 的

    @RequiredArgsConstructor 能帮你省掉⼤量构造函数代码。

    @Service

    public class OrderService {

    private final PaymentService paymentService;

    public OrderService(PaymentService paymentService) {

    this.paymentService = paymentService;

    }

    }

    public OrderService(PaymentService paymentService) {

    this.paymentService = paymentService;

    }

    }

    2）Setter 注⼊灵活性⾼，适合可选依赖。但对象可能处于不完整状态，⽽且 setter ⽅法对外暴露，破坏封装性。

    3）字段注⼊写起来最简单，直接 @Autowired 加在字段上。但它把依赖隐藏了，不利于测试，也不符合“显式依

    赖”原则。阿⾥规约明确禁⽌这种写法。

    其实从 Spring 4.3 开始，如果类只有⼀个构造函数，连 @Autowired 都可以省略，容器会⾃动装配。这进⼀步推动

    ⼤家⽤构造器注⼊。

    要不要⽤字段注⼊？⼩⼯具类或者 dem o ⽆所谓，但正式项⽬建议别图省事。⻓期来看，构造器注⼊更安全，代码也

    更⼲净。

    图⾥字段注⼊被标红了，就是提醒你⸺能不⽤就不⽤。'
