  reference_answer: '根据 MySQL 面试题速记通关版; page 14：什么是 CDC（Change Data Capture）？常⻅的 CDC
    ⼯具有哪些？

    CDC 的本质是捕获数据变更事件，⽽不是定期轮询快照。数据库的事务⽇志⽐如 M ySQL 的 binlog、PostgreSQL 的

    WAL 天然就是变更流，CDC ⼯具就是把这些⽇志实时解析成可消费的消息。

    这类⼯具不依赖业务代码侵⼊，能以极低延迟把增删改操作同步到下游，典型场景是保持缓存与数据库⼀致、数据仓

    库实时⼊仓、微服务间解耦。如果靠定时任务扫表，延迟⾼还容易把数据库搞崩。

    常⻅开源⽅案有⼏种路线：

    1）基于数据库⽇志解析，Debezium 是主流选择，它⽤ Kafka Connect 框架做分布式采集，⽀持 M ySQL、

    PostgreSQL、Oracle 等多种源，能把每⼀⾏变化发到 Kafka Topic ⾥。

    2）阿⾥开源的 Canal 只针对 M ySQL，模拟 slave 拉取 binlog，适合纯 Java 技术栈的公司集成，像阿⾥内部早期就⽤

    它做订单数据同步。

    3）商业产品如 Oracle GoldenGate 功能更强，但成本⾼；现代数仓场景也有 Flink CDC 直接嵌⼊计算引擎，⽤ SQL

    就能写变更管道。

    代码层⾯，Debezium 的配置核⼼是定义 connector 的 source 属性，指定数据库地址、binlog 位点、加密⽅式等，启

    动后⾃动⽣成数据流。

    注意点：DDL 变更处理要⼩⼼，字段删除可能导致消息格式不兼容；还有断点续传必须依赖可靠的 oﬀset 存储。'
