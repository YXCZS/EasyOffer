  query: 'Java 综合: 单例模式有哪⼏种实现？如何保证线程安全？'
  role: backend
  difficulty: medium
  expected_technologies:
  - Java 综合
  relevance:
    0a257813d776c1c1209d3f9ede7687580e7b503f00b502917311f171b1e5a985: 2
  expected_knowledge_points:
  - Java 综合
  reference_answer: '根据 Java 热门面试题 200 道速记通关版; page 95：单例模式有哪⼏种实现？如何保证线程安全？

    单例模式的关键是确保⼀个类只有⼀个实例，并提供全局访问点。常⻅的实现⽅式有好⼏种，每种都有它的适⽤场景

    和坑。

    1）饿汉式在类加载时就创建实例，写法最简单，天然线程安全，但可能浪费资源。

    public class Singleton {

    private static final Singleton INSTANCE = new Singleton();

    private Singleton() {}

    public static Singleton getInstance() {

    return INSTANCE;

    }

    }

    2）懒汉式延迟初始化，但直接加 synchronized ⽅法性能差，毕竟锁的是整个⽅法。

    3）双重检查锁定（DCL）是优化⽅案，只在实例未创建时才同步，注意必须⽤ volatile 修饰实例变量，防⽌指令重排

    序导致返回未初始化完成的对象。

    4）静态内部类⽅式利⽤了类加载机制保证线程安全，⼜实现了懒加载。外部类加载时不触发内部类初始化，直到第⼀

    次调⽤ getInstance 才加载 Holder 类并创建实例。

    public class Singleton {

    private Singleton() {}

    private static class Holder {

    static final Singleton INSTANCE = new Singleton();

    }

    public static Singleton getInstance() {

    return Holder.INSTANCE;

    }

    }

    5）枚举单例最简洁安全，不仅能防反射攻击，还能防⽌序列化破坏单例，Eﬀective Java 推荐的⽅式。

    public enum Singleton {

    INSTANCE;

    }

    ⼀般项⽬⾥⽤静态内部类或枚举就够了。DCL 虽⾼效但容易写错，⽐如漏掉 volatile。如果涉及到反序列化或反射的场

    景，优先选枚举。'
