  reference_answer: '根据 Java 基础面试题速记通关版; page 30：什么是 Java 内部类？它有什么作⽤？

    内部类就是定义在另⼀个类⾥⾯的类。它能直接访问外部类的所有成员，包括私有的，这种紧密的耦合关系在某些场

    景下特别有⽤。

    1）解决逻辑相关的类组织问题。⽐如 LinkedList ⾥的 Node ，作为链表的节点结构，天⽣属于 LinkedList

    的内部实现细节，⽤内部类封装就很⾃然。

    2）实现事件监听、回调等机制时更⽅便。像 AW T/Swing 的事件处理，监听器作为内部类可以直接拿到外部界⾯组件

    的状态，不⽤到处传引⽤。

    3）替代函数式接⼝或简化匿名类写法。虽然现在有 Lam bda，但在需要维护状态的回调⾥，局部内部类还是更灵活。

    匿名内部类在创建线程或注册监听时很常⻅：

    new Thread(new Runnable() {

    public void run() {

    System.out.println(" 来⾃内部类的线程 ");

    }

    }).start();

    注意内存泄漏⻛险。⾮静态内部类会隐式持有外部类引⽤，如果它的实例⽣命周期⽐外部类⻓（⽐如被缓存了），就会

    导致外部类⽆法回收。Android 开发⾥经常踩这个坑。

    静态嵌套类没有这个问题，它和普通类差不多，只是命名空间被包装了⼀下：

    public class Outer {

    static class Nested { } // 不依赖外部类实例

    }

    内部类最终会被编译成独⽴的 .class ⽂件，⽐如 Outer$Inner.class ，J VM 其实并不认识“内部类”这个概

    念，全是靠编译器⽣成代码和桥接⽅法实现的。'
