  reference_answer: '根据 ZooKeeper 面试题速记通关版; page 14：在 ZooKeeper 的 conﬁg 命名空间中，每个 ZNode
    最⼤能存储多少数据？

    ZooKeeper 的单个 ZNode 节点存储数据有严格限制，最⼤不能超过 1M B，也就是 1048576 字节。这个限制是硬性

    的，如果尝试写⼊超过这个⼤⼩的数据，ZooKeeper 会直接拒绝并抛出运⾏时异常。

    这么设计其实是为了保证整个集群的⾼性能和⼀致性。ZooKeeper 基于 ZAB 协议实现分布式协调，所有写操作都要通

    过 Leader ⼴播并持久化到磁盘，同时还要复制给 Follower。如果允许存⼤⽂件，⽹络传输、序列化反序列化、内存

    占⽤都会成为瓶颈，⼀致性协议的效率就垮了。

    所以它压根不是⽤来当分布式存储⽤的，像配置管理、服务发现这类场景才是它的主战场。⽐如 Dubbo 或 Kafka ⽤

    ZooKeeper 存节点元数据，⼀般也就⼏ KB。你要真想存⼤⽂件，得交给 HDFS 或者对象存储，让 ZooKeeper 专⼼搞

    协调。

    需要特别注意的是，这个 1M B 是包含数据内容和节点⾃⾝元信息（⽐如版本号、ACL 等）的总和，实际可⽤空间略⼩

    ⼀点。⽣产环境建议把单节点数据控制在⼏ KB 到⼏⼗ KB 以内，避免拖慢整体性能。

    // 创建节点时要注意数据⻓度

    byte[] data = "config=xxx".getBytes(StandardCharsets.UTF_8);

    if (data.length > 1024 * 1024) {

    throw new IllegalArgumentException("Data too large for ZNode");

    }

    zk.create(path, data, ZooDefs.Ids.OPEN_ACL_UNSAFE, CreateMode.PERSISTENT);

    如果你看到某些资料提到可以通过修改 jute.maxbuffer 参数来调⼤限制，理论上可⾏，但官⽅强烈不推荐，容易

    引发各种稳定性问题。'
