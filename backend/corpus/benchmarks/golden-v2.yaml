  reference_answer: '根据 MySQL 面试题速记通关版; page 32：M ySQL 的存储引擎有哪些？它们之间有什么区别？

    M ySQL ⽀持多种存储引擎，但最常⽤的其实是 InnoDB 和 M yISAM 。⾯试⾥问这个，核⼼是看你对 InnoDB 的掌握程

    度。

    1）InnoDB 是 M ySQL 默认引擎，从 5.5 版本开始就扛住主要业务场景。它⽀持事务、⾏级锁、外键约束，还实现了

    M VCC 来提升并发性能。⼤多数⾼并发、要求数据⼀致性的系统都会选它，⽐如电商订单、⽀付这类模块。

    2）M yISAM 虽然查询快，尤其是 count(*) 这种全表扫描，但它压根不⽀持事务和⾏锁，写⼊时会锁整张表。现在基本

    被淘汰了，只在⼀些⽇志类、读多写少的场景还能⻅到，⽐如⽼系统的数据分析表。

    3）其他引擎像 M emory 是把数据放内存的，断电就丢，适合做临时缓存表；Archive ⽤来存归档数据，压缩⽐⾼，但

    查询能⼒弱。

    InnoDB 的数据是按聚簇索引组织的，主键索引直接带⾏数据，⼆级索引指向主键。⽽ M yISAM 不管什么索引，都指向

    数据⽂件地址，结构上就简单很多。

    选引擎的关键是看业务需求。要事务和并发写，必须⽤ InnoDB；纯读且统计频繁，可以考虑 M yISAM ，但现在⼀般通

    过缓存或数仓解决。别在新项⽬⾥⽤ M yISAM ，搞不定故障恢复。'
