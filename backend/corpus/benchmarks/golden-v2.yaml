    崩。所以⼀定要显式传 Charset 。

    只要记住：所有涉及字节和字符转换的地⽅，都得明确指定字符集，别偷懒。尤其是跨系统、跨语⾔、跨存储的时

    候，这个环节压根不经过⼤脑去猜，必须写死。'
