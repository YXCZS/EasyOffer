- query_id: g-062
  scenario_type: stable_technical
  topic: Spring
  query: 'Spring: Spring Bean 注册到容器有哪些⽅式？'
  role: backend
  difficulty: medium
  expected_technologies:
  - Spring
  relevance:
    049c11c4266bb972731cfa3fc2b8d7a25cd3068a55cb87f744859d73c99eb305: 2
  expected_knowledge_points:
  - Spring
  reference_answer: '根据 Spring 面试题速记通关版; page 44：Spring Bean 注册到容器有哪些⽅式？

    Spring 把 Bean 放进容器，其实不光是写个 @ Com ponent 就完事了，⽅式挺多的，得看场景。

    1）最常⻅的是注解驱动，⽐如⽤ @ Com ponent、@ Service 这些，配合 @ Com ponentScan 扫描⾃动注册。这是现

    在最主流的⽅式，启动时扫描指定包，找到注解标记的类就注册成 Bean 定义。

    2）XM L 配置虽然⽼派，但有些⽼项⽬还在⽤。在 applicationContext.xm l ⾥写 <bean

    class="com.example.User"/> ，容器启动时解析 XM L 就把 Bean 定义加载进去了。

    3）编程式注册也很关键，⽐如你在配置类⾥写：

    @Configuration

    public class MyConfig {

    @Bean

    public User user() {

    return new User();

    }

    }

    这个⽅法返回的对象会被注册为单例 Bean。

    4）还有⼀种是直接操作 API，⽐如通过 ApplicationContext 的⼦接⼝ BeanDefinitionRegistry ⼿动注册

    Bean 定义。像⼀些中间件，⽐如 Feign，就是在启动时动态⽣成代理类，然后⼿动注册进去。

    5）最后别忘了条件注册，⽤ @ Conditional 注解控制是否注册，Spring Boot 的⾃动装配全靠它撑着。

    这些⽅式最终都指向⼀个⽬标：让 BeanDeﬁnition 被加载到 BeanFactory ⾥。容器启动时读取这些定义，后⾯才好实

    例化、依赖注⼊。

    要不要画个流程？从配置类/组件扫描到 BeanDeﬁnitionRegistry 的过程可以可视化⼀下。'
