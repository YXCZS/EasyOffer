  reference_answer: '根据 RabbitMQ 面试题速记通关版; page 15：如何在 RabbitM Q 中处理消息的重复消费问题？

    消息重复消费是分布式场景下的⽼⼤难问题，RabbitM Q 本⾝不保证“恰好⼀次”投递，⽹络抖动或消费者宕机都可

    能导致同⼀条消息被重新投递。解决这事，得靠业务层配合。

    1）⾸先确认 RabbitM Q 的 ACK 机制。⼿动 ACK 模式下，消费者处理完消息后才发确认，如果处理到⼀半挂了，

    Broker 会把消息发给别的消费者。这本来是⾼可⽤设计，但也是重复的根源。

    2）幂等性是关键。不管消息来多少遍，结果要⼀致。常⻅⽅案有：

    利⽤数据库唯⼀约束。⽐如消息带了个业务 ID，⼊库前先往表⾥插⼀条记录，主键就⽤这个 ID。重复来？直

    接报主键冲突，跳过处理。

    Redis 写个标记，setnx key，过期时间⽐消息周期⻓⼀点。拿到消息先看 key 在不在，有就跳过，没有就执

    ⾏并设值。

    3）不要依赖“全局去重”，性能搞不定。像 RocketM Q 有个去重开关，其实是⽤布隆过滤器在 Broker 缓存消息 ID，

    适合⼩规模场景。⼤规模还得靠分⽚ + 本地缓存。

    代码上，Spring AM QP 可以这样写核⼼逻辑：

    @RabbitListener(queues = "order.queue")

    public void handleMessage(Message message, Channel channel) throws IOException
    {

    String msgId = message.getMessageProperties().getMessageId();

    if (!redisTemplate.opsForValue().setIfAbsent("msg:dedup:" + msgId, "1",

    Duration.ofHours(1))) {

    return; // 已处理，直接跳过

    }'
