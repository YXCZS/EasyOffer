  reference_answer: '根据 操作系统面试题速记通关版; page 1：什么是 CPU 缓存⼀致性协议 M ESI？

    CPU 缓存⼀致性是多核编程⾥绕不开的底层机制。M ESI 其实就是四个状态的缩写，⽤来保证多个 CPU 核⼼的缓存数

    据是⼀致的。

    每个缓存⾏（cache line）在任意时刻处于以下四种状态之⼀：

    1）Modiﬁed：这⾏数据被当前核⼼修改过，和内存不⼀致，只有本核⼼有最新值。

    2）Exclusive：数据和内存⼀致，但只有当前核⼼在⽤，没⼈共享。

    3）Shared：多个核⼼都在读这个数据，⼤家缓存的值都⼀样。

    4）Invalid：这⾏缓存⽆效，不能直接⽤，得先去加载。

    当某个核⼼要写数据时，会触发总线嗅探（bus snooping），其他核⼼收到通知后检查⾃⼰的缓存，如果也有这⾏数

    据，就把它置为 Invalid。这样下次访问就得重新从内存或其它核⼼拉取最新值，避免脏读。

    ⽐如你在 J ava ⾥写 volatile 变量，背后就会触发 M ESI 协议来确保可⻅性。虽然 volatile 不保证原⼦性，但它能强制

    刷新缓存，让修改⽴刻被其他核⼼看到。

    简单说，M ESI 就靠这套状态机 + 总线⼴播，让多核之间的缓存看起来像是“同步”的。'
