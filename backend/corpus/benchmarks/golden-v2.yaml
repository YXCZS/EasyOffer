  topic: Nginx
  query: 'Nginx: Nginx 命令中 -s 参数的作⽤是什么？具体有哪些⽤法？'
  role: backend
  difficulty: medium
  expected_technologies:
  - Nginx
  relevance:
    1a7b20cff7b3483a010261f4f25ac86ac8105552ad3786ca7b5bccffbc33418b: 2
  expected_knowledge_points:
  - Nginx
  reference_answer: '根据 Nginx 面试题速记通关版; page 7：Nginx 命令中 -s 参数的作⽤是什么？具体有哪些⽤法？

    s 是 signal 的意思，⽤来给 Nginx 主进程发信号，实现运⾏时控制。它不重启服务就能让 Nginx 重新加载配置或平

    滑升级，属于线上运维的常规操作。

    ⽤法都通过 nginx -s <signal> 触发，前提是得有权限操作对应进程。

    1）reload

    重新加载配置⽂件。Nginx 会先检查 conf ⽂件语法是否正确，没问题就通知主进程启动新 worker 进程，⽼进程在处

    理完已有请求后⾃动退出。这是修改 nginx.conf 后的标准操作。

    2）stop

    快速关闭，发送 SIG TERM 信号，强制 worker ⽴刻终⽌。可能中断正在处理的请求，⽣产环境慎⽤。

    3）quit

    优雅关闭，发送 SIG QU IT。主进程等所有 worker 处理完当前请求后再完全退出，保证服务完整性。

    4）reopen

    重新打开⽇志⽂件，⽤于⽇志轮转场景。⽐如你⽤ logrotate 切了 access.log，发 reopen 会让 Nginx 关闭旧 fd 并打

    开新的 access.log，避免⽇志写不进去。

    实际命令⽰例：

    nginx -s reload

    这类操作依赖 m aster process 记录的 pid，默认存在 nginx.pid ⽂件⾥。如果路径不对，可以⽤ -p 指定⽬录，⽐

    如：

    nginx -p /usr/local/nginx/ -s reload

    整个过程压根不经过配置重载，靠的是进程间信号通信机制。这种设计让 Nginx 在⾼并发下也能安全调整状态，像阿

    ⾥云 SLB 背后的 Tengine 就⼤量依赖这类指令做动态管控。'
