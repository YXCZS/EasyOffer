  reference_answer: '根据 Java 集合面试题速记通关版; page 3：J ava ArrayList 的扩容机制是什么？

    ArrayList 的扩容发⽣在添加元素时容量不⾜的情况下，整个过程其实就⼏步：先检查是否需要扩容，再按⽐例增⻓，

    最后复制数据。

    1） 添加元素前会判断当前 size + 1 是否超过数组⻓度

    2） 如果超过，就会触发 grow() ⽅法进⾏扩容

    3） 新容量是旧容量的 1.5 倍，计算⽅式是 oldCapacity + (oldCapacity >> 1)

    4） 扩容后通过 System .arraycopy 将原数组数据拷⻉到新数组

    初始容量默认是 10。第⼀次 add 时如果没指定⼤⼩，会创建⼀个⻓度为 10 的数组。后续每次扩容都按 1.5 倍往上

    加，⽐如从 10 到 15，再到 22、33……直到 Integer.M AX_VALU E。

    private void grow() {

    int oldCapacity = elementData.length;

    int newCapacity = oldCapacity + (oldCapacity >> 1);

    elementData = Arrays.copyOf(elementData, newCapacity);

    }

    频繁扩容会影响性能，因为每次都要内存分配和数组拷⻉。如果能预估数据量，建议初始化时直接指定容量，⽐如

    new ArrayList<>(1000) ，这样能避免中间多次扩容的开销。

    扩容本⾝是脏活累活，但对上层透明。你只管 add，它⾃动帮你扛住容量问题，前提是别在循环⾥⽆脑 add ⼤量数据

    ⽽不预设容量。'
