  reference_answer: '根据 ZooKeeper 面试题速记通关版; page 6：ZooKeeper 的默认端⼝是什么？各个端⼝分别有什么作⽤？

    ZooKeeper 的默认端⼝是 2181，这是客户端连接集群的主要⼊⼝。但⼀个完整的 ZooKeeper 节点实际会监听多个端

    ⼝，各⾃承担不同职责。

    2181 是客户端通信端⼝，应⽤通过它读写数据。⽐如⽤ Curator 或原⽣ API 连接 zk.connect("localhost:2181")，⾛

    的就是这个端⼝。

    如果搭建的是集群，还会⽤到另外两个端⼝。3888 ⽤于 Leader 选举，当集群启动或主节点宕机时，节点间通过这个

    端⼝协商选出新的 Leader。它不对外暴露，只在内部成员之间通信。

    另⼀个是 2888，作⽤是 数据同步和⼼跳。⼀旦 Leader 产⽣，Follower 就通过这个端⼝与 Leader 保持连接，接收事

    务⽇志（如创建节点、设置值），保证数据⼀致性。

    这三个端⼝配合起来，构成了 ZooKeeper 的运⾏基础。⽣产环境部署时，防⽕墙必须放⾏这三组端⼝，否则可能出现

    脑裂或节点⽆法加⼊集群的问题。

    举个例⼦，⽤ Docker 部署 zk 集群时，不仅要映射 2181，还得把 2888 和 3888 做好端⼝绑定，否则容器间选主失

    败。'
