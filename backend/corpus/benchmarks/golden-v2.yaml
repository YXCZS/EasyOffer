  reference_answer: '根据 操作系统面试题速记通关版; page 14：同步和异步的区别？

    同步和异步的差别，关键看调⽤⽅要不要等结果。

    1）同步操作⾥，线程发起⼀个调⽤后就卡着不动，得⼀直等到对⽅返回结果才能继续往下⾛。⽐如你去餐厅点餐，服

    务员站在你桌边等着厨房出菜，这期间他啥也不⼲，这就是典型的同步阻塞。J ava ⾥的 Thread.join() 就是这

    样，主线程得等⼦线程执⾏完才能继续。

    2）异步操作完全不⼀样，调⽤⼀发出，当前线程⽴⻢就能⼲别的事，不⽤傻等。等被调⽤⽅处理完了，会通过回调、

    事件通知或者 Future 的⽅式告诉你结果。像发个短信说“饭好了”，你收到再过去拿，中间时间全利⽤起来了。

    CompletableFuture.supplyAsync() 就是这种模式，任务扔进线程池就不管了，后⾯⽤ .thenApply 处理结

    果。

    实际场景中，数据库连接池 HikariCP 在获取连接时可以选择同步等待，⽽像消息队列 RabbitM Q 的消费者则是异步接

    收消息，靠监听器触发处理逻辑。

    系统吞吐量上，异步天然适合⾼并发场景。Tom cat 的 NIO 模式就是把请求转成事件注册到 selector，⼀个线程能扛

    住⼏千连接，压根不经过阻塞等待那套流程。

    别把异步和多线程划等号，异步是⼀种编程模型，多线程只是实现⼿段之⼀。Node.js 单线程也能做异步 I/O，靠的是

    事件循环。'
