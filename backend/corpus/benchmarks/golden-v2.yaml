    为什么 Redis Zset ⽤跳表实现⽽不是红⿊树？B+树？

    Redis 的 Zset 选择跳表（Skip List）实现，主要是在 读写性能、实现复杂度和范围查询 之间找了个好平衡。

    1）跳表在平均情况下，插⼊、删除、查找都是 O(log n)，虽然最坏情况可能退化⼀点，但随机层数设计让它⼤概率保

    持均衡，不像红⿊树那样需要频繁旋转维持平衡。你想想，每次插⼊都要左旋右旋，写放⼤严重，对 Redis 这种⾼并

    发场景来说，脏活累活越少越好。

    2）范围查询是硬需求，⽐如 ZRANGEBYSCORE 。跳表天然⽀持双向链表+多层索引，指针直接串着，遍历效率⾼。

    红⿊树做中序遍历也可以，但得靠额外数据结构辅助，代码复杂。B+树倒是擅⻓范围扫描，但它是为磁盘 IO 设计的，

    ⼀个节点对应⼀⻚，内存⾥⽤反⽽有额外指针开销，没必要。

    3）跳表代码实现简单，调试容易。Redis 强调稳定和可维护，不⽤搞复杂的树平衡逻辑，开发成本低。⽽且实测性能

    不输红⿊树，甚⾄在并发插⼊时表现更好。

    你看这个结构，⼀层层往下筛，查得快，删增也⽅便，指针⼀改就⾏。Redis 要的就是这种“够快、够稳、别太复

    杂”的⽅案。'
