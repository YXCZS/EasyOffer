  reference_answer: '根据 Java 集合面试题速记通关版; page 12：为什么 J DK 1.8 对 HashM ap 进⾏了红⿊树的改动？

    J DK 1.8 对 HashM ap 的优化，主要解决哈希冲突严重时的性能退化问题。当⼤量元素落在同⼀个桶时，链表会变得很

    ⻓，查找从 O(1) 退化到 O(n)。为控制最坏情况的时间复杂度，引⼊了红⿊树机制。

    具体触发条件是：某个桶内的节点数达到 8，并且当前数组⻓度⼤于等于 64，链表就会转成红⿊树。这样最坏查找性

    能能稳定在 O(log n)。反过来，如果红⿊树节点减少到 6，⼜会退化回链表，避免维护红⿊树的额外开销。

    这个设计其实是空间和时间的权衡。链表占⽤⼩，但查询慢；红⿊树查询快，结构更复杂。阈值选 8 和 6 是为了防⽌

    频繁来回转换，⽤了泊松分布做依据，碰撞达到 8 的概率已经极低。

    常⻅误区是认为只要 put 就可能转红⿊树，其实前提是扩容也解决不了散列问题。⽐如所有 key 都只落在少数⼏个桶

    ⾥，扩容后还是冲突，这时候链表⻓度才会持续增⻓。

    代码上你不需要感知这个过程，HashM ap 内部⾃动切换。但如果你的 key 没有合理实现 hashCode()，⽐如总返回

    1，那所有元素都挤在⼀个桶，性能⽴⻢崩成 O(n)。'
