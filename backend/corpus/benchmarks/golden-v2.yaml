  reference_answer: '根据 MySQL 面试题速记通关版; page 17：M ySQL 中 TEXT 类型最⼤可以存储多⻓的⽂本？

    M ySQL 的 TEXT 类型不是单⼀类型，⽽是⼀组⽤于存储⼤⽂本的字段类型，不同变种容量差别很⼤。

    1）TINYTEXT 最⼤ 255 字节，和 VARCHAR(255) 上限⼀样，但存储⽅式不同。

    2）TEXT 最⼤ 65,535 字节（约 64KB），实际能存的字符数取决于字符集。⽐如⽤ utf8mb4，⼀个字符占 4 字节，最

    多存 16383 个字符左右。

    3）M EDIUM TEXT ⽀持到 16,777,215 字节（约 16M B），适合存⽂章内容、⽇志⽚段这类中等⻓度⽂本。

    4）LONGTEXT 能到 4,294,967,295 字节（约 4GB），基本能满⾜绝⼤多数⼤⽂本场景。

    这些类型的数据不存储在⾏内，⽽是把实际内容放在额外的溢出⻚，⾏⾥只存指向它的指针。这样⼀来，虽然能存得

    下⼤⽂本，但访问时会有⼀次间接寻址，性能⽐ VARCHAR 差⼀些。

    如果字段经常⽤来做 WHERE 查询或 ORDER BY，尽量别⽤ TEXT，因为索引受限。⽐如普通索引最多前缀 767 字节

    （或 3072 字节，取决于 innodb_large_preﬁx 配置），全⽂检索可以⽤ FULLTEXT 索引，像 M ySQL ⾃带的全⽂索引或

    者接⼊ Elasticsearch 更合适。

    代码上建表时写法很简单：

    CREATE TABLE articles (

    id INT PRIMARY KEY,

    content LONGTEXT

    );

    ⼀般选哪种，得看业务数据量级。存个⽤户简介⽤ TEXT 绰绰有余，存⼩说章节建议 M EDIUM TEXT，搞⽂档归档系统

    可能就得上 LONGTEXT。'
