  query: 'Java 综合: M yBatis 中 #{} 和 ${} 的区别是什么？'
  role: backend
  difficulty: medium
  expected_technologies:
  - Java 综合
  relevance:
    1ca3cca2cc72f2e2499021e79d0c9e3506e66a3d5ecc53a4fd34524f8a68c82a: 2
  expected_knowledge_points:
  - Java 综合
  reference_answer: '根据 Java 热门面试题 200 道速记通关版; page 15：M yBatis 中 #{} 和 ${} 的区别是什么？

    #{} 和 ${} 看似都是占位，但处理时机完全不同。

    #{} 是预编译参数占位符，M yBatis 会把 SQL 中的 #{} 替换成 ? ，然后通过 PreparedStatement 的 set

    ⽅法赋值。这个过程能有效防⽌ SQL 注⼊，因为参数内容不会参与 SQL 解析。⽐如：

    <select id="getUser" resultType="User">

    SELECT * FROM user WHERE id = #{id}

    </select>

    最终执⾏的是 SELECT * FROM user WHERE id = ? ，安全⼜⾼效。

    ${} 是字符串拼接，直接把变量值原样插⼊到 SQL 中，不经过预编译。这意味着如果传⼊恶意内容，就可能被当作

    SQL 执⾏。⽐如：

    ORDER BY ${columnName}

    这⾥ ${columnName} 如果是 id; DROP TABLE user ，那后果就严重了。所以 ${} 只能在⽆法使⽤预编译的

    场景下⽤，⽐如动态表名、动态排序字段，⽽且必须确保输⼊可控。

    ⼀般情况下，能⽤ #{} 就别碰 ${} 。⾮要⽤ ${} ，得⾃⼰做⽩名单校验，不能让⽤户随便输。

    1）#{} ⾛预编译，安全，性能好

    2）${} 是拼接，有注⼊⻛险，慎⽤

    3）${} 适⽤场景：动态表名、动态排序、动态 in 条件（需转义）

    什么是设计模式？请简述其作⽤。

    设计模式不是语法也不是框架，它是前⼈总结出的、针对特定问题的可复⽤解决⽅案模板。本质上是代码结构和组织

    ⽅式的经验结晶。

    1）解决重复出现的设计问题

    ⽐如对象创建太散乱，就⽤⼯⼚模式统⼀出⼝；系统耦合太紧，就引⼊观察者模式解耦。Spring ⾥的 BeanFactory 就

    是简单⼯⼚的体现，M yBatis 的插件机制⽤了责任链。

    2）提升代码可维护性和扩展性

    是简单⼯⼚的体现，M yBatis 的插件机制⽤了责任链。

    2）提升代码可维护性和扩展性

    以策略模式为例，不同算法独⽴封装，新增逻辑不⽤改原有 if-else。电商项⽬⾥计算运费、优惠规则基本都这么⼲。

    3）提供通⽤语⾔

    团队沟通时说“这⾥⽤模板⽅法”，⽐解释“⽗类定流程⼦类重步骤”更⾼效。就像说“M VC”⼤家⽴刻明⽩分层结

    构。

    注意别过度设计。⼩项⽬硬套 23 种模式反⽽搞复杂了。GOF 提出的分类（创建型、结构型、⾏为型）可以作为学习路

    线图，但实战中按需选⽤才是正道。

    请描述简单⼯⼚模式的⼯作原理。

    简单⼯⼚模式的核⼼是把对象的创建过程集中到⼀个“⼯⼚”类⾥，客户端不⽤关⼼具体怎么创建实例，只要告诉⼯

    ⼚想要什么类型就⾏。

    1） ⼯⼚类内部通常有⼀个静态⽅法，接收⼀个参数⽐如类型标识，通过 if-else 或 switch 判断该返回哪个具体实现。

    ⽐如传⼊ "mysql" 就返回 MySqlDriver ，传⼊ "redis" 就返回 RedisClient 。

    2） 客户端代码只需要依赖抽象接⼝或⽗类，不直接调⽤ new。这样新增产品时，理论上只需修改⼯⼚逻辑，⽽不必

    改动所有使⽤⽅。

    3） 这种模式其实违背了开闭原则，每加⼀种新产品就得改⼯⼚⽅法。所以适合产品种类固定、变化少的场景，⽐如配

    置解析器，⽀持 JSON 和 XM L 两种格式就够了。

    代码⽰例如下：

    public class ParserFactory {

    public static Parser create(String type) {

    if ("json".equals(type)) return new JsonParser();

    if ("xml".equals(type)) return new XmlParser();

    throw new IllegalArgumentException("Unknown type");

    }

    }

    throw new IllegalArgumentException("Unknown type");

    }

    }

    说⽩了，它就是个封装了 new 的⼯具类，让调⽤⽅更⼲净，但扩展性有限。真要搞灵活，还是得上 ⼯⼚⽅法模式 或

    抽象⼯⼚。'
