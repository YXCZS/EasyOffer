  reference_answer: '根据 Redis 面试题速记通关版; page 32：Redis 中如何实现分布式锁？

    实现分布式锁，最朴素的想法是⽤⼀个能共享的状态来标记“锁被谁占了”，Redis 天然适合这个场景。关键不是 set

    本⾝，⽽是怎么保证 set 的原⼦性和后续的可靠性。

    1）先说最基础的⼀招：SET resource_name random_value NX PX 30000

    NX 是“不存在才设置”，PX 是毫秒级过期时间，random _value 要保证唯⼀，⼀般⽤ U U ID 或线程 ID 加时间戳。这⼀

    步就能防住并发重复获取。

    但光设上锁不⾏，释放的时候得⼩⼼。不能直接 del，不然可能删了别⼈的锁。正确做法是 Lua 脚本：

    if redis.call("get", KEYS[1]) == ARGV[1] then

    return redis.call("del", KEYS[1])

    else

    return 0

    end

    这个脚本保证“判断 + 删除”是原⼦的，值对才删，避免误删。

    2）上⾯这套在单 Redis 实例下够⽤，但主从切换时可能丢锁⸺主节点还没同步到从节点就挂了，新主没这把锁，别

    ⼈就能抢到。这就是锁失效问题。

    想更稳就得⽤ Redlock 算法，它要求跨多个独⽴ Redis 节点加锁，必须⼤多数节点成功才算拿到锁。虽然性能差些，

    但提⾼了容错性。不过实际中很多⼈还是⽤单实例 + ⾼可⽤部署，配合超时和重试扛住⼤部分场景。

    3）⽣产⾥常⻅的是 Redisson，它封装了可重⼊锁、看⻔狗⾃动续期。⽐如锁快过期了，后台线程会⾃动延⻓过期时

    间，只要线程还活着。这解决了业务执⾏时间不确定的问题。'
