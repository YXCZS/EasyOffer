  reference_answer: '根据 Java 热门面试题 200 道速记通关版; page 101：说说 M yBatis 的缓存机制？

    M yBatis 的缓存分两级，⼀级缓存默认开启，作⽤域是 SqlSession 级别。只要你⽤同⼀个 SqlSession 执⾏相同的

    SQL，参数也⼀样，第⼆次查询直接从内存取结果，不⽤⾛数据库。

    1）⼀级缓存底层其实就是⼀个 HashM ap，数据结构是 key（M appedStatement ID + 查询参数）到缓存对象的映

    射。⼀旦执⾏ commit、update 或 close，缓存就清空。所以事务提交后，下个会话查的数据是新的。

    2）⼆级缓存作⽤范围更⼴，跨 SqlSession，通常集成 Redis、Ehcache 来实现。需要⼿动开启，对应的 M apper 类得

    实现 Serializable，配置⽂件⾥加上 <cache/> 。多个会话查相同 M apper 和参数时，先看⼆级缓存有没有。

    但要注意，⼆级缓存如果没设计好，可能出脏数据。⽐如 A 会话更新了数据还没提交，B 会话就从缓存读了旧值。⼀

    般在读多写少场景⽤，像商品信息这种，配合 TTL 控制失效时间。

    代码上，关键点是 M appedStatement 的 cache 属性是否绑定缓存实例。每次执⾏查询，CachingExecutor 先问

    cache 有没有，没有再委托给 BaseExecutor 去查数据库。

    简单说，⼀级缓存防⼀次会话重复查，⼆级缓存扛住多个会话的重复请求。真并发⾼并发场景，还是建议⽤ Redis ⾃

    定义缓存策略，⽐ M yBatis 默认的更可控。'
