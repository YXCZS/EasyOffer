  reference_answer: '根据 设计模式面试题速记通关版; page 8：什么是策略模式？⼀般⽤在什么场景？

    策略模式解决的是“⼀堆 if-else 或 switch 分⽀⾥塞不同算法”的问题。你想啊，⽐如做⽀付功能，微信⽀付、⽀付

    宝、银联，每种逻辑完全不同，要是全写在⼀个⽅法⾥，代码⽴⻢爆炸，维护起来根本搞不定。

    它的核⼼是把每个算法封装成独⽴的类，都实现同⼀个接⼝。运⾏时根据条件选⼀个具体实现来⽤。这样新增⽀付⽅

    式不⽤改⽼代码，符合开闭原则。

    ⼀般在这些场景特别好使： 1）有明显的⾏为分⽀，⽐如计算运费，按城市、重量、会员等级有不同算价规则 2）需要

    动态切换算法，像导出报表⽀持 CSV、Excel、PDF 三种格式 3）避免重复的条件判断，像促销活动满减、打折、返券

    举个例⼦，Spring 的 Resource 接⼝就是典型，ClassPathResource 、FileSystemResource 、

    UrlResource 各⾃处理不同路径类型的资源加载，调⽤⽅压根不经过具体实现。

    public interface Strategy {

    void execute();

    }

    public class Context {

    private Strategy strategy;

    public void setStrategy(Strategy strategy) {

    this.strategy = strategy;

    }

    public void run() {

    strategy.execute();

    }

    }

    实际项⽬⾥，配合 Spring 的 IoC，直接把所有策略实现注⼊进来，⽤ m ap 存好，key 是策略名，取的时候

    strategies.get("alipay").execute() 就⾏，⼲净利落。'
