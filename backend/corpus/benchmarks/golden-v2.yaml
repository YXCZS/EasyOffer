    RedisTemplate 、LettuceConnectionFactory 。

    3）⾃动装配基于条件注解，像 @ConditionalOnClass 、@ConditionalOnMissingBean ，只有满⾜条件才⽣

    效。⽐如发现 classpath 有 Jedis.class 才去配置 J edis 连接⼯⼚。

