  query: 'Redis: Redis 中原⽣批处理命令（M SET、M GET）与 Pipeline 的区别是什么？'
  role: backend
  difficulty: medium
  expected_technologies:
  - Redis
  relevance:
    1b323c70f2824937d1fb0c4a0b0779036f207a68c9f9b7e246fd8be0766b3815: 2
  expected_knowledge_points:
  - Redis
  reference_answer: '根据 Redis 面试题速记通关版; page 10：Redis 中原⽣批处理命令（M SET、M GET）与 Pipeline
    的区别是什么？

    原⽣批处理像把多个命令打包成⼀个请求发给 Redis，M SET 和 M G ET 就是这种。Redis 收到后可以⼀次性执⾏，⽹络

    来回只有 1 次，指令还是原⼦的，顺序执⾏不被打断。

    Pipeline 不⼀样，它不是命令，⽽是⼀种通信优化⼿段。客户端把⼀堆命令连续发出去，不⽤等每个响应。Redis 还是

    ⼀个个处理，但省掉了反复的⽹络等待时间。⽐如发 100 条 G ET，RTT 是 1m s，传统⽅式要 100m s，Pipeline 可能只

    要 2m s（1次发送 + 1次回程）。

    关键区别在于 原⼦性 和 实现层级。M SET/M G ET 是服务端⽀持的单命令多操作，天然原⼦。Pipeline 是客户端攒请

    求、批量发，服务端压根不经过“原⼦执⾏”这层逻辑，中间可能穿插别的客户端命令。

    举个例⼦：⽤ J edis 做 Pipeline，你写：

    Pipeline p = jedis.pipelined();

    p.get("k1");

    p.get("k2");

    List<Object> resp = p.syncAndReturnAll(); // 批量获取结果

    这期间其他客户端照样能写数据，没法保证这⼀组读的原⼦视图。

    再⽐如，M SET 最多⽀持 1024 个键，超了得拆；Pipeline 理论上可以塞⼏千条不同命令，但得⾃⼰控制缓冲区⼤⼩，

    别把内存搞爆。

    所以，要原⼦性批量读写⼩数据，⽤ M G ET/M SET。要是追求吞吐，操作之间不要求原⼦，⽐如缓存预热加载 1w 条数

    据，Pipeline 更合适。'
