  reference_answer: '根据 Elasticsearch 面试题速记通关版; page 12：如何使⽤ ID 检索 Elasticsearch 中的⽂档？

    通过 ID 检索⽂档是 Elasticsearch 最直接的查询⽅式，⾛的是倒排索引的快速路径，性能极⾼。

    1）⽤ GET 请求访问指定索引下的 _doc 端点，带上 ID 即可。ES 会根据⽂档 ID 直接定位到所在的分⽚和底层存储

    位置，压根不经过全⽂检索流程。

    GET /users/_doc/123

    返回结果中 found: true 表⽰⽂档存在，_source 字段包含原始 J SON 数据。

    2）如果 ID 不存在，HTTP 状态码返回 404，响应体⾥ found: false 。你可以选择⽤ _source 参数控制是否返

    回源数据，或者⽤ _source_includes 做字段过滤。

    GET /users/_doc/123?_source_includes=name,age

    3）这种操作适合⽤户详情⻚、订单查询这类强依赖主键的场景。像 K ibana 查看单条⽇志，背后也是⽤ ID 快速拉取。

    但别拿它当搜索⽤，模糊匹配得靠 query DSL。

    注意：ID 检索默认是实时的，哪怕刚写⼊就能查到，除⾮你⼿动禁⽤了 refresh 。

    整个过程不⾛查询解析，定位后直接读存储⽂件，延迟通常在毫秒内。'
