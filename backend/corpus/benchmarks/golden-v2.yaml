  expected_knowledge_points:
  - Java 并发
  reference_answer: '根据 Java 并发面试题速记通关版; page 29：什么是 Java 的 CountDownLatch？

    CountDownLatch 的本质是⼀个⼀次性使⽤的同步⼯具，⽤来让⼀个或多个线程等待其他线程完成⼀组操作。它内部

    维护⼀个计数器，初始化时指定需要等待的事件数量。

    1）当某个线程调⽤ countDown() ⽅法，计数器就减 1，这个操作是线程安全的，⽽且不会阻塞调⽤线程。 2）⽽

    其他线程可以调⽤ await() ⽅法来阻塞⾃⼰，直到计数器归零才会继续执⾏。 3）⼀旦计数器归零，所有等待的线

    程会被释放，后续再调⽤ await 也会直接通过，因为这个 latch 已经被触发了。

    ⽐如在 W eb 应⽤启动时，主线程要等 3 个数据加载线程都完成后才开始对外提供服务，就可以初始化⼀个

    CountDownLatch(3)，每个加载线程完成任务后调 countDown ，主线程在 await 上等着就⾏。

    代码上很简单：

    CountDownLatch latch = new CountDownLatch(3);

    // ⼦线程中

    latch.countDown();

    // 主线程中

    latch.await(); // 阻塞直到计数归零

    注意它是⼀次性的，不能重置。如果需要重复使⽤，得换 CyclicBarrier 或者重新 new ⼀个实例。它也不保证线程安

    全的业务逻辑，只是控制执⾏时机，别把它当成数据同步⼿段。'
