  reference_answer: '根据 设计模式面试题速记通关版; page 27：23 种设计模式分为哪三⼤类？

    设计模式这东西，说⽩了就是前⼈踩坑总结出来的套路本⼦。23 种模式⼀般按解决的问题场景分成三类。

    1）创建型模式

    关注对象怎么⽣出来，把创建逻辑和使⽤逻辑拆开。⽐如你⽤ new 直接耦合了具体类，后⾯想换实现就麻烦。⼯⼚⽅

    法、抽象⼯⼚、建造者这些，都是为了让你解耦创建过程。Spring ⾥的 BeanFactory 就是典型的⼯⼚思想。

    2）结构型模式

    重点在怎么组合类或对象形成更⼤的结构。⽐如你想给⽼系统加功能，但⼜不想改原来的代码。适配器模式就能让不

    兼容的接⼝能⼀起⼯作，装饰器模式可以在不修改原类的情况下动态加功能。J ava I/O 流⾥的

    BufferedInputStream 套 FileInputStream 就是装饰器的经典⽤法。

    3）⾏为型模式

    处理对象之间的职责分配和通信机制。⽐如⼀堆条件判断可以换成策略模式，状态切换复杂可以⽤状态模式。观察者

    模式在事件驱动场景⾥特别常⻅，像 Spring 的 ApplicationEvent 事件机制底层就⽤了它。'
