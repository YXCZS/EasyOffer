  reference_answer: '根据 Java 基础面试题速记通关版; page 16：接⼝和抽象类有什么区别？

    接⼝和抽象类虽然都能定义⽅法契约，但它们的定位和能⼒完全不同。

    抽象类本质还是个类，它允许你写具体的⽅法实现，也能定义成员变量。⼦类继承它的时候，可以复⽤⾥⾯已有的代

    码。⽐如你有个 BaseService 抽象类，⾥⾯写了通⽤的⽇志记录逻辑，所有业务服务继承它就能直接⽤。

    接⼝就更纯粹了，从 J ava 8 开始允许默认⽅法实现，但它主要还是⽤来声明“能做什么”。⼀个类可以实现多个接

    ⼝，⽐如 ArrayList 既实现了 List ⼜实现了 RandomAccess 。这在设计扩展点时特别有⽤，像 Spring 的

    ApplicationContextAware 、InitializingBean 都是通过接⼝让 Bean 感知容器⽣命周期。

    1）抽象类强调“是什么”，适合有共同属性和⾏为的场景

    2）接⼝强调“有什么能⼒”，适合解耦和横向扩展

    3）抽象类只能单继承，接⼝可以多实现

    public abstract class Animal {

    protected String name;

    public abstract void makeSound();

    public void sleep() {

    System.out.println("Sleeping...");

    }

    }

    public interface Flyable {

    default void fly() {

    System.out.println("Flying...");

    }

    }

    实际开发⾥，⼀般⽤抽象类做⻣架实现，接⼝定义⾏为规范。像 J DK ⾥的 InputStream 是抽象类，因为有共⽤的

    读取逻辑；⽽ Comparable 就是典型的能⼒接⼝。'
