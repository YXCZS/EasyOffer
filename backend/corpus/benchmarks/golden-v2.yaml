  reference_answer: '根据 Java 基础面试题速记通关版; page 1：你使⽤过哪些 JDK 提供的⼯具？

    J DK ⾃带的⼯具其实是⽇常排查问题的利器，很多场景下压根不需要额外依赖第三⽅⼯具。

    jps 相当于 J ava 版的 ps，能快速列出当前机器上所有正在运⾏的 J ava 进程 PID。排查多实例部署时特别有⽤，⼏秒

    钟就能定位到⽬标进程。

    jstat 是看 J VM 运⾏状态最轻量的⽅式，尤其是监控 G C 频率和堆内存变化。⽐如想确认是不是频繁 Full G C，⽤

    jstat -gcutil <pid> 1000 每秒打⼀次数据，趋势⼀⽬了然。

    jstack 对应线程分析，定位死锁或⾼ CPU 很直接。拿到进程 PID 后执⾏ jstack <pid> ，输出的线程栈⾥如果看到

    W AITING 状态集中在某个锁对象，基本就能锁定问题点。线上服务响应卡顿，第⼀反应就是抓 thread dum p 看有没

    有线程堆积。

    jm ap 可以导出堆内存快照，配合 jhat 或 M AT 分析内存泄漏。不过要注意的是，jmap -dump 在堆⼤的时候会触发

    ⻓时间 STW ，⽣产环境得谨慎操作。

    其实从 J DK 8 开始，Arthas 虽然是阿⾥开源的，但已经成了事实标准。它把上⾯这些命令都整合了，还能动态 trace

    ⽅法调⽤、watch 参数返回值，排查线上问题效率提升⾮常明显。'
