  reference_answer: '根据 设计模式面试题速记通关版; page 9：什么是状态模式？⼀般⽤在什么场景？

    状态模式本质上是把对象的⾏为包装在不同状态类⾥，让对象在运⾏时通过切换状态类来改变⾏为。你不⽤写⼀堆 if-

    else 判断当前状态再执⾏对应逻辑，⽽是让“状态”⾃⼰决定该⼲什么。

    1）每个状态都实现统⼀接⼝，⽐如 handle() ⽅法，具体⾏为由⼦类实现

    2）上下⽂（Context）持有⼀个状态实例，所有请求都委托给当前状态处理

    3）状态之间可以互相转换，⽐如订单从“待⽀付”变成“已发货”

    这种模式特别适合状态多、状态转换复杂、每个状态⾏为差异⼤的场景。举个例⼦，电商系统的订单状态机⸺待⽀

    付、已⽀付、已发货、已完成、已取消，如果全⽤ if-else 堆在⼀起，改⼀个状态跳转就得动整个⽅法，后期根本搞不

    定。⽤状态模式，每个状态独⽴封装，新增状态或修改流转只影响对应类。

    游戏开发⾥也常⻅，⽐如⻆⾊有“ idle ”、“running”、“attacking”状态，不同状态下按键响应完全不同，⽤状态模

    式就很清晰。

    interface OrderState {

    void pay(OrderContext ctx);

    void ship(OrderContext ctx);

    }

    class PendingPayment implements OrderState {

    public void pay(OrderContext ctx) {

    ctx.setState(new Shipped());

    }

    public void ship(OrderContext ctx) { /* 不允许操作 */ }

    }

    状态模式真正发⼒的点在于它让状态变更和⾏为扩展变得可控。你不再是在⼀个⼤类⾥修修补补，⽽是⽤多态代替条

    件判断，代码结构更稳定。

    什么是设计模式？请简述其作⽤。

    设计模式不是语法也不是框架，它是前⼈总结出的、针对特定问题的可复⽤解决⽅案模板。本质上是代码结构和组织

    ⽅式的经验结晶。

    1）解决重复出现的设计问题

    什么是设计模式？请简述其作⽤。

    设计模式不是语法也不是框架，它是前⼈总结出的、针对特定问题的可复⽤解决⽅案模板。本质上是代码结构和组织

    ⽅式的经验结晶。

    1）解决重复出现的设计问题

    ⽐如对象创建太散乱，就⽤⼯⼚模式统⼀出⼝；系统耦合太紧，就引⼊观察者模式解耦。Spring ⾥的 BeanFactory 就

    是简单⼯⼚的体现，M yBatis 的插件机制⽤了责任链。

    2）提升代码可维护性和扩展性

    以策略模式为例，不同算法独⽴封装，新增逻辑不⽤改原有 if-else。电商项⽬⾥计算运费、优惠规则基本都这么⼲。

    3）提供通⽤语⾔

    团队沟通时说“这⾥⽤模板⽅法”，⽐解释“⽗类定流程⼦类重步骤”更⾼效。就像说“M VC”⼤家⽴刻明⽩分层结

    构。

    注意别过度设计。⼩项⽬硬套 23 种模式反⽽搞复杂了。G OF 提出的分类（创建型、结构型、⾏为型）可以作为学习路

    线图，但实战中按需选⽤才是正道。'
