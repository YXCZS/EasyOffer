  reference_answer: '根据 MyBatis 面试题速记通关版; page 5：M yBatis 动态 sql 有什么⽤？执⾏原理？有哪些动态 sql？

    动态 SQL 是为了解决拼接 SQL 字符串的痛点。你肯定遇到过根据条件决定是否添加 W HERE ⼦句的情况，以前靠⼿拼

    字符串，容易出错还难维护。

    M yBatis 的动态 SQL 在解析阶段就把这些逻辑处理掉，最终⽣成⼀个⼲净的 SQL 语句交给数据库执⾏。整个过程发⽣

    在 SqlSource 构建时，通过 OG NL 表达式计算条件，⽣成对应的 BoundSql。

    常⻅的标签有这⼏个：

    1）<if> 最常⽤，条件成⽴才拼⼊ SQL

    2）<where> ⾃动处理 AND/OR 开头问题，条件为空时不⽣成 W HERE

    3）<set> 配合 update 使⽤，⾃动加 SET 关键字并去掉末尾逗号

    4）<trim> 更底层的封装，可以⾃定义前后缀和前缀后缀去除规则

    5）<foreach> 遍历集合，常⽤于 IN 查询或批量插⼊

    6）<choose> 、<when> 、<otherwise> 类似 J ava 的 switch-case

    ⽐如写个查询：

    <select id="list" resultType="User">

    SELECT * FROM user

    <where>

    <if test="name != null">AND name = #{name}</if>

    <if test="age != null">AND age = #{age}</if>

    </where>

    </select>

    传 null 参数时，对应条件直接消失，不会影响其他部分。

    注意 <if> 标签别乱堆，复杂场景⽤ <trim> 控制更精准。像 IN 查询这种必须⽤ <foreach> ，不然搞不定参

    数绑定。'
