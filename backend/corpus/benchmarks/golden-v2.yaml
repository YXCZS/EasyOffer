  reference_answer: '根据 Nginx 面试题速记通关版; page 23：Nginx 配置⽂件 nginx.conf 中的属性模块有哪些？

    Nginx 的配置⽂件结构其实是个树形嵌套模型，核⼼是通过作⽤域把指令分⻔别类。这些“模块”不是独⽴组件，⽽

    是配置块（block），每个块控制特定场景下的⾏为。

    1）m ain 全局块

    这是最外层，管的是 worker 进程数、⽇志路径、运⾏⽤户这类全局设置。⽐如 worker_processes auto; 就在

    这⾥，决定启动⼏个⼯作进程。

    2）events 块

    控制连接处理模型，⽐如⽤ epoll 还是 select，单个进程能打开的最⼤连接数 worker_connections 1024; 。这

    直接影响并发能⼒。

    3）http 块

    这是重点，⼏乎所有 W eb 服务配置都在这。它包含 M IM E 类型定义、默认编码、⽇志格式，还能嵌套多个 server 块。

    像静态资源、反向代理、G zip 都在这配。

    4）server 块

    代表⼀个虚拟主机，可以基于域名或 IP 端⼝区分。⽐如你部署了 api.exam ple.com 和 www.exam ple.com ，就⽤两

    个 server 块做路由隔离。

    5）location 块

    在 server 内部，按 U RI 路径匹配请求。⽐如 /static/ ⾛静态⽂件，/api/ 转发给后端 Spring Boot 服务，⽤

    proxy_pass http://localhost:8080; 实现。

    6）upstream 块（常配合 http 使⽤）

    定义后端服务器组，实现负载均衡。⽐如把请求分到 3 台 Tom cat，⽤轮询或加权⽅式。

    搞不定配置顺序？记住：全局 → 事件模型 → HTTP 框架 → 虚拟主机 → 路径规则，层层细化。'
