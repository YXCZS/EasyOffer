- query_id: g-092
  scenario_type: stable_technical
  topic: 计算机网络
  query: '计算机网络: TCP 和 UDP 有什么区别？'
  role: backend
  difficulty: medium
  expected_technologies:
  - 计算机网络
  relevance:
    0fd996d3edc461fde87da35768d8b95e2706d34c72ba2e7887c88c5e27523203: 2
  expected_knowledge_points:
  - 计算机网络
  reference_answer: '根据 计算机网络面试题速记通关版; page 9：TCP 和 UDP 有什么区别？

    TCP 和 U DP 的本质区别在于，⼀个追求可靠交付，⼀个追求极致效率。

    TCP 会建⽴连接，通过三次握⼿确认双⽅收发能⼒没问题，数据包丢了会重传，顺序乱了会重新排序，保证你收到的

    数据和发送的⼀致。像 HTTP、数据库连接这些不能出错的场景都⽤它，背后是 可靠性 在撑腰。

    U DP 完全不握⼿，发出去就完事，不管对⽅听没听到。没有重传、没有流量控制，但正因为没这么多约束，性能⾼、

    延迟低。⾳视频通话⽤ U DP 多，⽐如 W ebRTC，偶尔丢个包顶多画⾯卡⼀下，总⽐延迟⾼强。

    1）TCP 有连接状态，维护成本⾼，并发百万连接对服务器资源消耗⼤

    2）U DP ⽆状态，每个包独⽴处理，天⽣适合做⼴播、组播，像 DNS 查询、DHCP 分配 IP 都靠它

    3）TCP 头部⾄少 20 字节，U DP 只有 8 字节，头部开销⼩⼀半以上

    代码上看也很直观：

    // UDP 发送⽚段

    DatagramSocket socket = new DatagramSocket();

    byte[] data = "hello".getBytes();

    InetAddress addr = InetAddress.getByName("127.0.0.1");

    DatagramPacket packet = new DatagramPacket(data, data.length, addr, 8080);

    socket.send(packet); // 扔出去就不管了

    // TCP 发送⽚段

    Socket socket = new Socket("127.0.0.1", 8080);

    OutputStream out = socket.getOutputStream();

    out.write("hello".getBytes()); // 写完也不⼀定⽴刻发，内核会缓冲

    简单说，要准确就选 TCP，要快就选 U DP。没有谁更好，只有合不合适。'
