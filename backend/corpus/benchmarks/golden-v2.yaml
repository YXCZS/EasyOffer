  reference_contexts:
  - '来源：Java 集合面试题速记通关版; page 12

    为什么 J ava 中 HashM ap 的默认负载因⼦是 0.75？

    负载因⼦（load factor）决定了 HashM ap 什么时候扩容。默认值 0.75 是空间和时间成本之间的⼀个权衡结果。

    1）如果负载因⼦太⼩，⽐如 0.5，那数组还没装满就触发扩容，内存利⽤率低，但冲突少，查找快。

    2）如果负载因⼦太⼤，⽐如 0.9，内存⽤得更满，但哈希冲突概率显著上升，链表变⻓，查找性能下降。

    HashM ap 的设计⽬标是在平均情况下实现 O(1) 的存取效率。0.75 这个值能让哈希桶的填充程度适中，在不浪费太多

    空间的前提下，把冲突控制在可接受范围。

    J DK 源码注释⾥也提过，基于泊松分布统计，当负载因⼦为 0.75 时，⼀个桶⾥链⻓度超过 8 的概率极低，这和红⿊树

    转换阈值的设计也能对上。

    代码上看，初始化时如果不指定，就是 0.75：

    public HashMap() {

    this.loadFactor = 0.75f;

    }

    实际开发中，如果你知道数据量会很⼤且稳定，可以提前算好容量，避免频繁 rehash。⽐如要存 1000 个元素，按

    0.75 算，初始容量⾄少设成 1000 / 0.75 ≈ 1333 ，再向上取最接近的 2 的幂，也就是 2048。'
