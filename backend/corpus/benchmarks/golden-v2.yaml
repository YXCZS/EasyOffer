  relevance:
    0cb9ee771e1083799a218208ebfbc59f055fad5c0fa275d2f2bea26580d4adb3: 2
  expected_knowledge_points:
  - Java 基础
  reference_answer: '根据 Java 基础面试题速记通关版; page 8：JDK 和 JRE 有什么区别？

    J DK 是给开发者⽤的，它⾥⾯不仅包含了写 J ava 代码需要的编译器、调试⼯具，还打包了 J RE。你可以把它看作⼀个

    完整的开发套件。

    J RE 则是运⾏ J ava 程序的基础环境，它包含 J VM 和运⾏时需要的核⼼类库。⽐如你只是想跑⼀个别⼈写好的 .jar ⽂

    件，装 J RE 就够了，不需要编译功能。

    所以关键在于⽤途不同：开发选 J DK ，纯运⾏选 J RE。

    打个⽐⽅，J DK 像是整套厨房设备，有⼑具、灶台、调料（编译、调试、运⾏全都有），⽽ J RE 只是⼀个微波炉，负责

    把做好的饭菜热⼀下（只负责运⾏）。

    现在主流的 J DK 发⾏版，像 OpenJ DK 、Oracle J DK 或者国内常⽤的 Alibaba Dragonwell，其实都⾃带了 J RE，安装

    后可以直接编译也能直接运⾏程序。

    1）J DK 包含 J RE，J RE 包含 J VM

    2）没有 J DK 也能运⾏ J ava 程序，只要有 J RE

    3）javac 命令在 J RE 中不可⽤，因为它属于编译⼯具，只存在于 J DK

    ⾯试如果问到，记住⼀句话就⾏：J DK 是开发环境，J RE 是运⾏环境。'
