  - Java 集合
  reference_answer: '根据 Java 集合面试题速记通关版; page 9：J ava 中 ConcurrentHashM ap 1.7 和 1.8
    之间有哪些区别？

    ConcurrentHashM ap 的演进其实是个典型的“从锁竞争到 CAS + synchronized 优化”的过程，1.7 到 1.8 的改动⼏

    乎是重写级别。

    1.7 ⽤的是分段锁 Segm ent，每个 Segm ent 是⼀个 ReentrantLock 保护的⼩哈希表。默认 16 个 Segm ent，意味着

    最多 16 个线程能并发写。⼀旦线程数超过这个数，后⾯的就只能阻塞等待锁。Segm ent 继承⾃ ReentrantLock，结

    构复杂，内存占⽤也⾼。

    到了 1.8，直接抛弃了 Segm ent，改⽤ CAS + synchronized 控制并发。Node 数组加链表/红⿊树，写操作对数组桶

    位加 synchronized 锁，粒度更细。读操作完全⽆锁，靠 volatile 保证可⻅性。扩容时还能⽀持并发迁移，由多个线程

    ⼀起搬数据。

    另⼀个关键变化是哈希冲突的处理。1.7 是纯链表，容易在极端情况下退化成 O(n)。1.8 引⼊了链表转红⿊树机制，当

    链表⻓度超过 8 且数组⻓度⼤于 64，就转换成红⿊树，查找性能从 O(n) 提升到 O(log n)，抗攻击能⼒更强。

    扩容效率也提升了。1.8 ⽤了“多线程协助扩容”机制，⼀个线程发现需要扩容，可以只负责搬⼀部分桶，其他线程写

    数据时也会顺⼿帮忙搬，真正做到并发扩容。'
