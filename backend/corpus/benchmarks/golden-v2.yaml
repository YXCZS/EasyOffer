- query_id: g-093
  scenario_type: stable_technical
  topic: 计算机网络
  query: '计算机网络: TCP 中何时会出现 RST（reset）报⽂？'
  role: backend
  difficulty: medium
  expected_technologies:
  - 计算机网络
  relevance:
    21b437e4fea46ed8c081cba7786e865adb299121f3a61f513c26a7f9ca2641a0: 2
  expected_knowledge_points:
  - 计算机网络
  reference_answer: '根据 计算机网络面试题速记通关版; page 1：TCP 中何时会出现 RST（reset）报⽂？

    RST 报⽂是 TCP 连接中的⼀种强制终⽌信号，表⽰当前连接出现了异常或不可恢复的状态，直接“掐断”连接。

    1）当客户端向⼀个没有监听的端⼝发起连接请求时，服务端会回⼀个 RST。⽐如你往 8080 端⼝发 SYN，但那边根本

    没开服务，内核协议栈就会直接回 RST，告诉对⽅“这地⽅没⼈，别连了”。

    2）连接已经关闭后，如果还有残留数据包发过来，接收⽅会回 RST。典型场景是连接被 close() 了，但对端还懵着继

    续 send，收到后内核发现这个连接在本地已经没了，就直接 RST 告辞。

    3）TCP 协议栈检测到序列号不合法也会触发 RST。⽐如你发了个 ACK 包，但 seq 不在当前连接的接收窗⼝内，系统

    判断这是个错包或伪造包，⼲脆 RST 断掉，防⽌状态混乱。

    4）程序崩溃或进程被杀，操作系统回收 socket 时，可能来不及发 FIN，对端还在发数据，这时候也会由内核代发

    RST。和正常四次挥⼿不同，RST 是硬断，压根不经过握⼿流程。

    代码上没法主动控制 RST 发送，它是内核协议栈的⾏为。但你可以通过 SO_LINGER 设置为 0 来让 close() 时直接发

    RST ⽽不是等待 FIN，⽤于快速释放连接。

    这种机制保证了 TCP 的健壮性，避免⽆效连接堆积。但频繁出现 RST 通常意味着架构设计或⽹络配置有问题，⽐如负

    载均衡转发到了未就绪实例，或者客户端重试逻辑太激进。'
  reference_context_ids:
  - 21b437e4fea46ed8c081cba7786e865adb299121f3a61f513c26a7f9ca2641a0
  reference_contexts:
  - '来源：计算机网络面试题速记通关版; page 1

    TCP 中何时会出现 RST（reset）报⽂？

    RST 报⽂是 TCP 连接中的⼀种强制终⽌信号，表⽰当前连接出现了异常或不可恢复的状态，直接“掐断”连接。

    1）当客户端向⼀个没有监听的端⼝发起连接请求时，服务端会回⼀个 RST。⽐如你往 8080 端⼝发 SYN，但那边根本

    没开服务，内核协议栈就会直接回 RST，告诉对⽅“这地⽅没⼈，别连了”。

    2）连接已经关闭后，如果还有残留数据包发过来，接收⽅会回 RST。典型场景是连接被 close() 了，但对端还懵着继

    续 send，收到后内核发现这个连接在本地已经没了，就直接 RST 告辞。

    3）TCP 协议栈检测到序列号不合法也会触发 RST。⽐如你发了个 ACK 包，但 seq 不在当前连接的接收窗⼝内，系统

    判断这是个错包或伪造包，⼲脆 RST 断掉，防⽌状态混乱。

    4）程序崩溃或进程被杀，操作系统回收 socket 时，可能来不及发 FIN，对端还在发数据，这时候也会由内核代发

    RST。和正常四次挥⼿不同，RST 是硬断，压根不经过握⼿流程。

    代码上没法主动控制 RST 发送，它是内核协议栈的⾏为。但你可以通过 SO_LINGER 设置为 0 来让 close() 时直接发

    RST ⽽不是等待 FIN，⽤于快速释放连接。

    这种机制保证了 TCP 的健壮性，避免⽆效连接堆积。但频繁出现 RST 通常意味着架构设计或⽹络配置有问题，⽐如负

    载均衡转发到了未就绪实例，或者客户端重试逻辑太激进。'
