  reference_answer: '根据 Java 并发面试题速记通关版; page 16：Synchronized 能不能禁⽌指令重排序？

    synchronized 主要解决的是互斥性和可⻅性问题，它能保证同⼀时刻只有⼀个线程进⼊同步块，同时对共享变量的修

    改对后续进⼊的线程可⻅。⾄于指令重排序，它确实能限制⼀部分，但不是靠插⼊内存屏障那种精细控制。

    J ava 内存模型⾥，synchronized 的实现依赖于 m onitor enter 和 exit，m onitor enter 会触发⼀个 acquire
    操作，

    exit 会触发 release 操作。acquire-release 语义能保证：在 m onitor exit 之前的所有写操作，对下⼀次 acquire
    同⼀

    把锁的线程来说都是可⻅的，并且不会被重排序到 exit 之后。同理，acquire 之后的操作也不会被重排序到它之前。

    这相当于在锁释放时，把之前的写操作都“刷出去”，在获取锁时，强制重新加载共享变量。所以从效果上看，多个线

    程通过同⼀把锁同步时，不会看到彼此内部的指令重排结果。

    但它不像 volatile 那样针对单个变量做读写屏障，它的边界是整个同步块。你不能指望 synchronized 去禁⽌某个特定

    变量的重排序，如果需要更细粒度控制，得⽤ volatile 或显式内存屏障。

    1）锁的作⽤范围是代码块，不是变量

    2）它靠 acquire-release 语义间接抑制重排

    3）⽐ volatile 更重，但适合复合操作

    说⽩了，它能“顺便”管住重排序，但不是为此设计的。'
