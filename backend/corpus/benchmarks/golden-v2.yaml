  reference_answer: '根据 Java 虚拟机面试题速记通关版; page 18：什么是 Java 的 AOT（Ahead-Of-Time）？

    AOT 指在程序运⾏前就把字节码编译成机器码，和传统的 J IT（运⾏时编译）反过来。J ava ⻓期依赖 J VM 的即时编

    译，启动慢、内存占⽤⾼，尤其在云原⽣场景下成了短板。

    G raalVM 提供了 native-im age ⼯具实现 AOT 编译，能把 J ava 程序打成⼀个独⽴的可执⾏⽂件。这个过程会做静态

    分析，把⽤到的类、⽅法、反射信息全提前编译进去。结果是启动速度从秒级压到⼏⼗毫秒，内存占⽤也直接砍掉⼀

    ⼤半。

    但代价不⼩。⾸先，所有动态特性得⼿动配置，⽐如反射、动态代理、资源加载，都得通过配置⽂件告诉编译器。其

    次，不⽀持 Class.forNam e 这种运⾏时加载类的操作，连 java.lang.Thread 的某些 API 都受限。Spring Boot 早

    期版本完全跑不起来，直到推出 Spring Native 才逐步适配。

    适合⽤ AOT 的场景很明确：短⽣命周期、⾼并发拉起的服务，⽐如 Serverless 函数。FaaS 平台要求百毫秒内启动，

    传统 J VM 压根扛不住，这时候 native im age 就能派上⽤场。但常规的⻓驻 W eb 服务，J IT 的热点优化能⼒还是更

    强，AOT 反⽽可能跑不过。

    代码层⾯没啥特别，加个插件就⾏：

    // pom.xml ⽚段

    <plugin>

    <groupId>org.graalvm.buildtools</groupId>

    <artifactId>native-maven-plugin</artifactId>

    </plugin>

    构建后⽣成的是⼆进制⽂件，直接 ./app 启动，不依赖 J RE。'
