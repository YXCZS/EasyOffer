- query_id: g-049
  scenario_type: stable_technical
  topic: Nginx
  query: 'Nginx: 什么是 LVS？Nginx 和 LVS 有什么区别？'
  role: backend
  difficulty: medium
  expected_technologies:
  - Nginx
  relevance:
    160dd5ec249481a62e054e4e4cc5067e32ffdc85e93b431b32ec1487c8b82b31: 2
  expected_knowledge_points:
  - Nginx
  reference_answer: '根据 Nginx 面试题速记通关版; page 49：什么是 LVS？Nginx 和 LVS 有什么区别？

    LVS 其实就是 Linux 虚拟服务器，说⽩了它是在操作系统内核层做的负载均衡。你发⼀个请求过来，LVS 在⽹络包到达

    服务器的第⼀时间就决定转发给后端哪台机器，压根不经过应⽤层，所以性能特别猛，单机扛⼏百万并发都可能。

    Nginx 也做负载均衡，但它⼯作在应⽤层（七层），能看 HTTP 头、U RL、Host 这些信息，做更灵活的路由，⽐如把

    /api 转到 A 服务，/static 转到 CDN。但它是反向代理，请求得先被 Nginx 接收再转发出去，多了⼀道，性能

    上限⽐ LVS 低⼀些。

    1）LVS ⼯作在⽹络四层，基于 IP 和端⼝做转发，常⻅模式有 NAT、DR 和 TU N。DR 模式最常⽤，转发效率⾼，响应

    可以直接从后端机器返回客户端，不需要经过 LVS。

    2）Nginx 是七层代理，功能更丰富，⽀持限流、缓存、重写、SSL 终⽌等，适合做⽹关⼊⼝。

    3）实际架构⾥，经常是 LVS + Nginx 搭配⽤。LVS 放前⾯抗住连接洪峰，后⾯挂⼀批 Nginx 做精细流量调度，⽐如阿

    ⾥早期的架构就是这么玩的。

    简单说，LVS 是⼲⾼并发转发的脏活累活，Nginx 是做精细化流量治理的好⼿，两者层级不同，经常是配合关系，不是

    ⾮此即彼。'
