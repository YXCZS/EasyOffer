  reference_answer: '根据 Java 虚拟机面试题速记通关版; page 10：Java ⾥的对象在虚拟机⾥⾯是怎么存储的？

    J ava 对象在虚拟机⾥的存储，得从内存布局说起。对象创建后主要分布在堆上，⽽它的内存结构可以拆成三块：对象

    头、实例数据和对⻬填充。

    对象头⾥存了两样东西，⼀个是 M ark W ord，⽤来放哈希码、G C 分代年龄、锁状态这些信息；另⼀个是指向类元数据

    的指针，J VM 靠它确定这个对象是哪个类的实例。如果是数组，这⾥还会多出⼀个记录⻓度的字段。

    接下来是实例数据，这部分最实在，就是你定义的那些成员变量，按声明顺序排列，⽗类的变量也会包含进来。J VM

    会按 long/double、int、short/char、byte/boolean 这样的顺序重新排序，⽬的是为了内存对⻬，减少空间浪费。

    最后是对⻬填充，不是必须的。因为 J VM 要求对象⼤⼩必须是 8 字节的整数倍，不够就得补上。

    这种布局⽅式直接影响 G C 和并发性能。⽐如 synchronized 锁升级过程就会修改 M ark W ord 的内容，从⽆锁到偏向

    锁、轻量级锁再到重量级锁，都是在这块做⽂章。理解这块结构，对排查竞争激烈时的性能问题很有帮助。'
