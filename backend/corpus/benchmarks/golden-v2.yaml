  reference_answer: '根据 设计模式面试题速记通关版; page 18：什么是组合模式？⼀般⽤在什么场景？

    组合模式解决的是树形结构的统⼀处理问题。你有⼀堆对象，它们之间是⽗⼦关系，形成⼀个树，你想让客户端不管

    是操作根节点、分⽀还是叶⼦，都⽤同⼀套接⼝。

    1）它把对象组织成树形结构，每个节点要么是容器（组合节点），要么是叶⼦节点。关键是，容器和叶⼦都实现同⼀

    个抽象接⼝，这样上层调⽤者就不需要关⼼当前操作的是不是还有⼦节点。

    2）典型场景⽐如⽂件系统，⽬录可以包含⽂件和其他⽬录，但你可以对它们统⼀调⽤ getSize() 或

    delete() 。再⽐如 U I 组件，窗⼝包含⾯板，⾯板包含按钮，但所有组件都能响应 draw() 调⽤。

    3）另⼀个常⻅例⼦是菜单系统。像 Swing 或 J avaFX 中的菜单项和⼦菜单，都可以被点击或渲染，组合模式让遍历和

    操作变得简单。

    代码核⼼就是⼀个 Component 接⼝，定义通⽤⾏为，然后 Composite ⾥维护⼀个 List<Component> ⼦节点

    列表，调⽤时递归下去。

    这种模式的好处是扩展性强，加新类型的节点不影响原有逻辑。但缺点也很明显，如果节点类型差异⼤，强⾏统⼀接

    ⼝会让很多⽅法在某些⼦类⾥空实现，有点别扭。⽤的时候得看场景是否真的具备树形 + 统⼀操作的特征。'
