  reference_answer: '根据 MyBatis 面试题速记通关版; page 5：M yBatis 与 Hibernate 有哪些不同？

    M yBatis 和 Hibernate 都是 J ava ⾥处理数据库操作的 ORM 框架，但设计哲学差得挺远。

    Hibernate 是全⾃动化的，你定义好实体类和映射关系，增删改查基本不⽤写 SQL，它⾃动⽣成并执⾏。⽐如⽤

    Session.save(entity) 就能把对象存进数据库，连事务都帮你管好了。这种适合业务规则稳定、表结构规范的

    项⽬，像传统企业管理系统⽤ Hibernate 能省不少事。

    M yBatis 则是半⾃动的，SQL 得⾃⼰写，通过 XM L 或注解把参数和结果集跟 J ava 对象做映射。⽐如⼀个带多表关联

    的查询，你可以精确控制 SQL 的每⼀部分，性能调优更⽅便。互联⽹公司搞⾼并发、复杂查询时，普遍选 M yBatis，

    毕竟对 SQL 的掌控⼒更强。

    1）Hibernate 抹平了数据库差异，HQL 可以跨数据库运⾏，迁移成本低

    2）M yBatis 直接暴露 SQL，灵活性⾼，但换数据库时可能要重写语句

    3）Hibernate 有完整的缓存体系（⼀级、⼆级缓存），M yBatis 缓存功能相对简单

    举个例⼦，做报表查询这种字段多、条件动态拼接的场景，Hibernate 很难搞定，SQL 不透明，拼起来费劲。M yBatis

    直接写原⽣ SQL，配合动态标签 <if> 、<choose> 处理条件，⼲净利落。

    总的来说，追求开发效率、少写 SQL ⽤ Hibernate；需要精细控制 SQL、应对复杂场景就上 M yBatis。'
