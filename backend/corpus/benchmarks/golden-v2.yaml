  reference_answer: '根据 消息队列面试题速记通关版; page 6：RabbitMQ 中主要有哪⼏个⻆⾊或者说概念？

    RabbitM Q 的模型设计其实挺清晰的，搞懂⼏个关键⻆⾊，⽤起来就顺了。

    ⽣产者不直接把消息丢给队列，⽽是发给 Exchange。这玩意⼉像个路由器，拿到消息后根据类型和绑定规则，决定

    往哪个队列送。

    队列（Queue）就是存消息的地⽅，FIFO 原则，⼀条消息通常只被⼀个消费者处理。它在 RabbitM Q ⾥是实际承载数

    据的实体，可以持久化、设置⻓度限制等。

    Exchange 怎么知道该把消息给哪个 Queue？靠的是 Binding 绑定规则。⽐如 Direct 类型按 routing key 精确匹配，

    Topic ⽀持通配符，Fanout 直接⼴播。

    消费者从 Queue ⾥取消息，处理完要发个确认（ACK），不然 RabbitM Q 会认为没处理成功，可能重新投递。⽹络断

    了或者消费者挂了，也能靠这个机制保证消息不丢。

    整个链路就是：⽣产者 → Exchange → Queue → 消费者，中间靠 Binding 和 Routing Key 控制流向。

    这种解耦设计让系统扩展性很强，⽐如换个 Exchange 类型就能实现⼴播或按规则分发，代码不⽤⼤改。'
