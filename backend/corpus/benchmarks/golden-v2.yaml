  reference_answer: '根据 Elasticsearch 面试题速记通关版; page 10：什么是 Elasticsearch 的 Docum
    ent ⽂档？如何存储和检索⽂档？

    Elasticsearch 的⽂档是数据存储和检索的基本单位，相当于数据库中的⼀⾏记录，但它是以 J SON 格式存在的。每个

    ⽂档由字段（ﬁeld）组成，字段可以是字符串、数字、对象等类型，不需要预定义所有字段，具备⼀定的灵活性。

    ⽂档存⼊ ES 时，会先根据 _index 、_type （旧版本）和 _id 确定位置，然后被序列化为 J SON 并写⼊倒排索

    引和正排索引中。倒排索引⽤于快速查找关键词对应的⽂档，⽽正排索引（如 _source 字段）保存原始 J SON，⽤

    于查询时返回内容。

    ⽂档的存储流程如下：

    检索时通过 G ET 请求指定索引和 ID 可直接定位⽂档，属于精确查找，性能很⾼。如果⽤查询语句（如 match ），则

    会利⽤倒排索引扫描匹配项，再从 _source 中提取原始数据返回。

    需要注意的是，⽂档写⼊后近实时可⻅，不是⽴即可查，除⾮⼿动 refresh。每次 refresh 会⽣成新的 segm ent，频繁

    操作会影响性能，⼀般⽣产环境设为 30 秒⼀次。

    批量写⼊建议⽤ _bulk API，减少⽹络开销和 segm ent 合并压⼒。单⽂档操作适合低频场景，⾼并发写⼊得靠 bulk

    扛住。'
