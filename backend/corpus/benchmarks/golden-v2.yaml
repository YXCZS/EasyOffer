  reference_answer: '根据 Spring 面试题速记通关版; page 16：Spring 中的 @SessionAttribute 注解的作⽤是什么？

    ⽤来从当前 HTTP 会话中获取已存在的属性，通常⽤于处理⽤户登录状态或跨请求共享数据。它不是创建 session 属

    性的注解，⽽是假设 session 中已经有对应值，直接拿来⽤。

    如果 session 中没有找到对应属性，默认会抛出异常，除⾮设置 required = false 。这和

    @RequestAttribute 类似，都是“取已有”的逻辑，⽽不是“存”或“创建”。

    常⻅于需要强依赖登录⽤户信息的场景，⽐如管理员后台接⼝，要求⽤户必须已登录且 session 中有 user 对象。

    @GetMapping("/profile")

    public String getProfile(@SessionAttribute("user") User user, Model model) {

    model.addAttribute("user", user);

    return "profile";

    }

    1）只能获取已经存在于 session 中的属性，不会⾃动创建

    2）适⽤于前后端不分离的传统 M VC 场景，⽐如 Thym eleaf ⻚⾯渲染

    3）在 Spring Security 集成时，常配合认证后的⽤户信息提取使⽤

    现代 W eb 应⽤越来越多采⽤⽆状态设计，像 J W T 这类⽅案让服务端不再维护 session，这种情况下

    @SessionAttribute ⽤得越来越少。但在⼀些内部系统、企业应⽤⾥，基于 session 的认证还是主流，这时候它

    依然是个简单可靠的⼯具。'
