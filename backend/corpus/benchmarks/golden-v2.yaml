  reference_answer: '根据 AI 大模型原理和应用面试题速记通关版; page 57：LLM Agent 在多模态任务中如何执⾏推理？

    多模态任务⾥，LLM Agent 的推理不是简单看图说话，⽽是把⽂本、图像、⾳频这些不同模态的信息统⼀拉到⼀个向

    量空间⾥做对⻬。模型在预训练阶段就⻅过⼤量图⽂对，⽐如⽤ CLIP 这类结构把图⽚和⽂字映射到同⼀语义空间，这

    样⼀张“狗追球”的图，能和对应描述在特征上挨得特别近。

    1）输⼊进来时，图像⾛视觉编码器（⽐如 ViT）转成 patch em beddings，⽂本⾛ tokenizer 转成 token

    em beddings，两者⻓度不⼀样没关系，关键是通过交叉注意⼒让 LLM 主⼲能“看⻅”图像特征。 2）推理过程中，

    LLM 不是只靠记忆⽣成答案，⽽是结合上下⽂做因果推断。⽐如问“图中动物在⼲什么”，它会关联“奔跑”、“草

    地”、“球体运动轨迹”这些视觉线索，⽣成“狗在追球”⽽不是“狗在睡觉”。 3）有些复杂任务还会引⼊外部⼯具调

    ⽤，⽐如先识别图像中的数学公式，再丢给 Sym Py 计算，最后把结果整合进回答⸺这步就是 agent 的规划能⼒体

    现。

