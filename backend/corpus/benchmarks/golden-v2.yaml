- query_id: g-088
  scenario_type: stable_technical
  topic: 消息队列
  query: '消息队列: RocketMQ 的延迟消息是怎么实现的？'
  role: backend
  difficulty: medium
  expected_technologies:
  - 消息队列
  relevance:
    1ec1bf1f83707776b652f54c3ca640fced41ac5198a40daf20c7e10738c05e57: 2
  expected_knowledge_points:
  - 消息队列
  reference_answer: '根据 消息队列面试题速记通关版; page 3：RocketMQ 的延迟消息是怎么实现的？

    延迟消息不是直接把消息塞进队列就完事了，它得在指定时间之后才能被消费者看到。RocketM Q 的做法很巧妙，不

    直接⽤定时器去算每个消息啥时候投递，因为那样太吃内存和CPU ，扛不住百万级的延迟任务。

    它靠的是⼀个叫“延迟等级”的机制。你发消息时设置⼀个延迟等级，⽐如3秒后投递是等级1，5秒是等级2，最多⽀

    持18个等级，对应不同的延迟时间。消息进来后，Broker 把它当成普通消息写⼊⼀个专⻔的存储队列⸺

    SCHEDULE_TOPIC_XXXX ，但这个主题消费者看不到。真正决定什么时候投递的，是后台有个定时任务，每秒扫⼀

    遍这些延迟队列，看哪些消息已经到了投递时间，就把它当成普通消息重新发回给原始 topic。

    这样做的好处是，延迟逻辑完全解耦，压根不经过客户端，也不依赖外部调度系统，脏活累活都由 Broker ⾃⼰兜住。

    代码上其实很简单：

    Message msg = new Message("TopicTest", "Hello World".getBytes());

    msg.setDelayTimeLevel(3); // 延迟 10s

    SendResult result = producer.send(msg);

    常⻅坑是：很多⼈以为可以⾃定义任意延迟时间，其实只能⽤预设的等级。你想延时 30 秒？得看配置⾥有没有这⼀

    档。另外，如果 Broker 重启，正在处理的延迟消息会不会丢？不会，因为它落了盘。'
