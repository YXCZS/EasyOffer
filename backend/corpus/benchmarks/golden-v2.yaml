  reference_answer: '根据 Java 虚拟机面试题速记通关版; page 6：什么是 Java 中的 logging write barrier？

    J ava 中的 logging write barrier 其实是垃圾回收过程中⽤来追踪对象引⽤变化的⼀种机制，主要⽤在像 G 1 或 ZG C 这

    类关注并发标记的收集器⾥。

    它不直接“记录⽇志”到⽂件，⽽是把对象引⽤的修改，⽐如 obj.field = newRef ，这种写操作记下来。因为并

    发标记阶段⽤户线程还在跑，对象图可能随时变，write barrier 就是在每次引⽤字段被修改时插⼀段逻辑，把这次变

    更记录到⼀个队列⾥。

    这些记录后续会被并发标记线程消费，确保新引⽤的对象不会被漏标，从⽽保证标记的准确性。你可以把它看作是 G C

    对“谁改了引⽤”这件事的监控探针。

    1）写屏障代码通常由 J VM ⾃动⽣成，不需要开发者⼲预

    2）它带来的开销很⼩，但⾼频调⽤场景下仍会有⼀定性能影响

    3）G 1 使⽤ post-write barrier 来记录 card table，ZG C 则⽤ load barrier 配合指针着⾊

    举个简单例⼦，G 1 ⾥⼀旦发现某个 region 的引⽤被更新，就会通过 write barrier 标记对应 card，让后续 Rem ark 阶

    段能快速扫描脏卡。

    这机制说⽩了就是为了解决“⼀边⼲活⼀边记账”的⼀致性问题，让 G C 能在不停顿的情况下安全完成标记。'
