  reference_answer: '根据 MyBatis 面试题速记通关版; page 2：使⽤ M yBatis 的 m apper 接⼝调⽤时有哪些要求？

    接⼝⽅法名必须和 M apper XM L 中的 statem ent id ⼀致，参数类型也要对应。⽐如 XM L ⾥写的是

    selectUserById ，那接⼝⽅法就得叫 selectUserById ，不然找不到。

    1） 接⼝全限定名要和 XM L ⽂件的 nam espace 完全匹配。这是 M yBatis 绑定的依据，差⼀个字⺟都找不到。

    2） ⽅法的返回值类型得和 XM L ⾥ resultType 或 resultM ap 能映射上。如果数据库返回 3 个字段，但实体类没有⽆参

    构造或者属性不匹配，直接抛异常。

    3） 参数只能有⼀个，如果你有多个参数，得⽤ @Param 注解命名，否则 XM L ⾥没法通过名字引⽤。⽐如 int

    updateUser(@Param("id") Long id, @Param("name") String name) ，XM L 才能⽤ #{id} 和
    #

    {name} 。

    4） XM L ⽂件必须和接⼝在同⼀个包下，且同名。Spring Boot 默认扫描 classpath*:/**/*.xm l，但前提是路径对。

    M aven 还得注意别把 XM L 过滤掉了。

    代码⽰例：

    public interface UserMapper {

    User selectUserById(Long id);

    }

    对应 XM L：

    <select id="selectUserById" resultType="User">

    SELECT * FROM user WHERE id = #{id}

    </select>

    实际项⽬⾥，像 M yBatis-Plus 就是靠动态代理 + 这套规则⾃动⽣成 SQL，你不⽤写 XM L。但底层还是遵守这些约

    定。'
