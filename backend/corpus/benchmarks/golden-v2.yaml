  reference_answer: '根据 Spring Boot 面试题速记通关版; page 15：Spring Boot ⽀持哪些嵌⼊ Web 容器？

    Spring Boot 开箱就⽀持好⼏种嵌⼊式 W eb 容器，最常⽤的其实是三个：Tom cat、J etty 和 U ndertow。

    1）默认是 Tom cat，你只要引⼊ spring-boot-starter-web ，它⾃带了 Tom cat 作为嵌⼊容器，启动后就能直

    接对外服务，不⽤额外部署 W AR 包。

    2）如果你想⽤ J etty，⽐如在⾼并发⻓连接场景下压测表现更好，那就把 starter ⾥的 Tom cat 依赖排除，加上

    spring-boot-starter-jetty 。像 Spring Cloud G ateway 有些项⽬就会切到 J etty 或 U ndertow。

    3）U ndertow 是 Red Hat 出的，性能不错，内存占⽤也低，适合想压榨服务器资源的场景。换起来也简单，排除

    Tom cat 后引⼊ spring-boot-starter-undertow 就⾏。

    它们都是通过 ServletWebServerFactory 接⼝来创建具体容器实例的，Spring Boot ⾃动配置会根据 classpath

    上的类选择合适的实现。⽐如看到 org.apache.catalina.startup.Tomcat 就上 Tom cat，看到

    io.undertow.Undertow 就初始化 U ndertow。

    代码上你完全不⽤改，切换靠依赖管理。举个 M aven 的⽚段：

    <exclusions>

    <exclusion>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-starter-tomcat</artifactId>

    </exclusion>

    </exclusions>

    <artifactId>spring-boot-starter-tomcat</artifactId>

    </exclusion>

    </exclusions>

    加上对应的 starter 就能替换。⼀般⼩项⽬⽤默认 Tom cat 完全够⽤，搞微服务⽹关或者追求极致性能再考虑换。'
