  reference_answer: '根据 Spring 面试题速记通关版; page 4：Spring中的 @M odelAttribute 注解的作⽤是什么？

    @ModelAttribute 主要⽤来预处理请求参数，把数据提前塞进 Model ⾥，让后续⽅法能直接⽤。

    1）它可以加在⽅法上，这个⽅法会在每个 @RequestMapping ⽅法执⾏前先跑⼀遍。⽐如你有个表单要⽤到省份列

    表，就可以⽤它从数据库捞出来放进 Model ，这样⻚⾯⾃动能访问到。

    @ModelAttribute

    public void populateStates(Model model) {

    model.addAttribute("states", stateService.getStates());

    }

    2）它也能加在控制器⽅法的参数上，表⽰这个参数不是从 U RL 或 body 来的，⽽是从 Model ⾥找对应名字的对

    象，或者通过参数解析器⾃动组装。常⽤于表单提交时绑定对象。

    @PostMapping("/users")

    public String saveUser(@ModelAttribute User user) {

    // user 已经由请求参数⾃动填充

    userService.save(user);

    return "redirect:/users";

    }

    注意⼀点，如果 Model ⾥没有现成的 User 实例，Spring 会调⽤它的⽆参构造函数创建⼀个，然后再⽤请求⾥的

    name 、email 这些字段去 set。这个过程压根不经过 @RequestBody 那套反序列化流程，是靠数据绑定器

    WebDataBinder 搞定的。

    ⼀般搭配 @SessionAttributes ⽤，可以把表单对象跨请求存住，⽐如多步骤表单。但别滥⽤，容易把 Model

    塞得太满，调试起来头疼。

    Spring Bean ⼀共有⼏种作⽤域？

    Spring ⾥的 Bean 作⽤域，说⽩了就是这个实例归谁管、活多久。容器默认给你管到底的叫单例，但实际场景远不⽌

    这⼀种。

    塞得太满，调试起来头疼。

    Spring Bean ⼀共有⼏种作⽤域？

    Spring ⾥的 Bean 作⽤域，说⽩了就是这个实例归谁管、活多久。容器默认给你管到底的叫单例，但实际场景远不⽌

    这⼀种。

    1）singleton 是最常⽤的，整个应⽤就⼀个实例，Spring 容器启动时创建，销毁容器时才释放。像配置类、⼯具类这

    种⽆状态组件⽤它最合适。

    2）prototype 每次拿都给你 new ⼀个新对象，不缓存。适合有状态的 Bean，⽐如某个请求级别的数据处理器，每次

    都需要⼲净的上下⽂。

    3）request 和 session 是 W eb 环境专属。request 级别的 Bean 在⼀次 HTTP 请求中共享，请求结束就销毁；session

    级别的则绑定到⽤户会话，⽤户退出或 session 过期才清理。在 Spring M VC 或 Spring Boot 的 W eb 项⽬⾥才能⽤。

    4）application 作⽤于 ServletContext ⽣命周期，整个 W eb 应⽤共享⼀份实例，基本不常⽤。

    5）websocket 是 Spring 3.1 后加的，每个 W ebSocket 会话拥有独⽴的 Bean 实例，⽤于 W ebSocket 的会话隔离场

    景。

    ⾮ W eb 项⽬⾥ request、session 这些直接⽤不了，跑起来会报错。所以选作⽤域得看运⾏环境和对象⽣命周期需

    求，别⼀股脑全⽤ singleton。'
