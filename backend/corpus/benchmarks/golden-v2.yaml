  reference_answer: '根据 Elasticsearch 面试题速记通关版; page 77：如何使⽤ ILM 管理 Elasticsearch
    索引的⽣命周期？

    ILM 是 Elasticsearch ⾥管理索引⽣命周期的标准化流程，适合⽇志、指标这类时间序列数据。你不⽤⼿动删索引或改

    配置，让系统⾃动完成热温冷归档的流转。

    ⼀个索引会经历⼏个阶段：hot、warm 、cold、frozen。每个阶段可以定义策略，⽐如在 hot 阶段继续写⼊，到了

    warm 阶段就关闭写⼊转为只读，并迁移到低配节点。数据再⽼⼀点，进 cold 阶段做压缩归档，最后 frozen 阶段⽤搜

    索时才加载。

    策略是通过 API 定义的，举个例⼦：

    PUT _ilm/policy/logs-policy

    {

    "policy": {

    "phases": {

    "hot": {

    "actions": {

    "rollover": {

    "max_size": "50GB",

    "max_age": "30d"

    }

    }

    },

    "warm": {

    "actions": {

    "shrink": { "number_of_shards": 1 },

    "allocate": { "include": { "data": "warm" } }

    }

    },

    "delete": {

    "min_age": "365d",

    "actions": { "delete": {} }

    }

    }

    }

    }

    这个策略绑定到⼀个索引模板上，新创建的 tim e-series 索引⾃动继承。rollover 触发后，系统会创建新索引继续写，

    旧索引按阶段流转。

    实际场景中，结合 Index Tem plates 和 Data Stream s 效果最好，尤其是⽤ Filebeat 或 M etricbeat 推送⽇志时，整

    套流程完全⾃动化。'
