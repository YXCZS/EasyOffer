  reference_answer: '根据 Java 并发面试题速记通关版; page 21：什么是 Java 的 StampedLock？

    Stam pedLock 是 J ava 8 引⼊的⼀种⾼性能读写锁，⽤来替代传统的 ReentrantReadW riteLock。它最⼤的特点是⽀

    持乐观读，这在读多写少的场景下能显著提升吞吐量。

    ReentrantReadW riteLock 在⾼并发读时，⼀旦有线程持有写锁，所有读线程都会被阻塞。⽽ Stam pedLock 的乐观读

    模式允许读操作“⽆锁”进⾏，只要数据没被修改就直接返回结果。

    使⽤时需要获取⼀个 long 类型的 stam p，这个 stam p 代表了锁的状态版本。写操作会改变 stam p，读操作通过校验

    stam p 是否被修改来判断数据⼀致性。

    1） 获取乐观读 stam p：long stamp = lock.tryOptimisticRead(); 2） 执⾏读逻辑后，必须⽤

    lock.validate(stamp) 校验是否失效 3） 如果校验失败，降级为悲观读：stamp = lock.readLock()

    写锁的获取和释放跟传统⽅式类似，但写锁不能重⼊，否则会死锁。这点要特别注意，业务代码⾥如果嵌套调⽤容易

    搞不定。

    典型适⽤场景⽐如缓存容器、配置中⼼本地快照，像 Nacos 客户端就⽤它来保护服务实例列表的读写。压根不经过内

    核态切换，完全是⽤户态的 CAS 操作，性能扛得住⼏千上万 QPS 的读。

    不过 API 设计较反⼈类，try 和 release 必须配对，且 stam p 失效后要⼿动重试，得包⼀层⼯具⽅法才好⽤。'
