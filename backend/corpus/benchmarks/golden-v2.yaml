  query: 'Nginx: 如何在 Nginx 中处理 W ebSocket 连接？需要哪些配置？'
  role: backend
  difficulty: medium
  expected_technologies:
  - Nginx
  relevance:
    122bb9e0bc6de8fb538212eb38607ee8420d0f8db5ec8fcb679d88dec84e0e17: 2
  expected_knowledge_points:
  - Nginx
  reference_answer: '根据 Nginx 面试题速记通关版; page 62：如何在 Nginx 中处理 W ebSocket 连接？需要哪些配置？

    W ebSocket 和 HTTP 不⼀样，它是个⻓连接，需要持续通信。Nginx 默认会超时关闭空闲连接，所以处理 W ebSocket

    时得⼿动调整⼏个关键配置，不然连接很快就被断了。

    1）必须设置 Upgrade 和 Connection 头

    Nginx 要识别客户端发来的是 W ebSocket 协议升级请求，就得透传 Upgrade 和 Connection 这两个头。否则

    Nginx 当普通 HTTP 处理，后续的握⼿就失败了。

    location /ws/ {

    proxy_pass http://backend;

    proxy_http_version 1.1;

    proxy_set_header Upgrade $http_upgrade;

    proxy_set_header Connection "upgrade";

    }

    2）调整超时时间

    默认 60 秒不活动，Nginx 就会关掉连接。但 W ebSocket 往往⻓时间挂在那⾥等消息。所以要延⻓读写超时。

    proxy_read_timeout 86400s; # 保持连接 1 天

    proxy_send_timeout 86400s;

    3）负载均衡要考虑会话保持

    如果你⽤多个后端服务，同⼀个⽤户的 W ebSocket 连接得打到同⼀台机器上。可以⽤ IP hash 或 key-hash 的⽅式做

    sticky session，避免状态分散。

    upstream backend {

    ip_hash;

    server 192.168.0.10:8080;

    server 192.168.0.11:8080;

    }

    其实整个过程就是：客户端发 U pgrade 请求 → Nginx 透传头并转发 → 后端服务响应 101 Switching Protocols → 连

    接升级为 W ebSocket ⻓连接。只要中间不丢头、不超时，就能稳住。'
