  reference_answer: '根据 Spring Boot 面试题速记通关版; page 11：如何理解 Spring Boot 中的 starter？

    Spring Boot 的 starter 本质是⼀组依赖描述符，帮你快速集成某个功能模块，不⽤⾃⼰⼀个个找依赖版本。

    ⽐如你要⽤ Redis，直接引⼊ spring-boot-starter-data-redis ，它背后已经帮你组合好了 Lettuce 或

    J edis、Spring Data Redis、连接池、序列化等依赖，版本也都对⻬了。你压根不需要关⼼具体引⼊了哪些库，也不⽤

    操⼼版本冲突。

    1）所有 starter 都遵循统⼀命名规范：spring-boot-starter-xxx ，第三⽅框架接⼊也按这规则，⽐如

    mybatis-spring-boot-starter 。

