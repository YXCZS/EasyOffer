  reference_answer: '根据 Java 基础面试题速记通关版; page 34：为什么在 Java 中编写代码时会遇到乱码问题？

    J ava 中的乱码问题，本质是字符集不⼀致导致的。你从哪读数据、往哪写数据，每个环节⽤的编码规则必须对得上，

    不然就是“鸡同鸭讲”。

    ⽐如你⽤ UTF-8 写了个中⽂⽂件，结果别⼈⽤ GBK 去读，那“你好”可能就变成“浣犲ソ”。反过来也⼀样。这

    种问题在 IO 操作、⽹络传输、数据库交互时特别常⻅。

    1） ⽂件读写时，没指定编码，默认⽤了系统编码。W indows ⼀般是 GBK ，Linux/M ax 是 UTF-8 ，跨平台⼀跑，

    直接出事。

    2） W eb 应⽤⾥，前端⻚⾯声明的是 UTF-8 ，但后端 Servlet 没设置 request.setCharacterEncoding("UTF-

    8") ，请求体⾥的中⽂就废了。

    3） 数据库连接 U RL 没加 characterEncoding=utf8 ，存的时候就歪了。

    代码上要盯住⼏个点：

    // 读⽂件别⽤默认编码

    new String(Files.readAllBytes(Paths.get("a.txt")), StandardCharsets.UTF_8);

    // 写也要明确

    Files.write(path, " 内容 ".getBytes(StandardCharsets.UTF_8));

