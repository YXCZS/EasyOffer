  reference_answer: '根据 消息队列面试题速记通关版; page 12：你了解 Kafka 中的时间轮实现吗?

    Kafka ⾥的时间轮，主要是⽤来⾼效管理⼤量定时任务的，⽐如延迟消息、请求超时这些。你想想，如果⽤传统的定

    时器加⼀堆任务，每个任务都去遍历⽐对，那成千上万个任务时根本扛不住。时间轮就是来解决这个性能问题的。

    它的核⼼其实是分层时间轮（Hierarchical Tim ing W heel），有点像钟表的时分秒针。Kafka ⽤的是 TimingWheel

    这个结构，每个时间格⼦⾥挂⼀个双向链表，存着到期的任务。指针每过⼀个 tick 就往前⾛⼀格，⾛到哪就检查对应

    格⼦的任务有没有到期。

    关键点在于，它不是⼀层到底。当任务的延迟时间超过当前层的范围，就会被退回到上层时间轮，等快到期了再“降

    级”到下层。这样⼤部分⻓期任务不会频繁参与调度，性能就稳了。Netty 的 HashedW heelTim er 也是类似思路，但

    Kafka 做了分层优化，能⽀持百万级延迟任务。

    代码⾥最核⼼的是 TimerTaskList 和 TimerTaskEntry ，任务通过链表串起来，删除和插⼊都是 O(1)。⽽且整

    个推进机制是靠系统时间驱动的，不依赖 J DK 原⽣的 Tim er。

    注意⼀点，Kafka 时间轮不处理精度特别⾼的场景，tick ⼤⼩⼀般设⼏毫秒到⼏⼗毫秒，太短了会频繁触发，太⻓⼜不

    精准。实际使⽤中，像 DelayQueue 那种⽅式在⾼并发下反⽽容易成为瓶颈，时间轮才是扛量的脏活累活担当。'
