  reference_answer: '根据 Java 并发面试题速记通关版; page 21：什么是协程？Java ⽀持协程吗？

    协程可以理解成“⽤户态的轻量级线程”，它让异步代码写起来像同步⼀样。线程由操作系统调度，⽽协程由程序⾃⼰

    控制挂起和恢复，切换成本⽐线程低得多，⼀个进程⾥能轻松跑⼏万个协程。

    J ava 本⾝没有原⽣⽀持协程。J VM 上的 K otlin 提供了完整的协程实现，通过 suspend 函数和 launch 等 API，

    能在不阻塞线程的情况下处理⾼并发 IO。⽐如⽤ K tor 或 Spring W ebFlux 配合 K otlin 协程，⼀个线程就能扛住⼤量⽹

    络请求。

    如果⾮要⽤ J ava 实现类似效果，⼀般靠响应式编程框架，⽐如 Project Reactor 或 RxJ ava。它们⽤回调机制模拟异步

    流，虽然也能做到⾼并发，但代码复杂度⽐协程⾼不少。

    1）协程的核⼼是挂起函数，执⾏到 IO 时⾃动让出线程，等结果回来再恢复。 2）K otlin 协程底层依赖编译器把

    suspend 函数拆成状态机，运⾏时通过 Continuation 管理上下⽂。 3）J ava 的虚拟线程（Virtual Thread）在某种程

    度上解决了类似问题。从 J DK 19 开始孵化，到 J DK 21 正式落地，它由 J VM 调度，能⾃动利⽤多核，写法还是传统的

    同步⻛格，但每个请求⽤⼀个虚拟线程，数量可以上百万。

    简单说，J ava 没有协程，但 K otlin 有；J ava ⾃⼰搞了个虚拟线程来解决⾼并发场景下的线程成本问题，思路不同但

    ⽬标⼀致。'
