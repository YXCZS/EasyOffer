  reference_answer: '根据 Spring Boot 面试题速记通关版; page 13：Spring Boot 打成的 jar 和普通的 jar
    有什么区别 ?

    Spring Boot 打出来的 jar 和普通 jar 最⼤的不同在于可执⾏性和依赖打包⽅式。

    普通 jar 只是把 .class ⽂件按包结构打进去，运⾏得靠外部 classpath 引⼊依赖。你⽤ java -jar 跑⼀个普通

    Spring 项⽬ jar，基本会报错找不到主类或者依赖。

    Spring Boot 的 jar 是个胖 jar（fat jar），它把项⽬所有的编译类 + 依赖的第三⽅库 + 内嵌容器（⽐如 Tom cat）全塞

    进⼀个 jar ⾥了。启动的时候，通过⾃定义的类加载器 LaunchedURLClassLoader 动态加载内部的 jar 包。

