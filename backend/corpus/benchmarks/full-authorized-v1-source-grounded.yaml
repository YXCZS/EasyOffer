  reference_answer: '根据 Spring Cloud 面试题速记通关版; page 2：Consul 是什么？

    Consul 是 HashiCorp 出品的⼀个服务⽹格解决⽅案，主打服务发现、配置管理和服务间安全通信。它不光是个注册中

    ⼼，还能⼲⼀堆脏活累活，⽐如健康检查、多数据中⼼⽀持、ACL 权限控制。

    1）服务发现：每个服务启动后往 Consul 注册⾃⼰，消费者通过服务名查到可⽤实例。⽐如订单服务要调库存服务，

    直接问 Consul 要 inventory-service 的地址列表。

    2）健康检查：Consul 主动探活，挂掉的服务会⾃动从列表剔除。⽀持 HTTP、TCP、脚本等多种探测⽅式，保证流量

    不会打到残⾎节点。

    3）K V 配置存储：可以把配置写进 Consul 的键值对系统，服务监听变更实现动态刷新，类似轻量版的 ZooK eeper。

    4）服务⽹格能⼒：通过边⻋代理（Connect）启⽤ m TLS，服务之间⾃动加密通信，还能基于服务⾝份做访问策略控

    制。

    部署模式上，Consul ⽤ Raft 协议选主，数据强⼀致，通常建议 3 或 5 个节点组成集群。相⽐ Eureka，它更重⼀些，

    但功能也更全；⽐起 Nacos，它在多 DC 场景下更成熟，不过运维复杂度⾼点。

    适合中⼤型系统，尤其是需要跨数据中⼼、强⼀致性、安全通信的场景。⼩项⽬可能有点杀鸡⽤⽜⼑。'
  reference_context_ids:
  - dca569160e7581bafeb036f5aafe79cc5ffb08b11f42c29615aa7a3485e411af
