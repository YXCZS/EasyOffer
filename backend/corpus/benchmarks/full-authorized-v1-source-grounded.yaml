  reference_answer: '根据 Redis 面试题速记通关版; page 24：Redis 的 Lua 脚本功能是什么？如何使⽤？

    Redis 的 Lua 脚本让你能把⼀组操作打包成⼀个原⼦执⾏的脚本，整个过程不会被其他命令打断。这在需要保证多个

    key 操作⼀致性时特别有⽤，⽐如分布式锁、库存扣减这种场景。

    Lua 脚本通过 EVAL 或 EVALSHA 命令执⾏。EVAL 直接传脚本内容，EVALSHA ⽤脚本的 SHA1 值调⽤，避免重

    复传输代码，提升性能。

    脚本⾥可以⽤ KEYS 和 ARGV 传参，Redis 会把这两个表映射成客户端传⼊的键和值。⼀般建议把会被频繁调⽤的

    脚本先加载到 Redis 中，⽤ SCRIPT LOAD 预加载，再⽤ EVALSHA 触发。

    1）写个简单的库存扣减脚本：

    local num = redis.call(''GET'', KEYS[1])

    if not num then return 0 end

    if tonumber(num) >= tonumber(ARGV[1]) then

    return redis.call(''DECRBY'', KEYS[1], ARGV[1])

    else

    return -1

    end

    2）⽤ EVAL 执⾏：

    EVAL " 上述脚本 " 1 stock_key 10

    注意点：脚本得尽量快，别做复杂循环或耗时操作，否则会阻塞主线程。单个脚本执⾏时间最好控制在⼏毫秒内，不

    然会影响其他请求响应。

    像 原⼦性、减少⽹络开销、逻辑复⽤是它的主要优势。但搞不定⻓时间任务，真要处理复杂业务逻辑，还是得靠服务

    端程序。'
