  reference_answer: '根据 Java 虚拟机面试题速记通关版; page 1：你常⽤哪些⼯具来分析 JVM 性能？

    分析 J VM 性能，关键得看场景。如果是线上突发问题，Arthas 是⾸选，不⽤重启应⽤就能直接连上去看堆栈、内存、

    线程，特别适合定位死锁或 CPU 突增。

    本地调试或者压测时，J DK ⾃带的⼯具更轻量。jstat 看 G C 频率和内存变化最直接，⽐如每秒 Young G C 次数超过

    5 次就得警惕了。jstack 抓线程堆栈，配合 top -H 找出 CPU 占⾼的线程，能快速定位到是哪个⽅法卡住了。

    jmap 可以导出堆 dum p，再⽤ M AT 或 J VisualVM 分析对象占⽤，查内存泄漏很管⽤。

    如果要⻓期监控，⼀般会上 Prom etheus + G rafana，配合 M icrom eter 或 J M X Exporter 采集 J VM 指标。G
    C 次数、

    堆内存、线程数这些数据⼀⽬了然，还能设告警。

    复杂问题还得靠⻜⾏记录器。J FR（J ava Flight Recorder）和 J M C 搭配，能拿到⽅法级的性能采样数据，像⽕焰图⼀

    样看出热点⽅法。不过这功能在 Oracle J DK 免费，OpenJ DK 要从 11+ 开启额外参数。

    简单问题别搞太重，jstat 和 jstack 组合拳基本够⽤。真要深挖，Arthas 和 J FR 才是杀⼿锏。'
