  reference_answer: '根据 Java 热门面试题 200 道速记通关版; page 102：简述 M yBatis 的插件运⾏原理，以及如何编写⼀个插件？

    M yBatis 插件本质上是通过 拦截器 机制，对四⼤核⼼对象的⽅法调⽤进⾏增强。这四个对象分别是 Executor、

    StatementHandler、ParameterHandler 和 ResultSetHandler。插件不会侵⼊原有逻辑，⽽是利⽤动态代理，在关键

    ⽅法执⾏时回调你定义的 intercept ⽅法。

    1）要写⼀个插件，先实现 Interceptor 接⼝，重写 intercept ⽅法，⾥⾯写你的增强逻辑，⽐如打印 SQL 执⾏时间。

    2）⽤ @Signature 注解声明你要拦截哪个类的哪个⽅法，⽬标明确，不能乱来。

    3）最后在 mybatis-conﬁg.xml ⾥注册这个插件，或者⽤编程式配置加进去。

    @Intercepts({

    @Signature(type = StatementHandler.class, method = "prepare", args =

    {Connection.class, Integer.class})

    })

    public class SqlCostPlugin implements Interceptor {

    @Override

    public Object intercept(Invocation invocation) throws Throwable {

    long start = System.currentTimeMillis();

    try {

    return invocation.proceed();

    } finally {

    long cost = System.currentTimeMillis() - start;

    System.out.println("SQL 执⾏耗时： " + cost + "ms");

    }

    }

    }

    注意，多个插件会形成责任链，按注册顺序依次执⾏。代理逻辑由 Plugin.wrap ⽅法触发，它会判断当前对象是否匹

    }

    }

    }

    注意，多个插件会形成责任链，按注册顺序依次执⾏。代理逻辑由 Plugin.wrap ⽅法触发，它会判断当前对象是否匹

    配 @Signature 声明的⽬标，是的话就包⼀层代理。

    整个过程其实就是在创建四⼤对象时，调⽤ interceptorChain.pluginAll() 把所有插件都套上去。⽐如 new Executor

    时，会被各个插件的 plugin ⽅法处理，最终返回被代理后的实例。'
