  reference_answer: '根据 Spring Cloud 面试题速记通关版; page 13：什么是灰度发布、⾦丝雀部署以及蓝绿部署？

    灰度发布、⾦丝雀部署和蓝绿部署都是控制流量逐步切换的发布策略，核⼼⽬标是降低上线⻛险。

    灰度发布是个⼤概念，指先让⼀部分⽤户使⽤新版本，反馈没问题再全量推。⽐如你在⽤某个App，突然被选中体

    验“内测版”，其实就是进⼊了灰度名单。这种策略常⻅于互联⽹产品，像微信、淘宝发版都⾛灰度，靠⽤户ID或地域

    分流，后端⼀般⽤Nginx或Spring Cloud G ateway做路由。

    ⾦丝雀部署是灰度的⼀种具体实现，名字来⾃矿⼯带⾦丝雀下矿的传统。它更偏向基础设施层⾯操作，⽐如在

    K ubernetes⾥，你先起⼀个新版本Pod，把1%的流量导过去，观察⽇志和监控指标。没问题就逐步增加⽐例，直到全

    切。这过程可以⽤Istio这样的服务⽹格精细控制。

    蓝绿部署则是准备两套完全⼀样的⽣产环境，蓝⾊是当前线上，绿⾊是新版本。发布时直接把流量从蓝切到绿，回滚

    也是⼀键切回来。好处是切换快、回滚快，但成本⾼，毕竟要维持两套环境。AW S Elastic Beanstalk和阿⾥云EDAS都

    ⽀持这种模式。

    对⽐来看，蓝绿最稳但花钱多，⾦丝雀最灵活但控制复杂，灰度适合⽤户维度的渐进验证。'
