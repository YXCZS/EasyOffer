  reference_answer: '根据 Java 并发面试题速记通关版; page 32：你使⽤过 Java 的累加器吗？

    J ava 的并发累加器，主要是 LongAdder 和 DoubleAdder ，这玩意⼉在⾼并发计数场景下⽐ AtomicLong 能

    扛得多。

    它背后的思路很直接：当多个线程同时更新⼀个值时，AtomicLong 会因为 CAS 竞争导致⼤量线程⾃旋失败，性能

    急剧下降。⽽ LongAdder 采⽤分段累加的思想，把冲突分散到多个 cell 中，每个线程尽量操作⾃⼰的 cell，最后再

    把所有 cell 加起来。这种空间换时间的策略，在 100+ 线程并发更新时，吞吐量能⾼出⼀个数量级。

    适合⽤它的场景⽐如监控埋点、请求计数、分布式 ID ⽣成器中的本地步⻓控制。像 M icrom eter 这种监控库底层就⽤

    了 LongAdder 来收集指标。

    LongAdder adder = new LongAdder();

    adder.increment(); // 线程安全累加

    adder.sum(); // 获取总和（可能有延迟）

    注意 sum() 不是强⼀致的，它返回的是调⽤时刻的快照，中间可能有正在更新的 cell 没合并进来。如果需要严格实

    时总数，还是得⽤ AtomicLong ，但你要清楚这是以性能为代价的。

    1）不要频繁调⽤ reset() ，尤其是在并发环境下，可能导致统计丢失

    2）读多写少的场景没必要⽤ LongAdder ，AtomicLong 更轻量

    3）DoubleAdder 同理，只是对应浮点类型'
