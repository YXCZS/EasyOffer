  reference_answer: '根据 Java 基础面试题速记通关版; page 6：什么是 Java 中的继承机制？

    J ava ⾥的继承，说⽩了就是⼦类可以拿⽗类的属性和⽅法来⽤，不⽤重复写。⼀个类只能继承⼀个⽗类，这是单继

    承，靠的是 extends 关键字。

    1）⼦类会⾃动拥有⽗类的⾮私有字段和⽅法。⽐如你写个 Animal 类有 eat() ⽅法，Dog extends Animal

    就可以直接调⽤ eat() 。

    2）构造过程是先跑⽗类构造器，再跑⼦类的。如果你没⼿动调 super() ，编译器会⾃动插⼀句 super() 在⼦类

    构造器第⼀⾏。

    3）⽅法重写（Override）是重点。⼦类可以改写⽗类的⽅法逻辑，但签名得⼀样。加个 @Override 注解能防⽌你

    写错签名，也⽅便别⼈看。

    class Animal {

    void sound() { System.out.println(" 叫了⼀声 "); }

    }

    class Dog extends Animal {

    @Override

    void sound() { System.out.println(" 汪汪 "); }

    }

    多态也是基于继承来的。你⽤ Animal a = new Dog() 这种写法，调 a.sound() 实际执⾏的是 Dog 的版

    本，这就是运⾏时动态绑定。

    不过别滥⽤继承。⽗类⼀改，⼦类可能就出问题。⼀般来说，is-a 关系才考虑继承，⽐如 Dog is an Animal 。要

    是只是想复⽤代码，优先⽤组合，不然后期搞不定。'
