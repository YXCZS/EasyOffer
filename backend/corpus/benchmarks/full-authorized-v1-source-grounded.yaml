  reference_answer: '根据 Nginx 面试题速记通关版; page 55：如何获取 Nginx 中每个 IP 的请求状态码情况？

    要统计 Nginx 中每个 IP 的请求状态码分布，核⼼是解析 Nginx 的访问⽇志。默认⽇志格式包含客户端 IP、请求路径、

    HTTP 状态码等关键字段，只要⽇志记录了这些信息，就可以做聚合分析。

    1）最直接的⽅式是⽤ shell 命令组合分析⽇志⽂件。⽐如查看最近 1000 ⾏⽇志中每个 IP 对应的状态码次数：

    tail -1000 /var/log/nginx/access.log | awk ''{print $1, $9}'' | sort | uniq -c

    这⾥ $1 是客户端 IP，$9 是响应状态码（以默认 log_form at 为准），通过 uniq -c 统计频次。

    2）如果需要更复杂的分析，⽐如按状态码分组统计某个 IP 的 404 或 500 情况，可以加条件过滤：

    awk ''$9 == 404 {print $1}'' /var/log/nginx/access.log | sort | uniq -c

    这条命令列出所有产⽣ 404 的 IP 及其出现次数。

    3）⽣产环境建议结合 ELK （Elasticsearch + Logstash + K ibana）或 Prom etheus + G rafana。Nginx
    配合 nginx-vts-

    m odule 或通过 Filebeat 抓取⽇志，把每条请求打标后上报，就能在可视化⾯板⾥实时看每个 IP 的状态码趋势。

    注意⽇志格式必须明确包含 $status 和 $remote_addr ，⾃定义 log_form at 时别漏掉：

    log_format detailed ''$remote_addr - $remote_user [$time_local] "$request" ''

    ''$status $body_bytes_sent "$http_referer" ''

    ''$status $body_bytes_sent "$http_referer" ''

    ''"$http_user_agent" "$http_x_forwarded_for"'';

    这样后续分析才不会压根不经过实际数据⽽搞不定。'
  reference_context_ids:
  - 53a1c9068bf91f1b35c8a9ce6f8de41aa40ced8d6c55fc03974c7f7ee4746a6f
