  reference_answer: '根据 Java 并发面试题速记通关版; page 37：什么是 Java 中的指令重排？

    J ava 代码执⾏时，J VM 和 CPU 为了优化性能，可能会调整指令的执⾏顺序，这就是指令重排。只要结果和程序顺序

    ⼀致，这种重排就不会被察觉，但多线程环境下就容易出问题。

    1）编译器会在⽣成字节码时重排，⽐如把循环不变量提到外⾯。

    2）CPU 在运⾏时也会根据流⽔线效率动态调度指令，⽐如先执⾏不依赖前⾯结果的独⽴操作。

    3）内存系统还有⾃⼰的缓冲和写合并机制，看起来也像指令乱序。

    最典型的坑是双重检查单例：

    if (instance == null) {

    synchronized (Singleton.class) {

    if (instance == null) {

    instance = new Singleton(); // 这⼀步可能被重排

    }

    }

    }

    new Singleton() 实际分三步：分配内存、初始化对象、引⽤赋值。如果 3 在 2 前⾯执⾏，另⼀个线程可能拿到

    未初始化完的对象。

    解决办法是⽤ volatile 修饰变量，它能禁⽌特定类型的指令重排，保证可⻅性和有序性。或者直接⽤静态内部类

    实现单例，更简洁安全。'
