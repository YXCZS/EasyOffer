  reference_answer: '根据 ZooKeeper 面试题速记通关版; page 18：ZooKeeper、Eureka、Nacos 和 Consul
    有什么区别？你会如何选择？

    服务发现组件选型得看你的系统要什么。⼀致性、可⽤性、部署成本，这三者你得先想清楚。

    ZooKeeper 和 Consul ⾛的是 CP 路线，保证强⼀致性。ZooKeeper ⽤ ZAB 协议，节点间数据必须⼀致，但主挂了要

    重新选主，期间不可⽤。典型⽤法像 HBase、Kafka 拿它做元数据管理。Consul 也是 CP，基于 Raft，健康检查做得

    更细，适合对⼀致性要求⾼的场景，⽐如⾦融交易系统。

    Eureka 是 AP 的代表，牺牲⼀致性换可⽤性。集群间数据可以短暂不⼀致，只要节点活着就能注册和拉取服务列表，

    适合云环境这种⽹络不稳的场景。Netﬂix ⾃家⽤的就是这套，扛住过⾼峰期流量。

    Nacos 其实最灵活，既⽀持 AP 也⽀持 CP。你要强⼀致就切到 CP 模式，⾛类 Raft 协议；要⾼可⽤就⽤ AP，默认就

    是。加上配置中⼼功能，Spring Cloud Alibaba 项⽬基本⾸选它。

    1）如果已有 K8s 或 Istio，Service M esh 层已接管服务发现，这⼏个都可能不需要

    2）如果是传统微服务架构，Nacos 基本能 cover 多数场景

    3）⽼ Hadoop ⽣态项⽬，ZooKeeper 已深度集成，没必要替换

    4）纯 AW S 环境⽤ Eureka 配合 ELB 也很顺

    最终选型别只看理论，压测模拟分区场景，看服务能不能扛住。'
