  reference_answer: '根据 计算机网络面试题速记通关版; page 11：到底什么是 TCP 连接？

    TCP 连接本质上是通信双⽅维护的⼀对状态，不是物理线路。建⽴连接靠三次握⼿，客户端和服务器交换各⾃的初始

    序列号（ISN），确认彼此的收发能⼒。

    1）第⼀次：客户端发 SYN=1, seq=x 给服务器

    2）第⼆次：服务器回 SYN=1, ack=x+1, seq=y

    3）第三次：客户端再发 ACK=1, ack=y+1

    握⼿完成后，双⽅内核⾥的 TCP 状态机都进⼊ ESTABLISHED，开始传输数据。断开连接则是四次挥⼿，因为 TCP 是

    双⼯的，读写通道要分别关闭。

    很多⼈以为连接是“通路”，其实它只是操作系统⾥两个 socket 对象在内核中保存的状态信息，⽐如缓冲区、窗⼝⼤

    ⼩、序列号等。⽹络中断或超时，状态不⼀致，连接就失效了。

    像 Nginx、Redis 这类⾼并发服务，最怕 TIM E_W AIT 太多或者⽂件描述符耗尽，本质都是连接资源没释放。所以得调

    优内核参数，⽐如开启 SO_REUSEADDR 或调整 tcp_tw_reuse 。

    状态同步 和 可靠传输 才是 TCP 连接的核⼼⽬标，它通过序列号、确认应答、超时重传来保证数据不丢、不乱序。连

    接本⾝，不过是实现这个⽬标的上下⽂容器。

    服务端是如何解析 HTTP 请求的数据？（考察 HTTP 请求格式的了解程度）

    HTTP 请求不是凭空就能处理的，服务端得先把它拆开看明⽩。整个过程其实分⼏步⾛，每⼀步都对应着 HTTP 协议本

    ⾝的结构。

    请求⼀进来，TCP 层先把数据收上来，应⽤层⽐如 Tom cat 或 Netty 开始按 HTTP 报⽂格式解析。第⼀⾏是请求⾏，

    包含⽅法、路径和协议版本，⽐如 GET /api/user?id=123 HTTP/1.1 。这⼀⾏决定了你要⼲啥、去哪。

    接下来是请求头，⼀堆键值对，每⼀⾏⼀个字段。像 Host 、Content-Type 、Authorization 都在这⼉。服

    接下来是请求头，⼀堆键值对，每⼀⾏⼀个字段。像 Host 、Content-Type 、Authorization 都在这⼉。服

    务器靠这些判断怎么处理请求，⽐如是不是 J SON 数据、有没有登录。

    如果请求带了 body，⽐如 POST 提交表单或 J SON，服务端会根据 Content-Length 或 Transfer-Encoding

    知道 body 有多⻓。Content-Length 直接告诉你字节数，⼀⼝⽓读完就⾏。如果是 chunked 编码，就⼀段段收，

    直到收到结束标记。

    body 的内容还得看 Content-Type 。如果是 application/x-www-form-urlencoded ，那就按 key=value
    解

    码；如果是 application/json ，就得⽤ J ackson 或 G son 做反序列化。

    整个流程压根不经过业务逻辑，全是容器或框架底层搞定的。你写 Controller 的时候已经拿到解析好的参数了，但底

    层其实⾛了⼀整套状态机在拆包。'
