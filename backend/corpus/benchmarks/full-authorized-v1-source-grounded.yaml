- query_id: rabbitmq-01
  topic: RabbitMQ
  query: RabbitMQ 如何保证消息可靠投递
  role: backend
  difficulty: hard
  expected_technologies: &id010
  - RabbitMQ
  relevance:
    803284c721258f8cf495db1b48f702aaea74c7d2d4c7efd65d861e2840178c0a: 2
  expected_knowledge_points:
  - confirm
  - 持久化
  - ack
  reference_answer: '根据 RabbitMQ 面试题速记通关版; page 5：RabbitM Q 的消息确认机制是如何⼯作的？

    RabbitM Q 的消息确认机制主要分两块：⽣产者确认和消费者确认，两边配合才能实现端到端的可靠投递。

    ⽣产者发消息到 RabbitM Q 后，Broker 接收到消息并持久化成功，会返回⼀个 ack 确认。如果磁盘写⼊失败或队列

    满，就返回 nack 。⽣产者开启 publisher conﬁrm 模式后，可以异步监听这些响应，决定是否重发。这个机制在

    Spring Boot ⾥配个 spring.rabbitmq.publisher-confirm-type=correlated 就能⽤。

    消费者这边，默认是⾃动确认，只要消息被取⾛，RabbitM Q 就从队列删掉。这很危险，万⼀消费者处理到⼀半宕

    机，消息就丢了。所以必须关掉⾃动确认，改⽤⼿动确认：

    @RabbitListener(queues = "task-queue")

    public void listen(String message, Channel channel,

    @Header(AmqpHeaders.DELIVERY_TAG) long deliveryTag) {

    try {

    // 处理业务逻辑

    process(message);

    channel.basicAck(deliveryTag, false); // ⼿动 ack

    } catch (Exception e) {

    channel.basicNack(deliveryTag, false, true); // 拒收并重回队列

    }

    }

    1）消息先发到 Exchange

    2）路由到 Queue 存储（持久化可选）

    3）消费者拉取消息但不⾃动确认

    4）消费者处理完成⼿动发送 ack

    5）Broker 收到 ack 才真正删除消息

    整个链路只有所有环节都确认了，才算投递成功。中间任何⼀步失败，消息都不会丢，要么重试要么进死信队列。像

    订单系统、⽀付回调这种不能丢消息的场景，这套机制就是保底⼿段。'
