  reference_answer: '根据 Java 集合面试题速记通关版; page 11：J ava 中的 LinkedHashM ap 是什么？

    LinkedHashM ap 是 HashM ap 的⼦类，它在哈希表的基础上，额外维护了⼀条双向链表，⽤来记录插⼊顺序或者访问

    顺序。

    这就让它能按顺序遍历 key-value 对。默认情况下，它是按插⼊顺序排列的。⽐如你 put("a", 1)，再 put("b", 2)，遍历

    时先 a 后 b。如果你构造时开启 accessOrder 模式，就会变成按访问顺序排列，最近访问的放到最后，适合实现 LRU

    缓存。

    像 M yBatis 的缓存、Spring M VC 处理请求参数绑定，都⽤到了 LinkedHashM ap 来保证顺序性。它和 TreeM ap 不⼀

    样，TreeM ap 是靠 Com parable 或 Com parator 排序，底层是红⿊树，性能开销更⼤。

    代码上基本和 HashM ap ⼀样⽤：

    Map<String, Integer> map = new LinkedHashMap<>();

    map.put("first", 1);

    map.put("second", 2);

    遍历结果就是插⼊顺序。如果想实现 LRU ，可以重写 rem oveEldestEntry ⽅法：

    protected boolean removeEldestEntry(Map.Entry eldest) {

    return size() > MAX_SIZE;

    }

    这时候超过容量会⾃动淘汰最⽼的数据。注意初始容量和负载因⼦别设得太⼩，不然频繁扩容影响性能。

    它的缺点是内存占⽤⽐ HashM ap 稍⾼，因为要存前后指针。但⼤多数场景下这点开销不值⼀提。'
