    @Bean

    public RouterFunction<ServerResponse> route(UserHandler handler) {

    return route(GET("/users/{id}"), handler::getById);

    }

    这套函数式路由写法，是 W ebFlux 提供的另⼀种选择，适合轻量接⼝场景。'
