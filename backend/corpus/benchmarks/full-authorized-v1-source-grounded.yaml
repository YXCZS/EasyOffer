  reference_answer: '根据 Spring 面试题速记通关版; page 27：Spring 如何解决循环依赖？

    Spring 解决循环依赖主要靠三级缓存和提前暴露对象引⽤的机制，核⼼是把实例化和初始化分开。

    1）当 A 依赖 B，B ⼜依赖 A 时，Spring 在创建 A 的过程中，new 出 A 实例后就⻢上把它放进早期暴露缓存

    （singletonFactories），这个⼯⼚能返回尚未完全初始化的 A 对象。

    2）接着去创建 B，发现需要 A，就会从 singletonFactories 拿到那个“半成品”A 实例。此时 B 能完成注⼊，然后 B

    初始化完毕放⼊⼀级缓存（单例池）。

    3）再回到 A 的初始化，从⼀级缓存拿到完整的 B，继续完成 A 的属性填充和初始化，最后 A 也进⼀级缓存，整个流程

    闭环。

    这⾥的关键是三个缓存层级：

    ⼀级：singletonObjects，放完全初始化好的 Bean

    ⼆级：earlySingletonObjects，放提前暴露的原始对象（⽤于解决普通循环依赖）

    三级：singletonFactories，存放 ObjectFactory，能⽣成早期引⽤

    但要注意，这种机制只能解决单例作⽤域下的 setter 注⼊循环依赖。构造器注⼊的循环依赖 Spring 压根不经过缓

    存，直接抛异常。还有原型（prototype）作⽤域也不⽀持，每次都是新对象，没法缓存。

    代码层⾯不需要额外操作，只要⽤ @ Autowired 注⼊就⾏，框架⾃动处理。'
  reference_context_ids:
  - 2914860d0cee8016a9a925597d83abc8d8930a6dc4c555f4662e5716a505d075
