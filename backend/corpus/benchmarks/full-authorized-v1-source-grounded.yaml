  reference_answer: '根据 设计模式面试题速记通关版; page 16：什么是桥接模式？⼀般⽤在什么场景？

    桥接模式的关键是把抽象和实现解耦，让它们能独⽴变化。⽐如你有个图形类，既要⽀持不同形状（圆形、⽅形），⼜

    要⽀持不同渲染⽅式（W indows、Linux）。如果⽤继承硬写，组合爆炸，8个类都搞不定。

    1） 把变化维度拆开。形状作为抽象层，渲染作为实现层，两者通过组合连接。 2） 抽象层持有⼀个实现层的接⼝引

    ⽤，运⾏时动态绑定具体实现。 3） 新增形状或新渲染器，都不⽤动对⽅代码，符合开闭原则。

    典型场景是跨平台 G U I 库。Swing ⾥的 Component 和 LookAndFeel 就是桥接⸺同⼀个按钮，在 W indows 和

    m acOS 上外观不同，但⾏为⼀致。还有 J DBC 驱动，Connection 接⼝是抽象，M ySQL、Oracle 驱动是具体实

    现，切换数据库不改业务代码。

    interface Renderer {

    void render(String shape);

    }

    class WindowsRenderer implements Renderer {

    public void render(String shape) {

    System.out.println("Draw " + shape + " on Windows");

    }

    }

    abstract class Shape {

    protected Renderer renderer;

    public Shape(Renderer renderer) {

    this.renderer = renderer;

    }

    abstract void draw();

    }

    class Circle extends Shape {

    public Circle(Renderer renderer) {

    super(renderer);

    }

    void draw() {

    renderer.render("Circle");

    }

    }

    public Circle(Renderer renderer) {

    super(renderer);

    }

    void draw() {

    renderer.render("Circle");

    }

    }

    实际调⽤时，new Circle(new W indowsRenderer())，就能画出⼀个 W indows ⻛格的圆。换 M ac 渲染器，只要换参

    数，形状类完全不动。'
