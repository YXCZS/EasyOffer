  reference_answer: '根据 Elasticsearch 面试题速记通关版; page 115：Elasticsearch 中的 Fielddata
    是什么？如何优化其性能？

    Fielddata 是 Elasticsearch 为 text 类型字段构建的⼀种内存数据结构，⽤来⽀持聚合、排序等操作。默认情况下，

    text 字段会被分词，倒排索引只记录 term 和⽂档 ID 的关系，没法直接做聚合。这时候就得靠 ﬁelddata 把分词后的值

    加载到堆内存⾥，重新组织成列式存储格式。

    但这个机制很吃内存，⽽且⼀旦触发就会把整个字段的值全加载进去，容易引发 G C 甚⾄ OOM 。⽣产环境⽤多了会出'
