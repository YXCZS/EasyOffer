  reference_answer: '根据 MyBatis 面试题速记通关版; page 8：J DBC 编程有哪些不⾜之处，M yBatis 是如何解决的？

    J DBC 直接写在代码⾥，SQL 和 J ava 逻辑紧耦合，改个字段就得重新编译，维护成本特别⾼。更头疼的是，结果集要

    ⼿动映射到对象，每个 ResultSet#getXxx 都得写⼀遍，脏活累活全是程序员的。

    1）SQL 耦合问题

    原⽣ J DBC 把 SQL 拼在字符串⾥，不仅难读，还容易出错。M yBatis ⽤ XM L 或注解把 SQL 抽出来，放在 .xml ⽂件

    ⾥集中管理，DAO 接⼝只定义⽅法，SQL 独⽴可配，改查询不⽤动代码。

    2）参数设置繁琐

    J DBC 设置 PreparedStatement 参数，⼀个问号对应⼀个 setXxx ，顺序不能错。M yBatis ⾃动做参数映射，⽆

    论是单个参数还是 POJ O，都能通过 #{} 对应上，压根不操⼼下标。

    3）结果集⼿动封装

    J DBC 必须⼀⾏⾏取值再 set 到对象⾥，⽐如 user.setId(rs.getInt("id")) ，重复代码⼀⼤堆。M yBatis ⽀持

    ⾃动映射，查出来的列名直接对上实体类属性，甚⾄⽀持复杂嵌套关系，<resultMap> 搞定关联字段。

    4）数据库⽅⾔差异

    分⻚在 M ySQL ⽤ LIMIT ，Oracle 得套多层 ROWNUM ，J DBC 写死 SQL 就没法跨库。M yBatis 可以结合动态标签

    <if> 、<where> ⽣成不同⽅⾔语句，换数据库时只需改 SQL ⽂件，代码不动。

    简单说，M yBatis 不是 ORM 框架像 Hibernate 那样完全屏蔽 SQL，⽽是给 J DBC 套了层“智能外壳”，保留 SQL 精细

    控制权的同时，把重复劳动全⾃动化了。'
