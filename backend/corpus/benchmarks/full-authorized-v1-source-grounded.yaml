  reference_answer: '根据 消息队列面试题速记通关版; page 6：说说 RabbitMQ 的⼯作模式？

    RabbitM Q 的⼯作模式本质上是消息从⽣产者到消费者之间的流转⽅式，不同的交换机类型决定了路由规则。

    1）最简单的是直连模式，⽤ Direct Exchange ，消息的 routing key 必须和队列绑定的 key 完全匹配。⽐如订单

    服务发消息到 order.create ，消费端只绑这个 key 就能收到。

    2）发布订阅模式⽤ Fanout Exchange ，它会把消息⼴播给所有绑定的队列，不看 routing key。像⽇志收集场

    景，多个系统都需要⼀份⽇志，就可以⽤这个模式。

    3）主题模式使⽤ Topic Exchange ，⽀持通配符匹配 routing key。⽐如 logs.user.create 和

    logs.order.update 都能被 logs.*.create 或 logs.# 这样的 binding key 捕获。Kafka ⾥类似的逻辑得⾃

    ⼰做分发，⽽ RabbitM Q 原⽣⽀持。

    4）还有个 Headers Exchange ，按键值对匹配，基本没⼈⽤，性能差，实⽤性低。

    重点是交换机和队列的绑定关系由消费者决定，不是⽣产者。⽣产者只管发给哪个 exchange，后⾯怎么路由是

    Broker 根据绑定规则处理的。

    实际⽤得最多的是 direct 和 topic。Spring Boot ⾥配个 @RabbitListener(queues = "xxx") 就⾃动完成队列

    声明和绑定，底层其实靠的是 AM QP 协议在维持这套模型。'
