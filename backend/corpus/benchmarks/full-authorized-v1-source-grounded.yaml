  reference_answer: '根据 Spring Boot 面试题速记通关版; page 8：Spring Boot 2.x 与 1.x 版本有哪些主要的改进和区别？

    Spring Boot 2.x 相⽐ 1.x 不是⼩修⼩补，是⼀次全⾯升级，底层⽀撑和开发体验都变了。

    J DK 版本要求直接跳到 8+，不再⽀持 6 和 7。这意味着你可以放⼼⽤ Lam bda、Stream 这些特性，不⽤再写⼀堆匿

    名内部类。内嵌容器默认版本也升了，Tom cat 8.5+ 成标配，Servlet 规范跟着到了 3.1+。

    ⾃动配置机制更智能了。条件化配置的判断更细，⽐如 @ConditionalOnMissingBean 现在能按类型和名称双重

    判断，避免误覆盖。配置元数据⽀持 IDE 提⽰，application.yml ⾥打 spring. 就能⾃动联想，写配置不再靠

    背。

    W ebFlux 加⼊让响应式编程成为⼀等公⺠。你可以⽤ @Controller + Mono/Flux 写⾮阻塞接⼝，配合 Netty 或

    Servlet 3.1+ 容器跑。这在⾼并发 IO 场景下能显著降低线程开销，像⽹关类服务⽤ W ebFlux 能扛住更多连接。

    Actuator 变得更安全也更实⽤。端点默认只暴露 /health 和 /info ，其他要⼿动开启。HTTP 端点路径从

    /metrics 这种变成 /actuator/metrics ，隔离更清晰。还⽀持 Prom etheus 格式输出，对接 G rafana ⾯板零

    成本。

