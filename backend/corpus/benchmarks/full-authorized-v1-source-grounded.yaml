  reference_answer: '根据 MySQL 面试题速记通关版; page 36：M ySQL 中⻓事务可能会导致哪些问题？

    ⻓时间运⾏的事务在 M ySQL ⾥是个隐患，尤其在⾼并发场景下容易引发连锁反应。

    1）锁竞争加剧

    ⻓事务持有锁的时间更久，别的事务等锁的时间变⻓，响应变慢。⽐如⼀个事务⼀直没提交，它锁住的⾏别⼈就改不

    了，严重时直接把线程池拖垮，⼤量连接堆积。

    2）回滚段压⼒⼤

    InnoDB 的 M VCC 依赖 undo log 维护多版本数据。⻓事务不结束，undo log 就不能清理，这些历史版本⼀直占着空

    间。极端情况下，可能让 ibdata1 ⽂件疯狂增⻓，磁盘撑爆。

    3）主从延迟

    主库上执⾏了 5 分钟的事务，从库得按同样的节奏重放。如果这个事务还涉及⼤量⾏变更，从库 SQL Thread 跟不上

    节奏，延迟就来了。像阿⾥云 RDS 这类环境，延迟超过 30 秒可能触发告警。

    4）临时⽂件和内存泄漏⻛险

    事务过程中产⽣的临时结果集、排序缓冲都得维持状态。时间越⻓，内存占⽤越⾼，可能触发 OOM 。特别是 ORDER

    BY 、GROUP BY 操作，容易⽤到磁盘临时表。

    5）逻辑备份失败

    mysqldump 默认⽤ REPEATABLE READ 隔离级别加全局读锁，⻓事务会让 FLUSH TABLES WITH READ LOCK

    卡住，导致备份超时。换成 --single-transaction 也⼀样，如果备份期间有⻓事务，快照⼀致性就保不住。

    ⼀般建议控制在⼏秒内完成，超过 30 秒就算危险信号。可以查 information_schema.innodb_trx 表定位异常

    事务。'
