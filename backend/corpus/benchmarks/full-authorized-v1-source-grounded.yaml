  reference_answer: '根据 操作系统面试题速记通关版; page 11：进程的调度算法你知道吗？

    进程调度算法其实是操作系统做任务分配的核⼼逻辑，关键在于怎么平衡响应时间和吞吐量。

    1）先来先服务（FCFS）就是排队等，谁先到就先跑。优点是简单直观，但短任务可能被⻓任务卡住，平均等待时间

    容易变差。

    2）短作业优先（SJ F）挑预计运⾏时间最短的先执⾏，能最⼩化平均等待时间。但实现难点在怎么预估时间，⽽且⻓

    任务可能⼀直被挤，出现“饥饿”。

    3）时间⽚轮转（RR）给每个进程分⼀个固定时间⽚，轮流执⾏。⽐如 10m s 轮⼀次，保证所有任务都能及时响应，适

    合交互式系统。时间⽚太⼩切换开销⼤，太⼤⼜退化成 FCFS。

    4）多级反馈队列（M LFQ）算是综合⽅案，把多个优先级队列串起来。新进程进⾼优先级队列，⽤完时间⽚没跑完就

    降级。低优先级队列的时间⽚更⼤，既能照顾响应速度，⼜能处理⻓任务。

    Linux 实际⽤的是 完全公平调度器（CFS），它不靠静态优先级，⽽是跟踪每个进程的运⾏时间，总让运⾏时间最少的

    那个跑，相当于动态加权的轮转。

    实时场景会⽤ SCHED_FIFO 或 SCHED_RR，⽐如⾳视频处理要求严格时序，就不能被普通任务打断。'
