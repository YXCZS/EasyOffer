  reference_answer: '根据 Elasticsearch 面试题速记通关版; page 10：

    什么是 Elasticsearch 的 Document 文档?如何存储和检索文档?

    Elasticsearch 的文档是数据存储和检索的基本单位,相当于数据库中的一行记录,但它是以 JSON 格式存在的。每个

    文档由字段(field)组成,字段可以是字符串、数字、对象等类型,不需要预定义所有字段,具备一定的灵活性。

    文档存入 ES 时,会先根据 _index 、_type (旧版本)和 _id 确定位置,然后被序列化为 JSON 并写入倒排索

    引和正排索引中。倒排索引用于快速查找关键词对应的文档,而正排索引(如 _source 字段)保存原始 JSON,用

    于查询时返回内容。

    文档的存储流程如下:

    检索时通过 GET 请求指定索引和 ID 可直接定位文档,属于精确查找,性能很高。如果用查询语句(如 match ),则

    会利用倒排索引扫描匹配项,再从 _source 中提取原始数据返回。

    需要注意的是,文档写入后近实时可见,不是立即可查,除非手动 refresh。每次 refresh 会生成新的 segment,频繁

    操作会影响性能,一般生产环境设为 30 秒一次。

    批量写入建议用 _bulkAPI,减少网络开销和 segment 合并压力。单文档操作适合低频场景,高并发写入得靠 bulk

    扛住。'
