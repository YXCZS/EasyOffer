  relevance:
    09b34492e83725f312b66cf5fda368830e04c1e731a0f1a35ad63675548bb173: 2
  expected_knowledge_points:
  - Java 基础
  - 接口和抽象类有什么区别
  reference_answer: '根据 Java 基础面试题速记通关版; page 16：

    接口和抽象类有什么区别?

    接口和抽象类虽然都能定义方法契约,但它们的定位和能力完全不同。

    抽象类本质还是个类,它允许你写具体的方法实现,也能定义成员变量。子类继承它的时候,可以复用里面已有的代

    码。比如你有个 BaseService 抽象类,里面写了通用的日志记录逻辑,所有业务服务继承它就能直接用。

    接口就更纯粹了,从 Java8 开始允许默认方法实现,但它主要还是用来声明“能做什么”。一个类可以实现多个接

    口,比如 ArrayList 既实现了 List 又实现了 RandomAccess 。这在设计扩展点时特别有用,像 Spring 的

    ApplicationContextAware 、InitializingBean 都是通过接口让 Bean 感知容器生命周期。

    1)抽象类强调“是什么”,适合有共同属性和行为的场景

    2)接口强调“有什么能力”,适合解耦和横向扩展

    3)抽象类只能单继承,接口可以多实现

    publicabstractclassAnimal {

    protectedStringname;

    publicabstractvoidmakeSound();

    publicvoidsleep() {

    System.out.println("Sleeping...");

    }

    }

    publicinterfaceFlyable {

    defaultvoidfly() {

    System.out.println("Flying...");

    }

    }

    实际开发里,一般用抽象类做骨架实现,接口定义行为规范。像 JDK 里的 InputStream 是抽象类,因为有共用的

    读取逻辑;而 Comparable 就是典型的能力接口。'
