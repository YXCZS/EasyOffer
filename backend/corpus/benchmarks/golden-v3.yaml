- query_id: g-046
  scenario_type: stable_technical
  topic: Nginx
  query: 'Nginx: Nginx 是如何处理一个请求的?'
  role: backend
  difficulty: medium
  expected_technologies:
  - Nginx
  relevance:
    07f6cd03de5bd5d484d2ebcc3282ac8b649c3f85d91789e5f3242de9a81e9606: 2
  expected_knowledge_points:
  - Nginx
  - Nginx 是如何处理一个请求的
  reference_answer: '根据 Nginx 面试题速记通关版; page 18：

    Nginx 是如何处理一个请求的?

    Nginx 处理请求的核心在于事件驱动和多进程协作,整个过程不走传统的线程每请求模式,靠的是一个 master 进程加

    多个 worker 进程的结构。

    master 进程干的事很简单,就管生命周期、配置加载、启停 worker。真正干活的是 worker 进程,每个 worker 独立

    处理网络事件,靠 epoll(Linux)这样的机制监听连接。

    一个请求进来时,操作系统先把它放进监听 socket 的等待队列。worker 进程通过事件循环捕获到可读事件,就开始

    accept 连接,拿到客户端 fd。接着解析 HTTP 请求头,匹配 location 路由规则,看看是反向代理给 upstream ,比如

    转发到 Tomcat 或 SpringBoot 服务,还是直接 serve 静态文件。

    如果是静态资源,Nginx 直接 read 文件内容返回,还能用 sendfile 零拷贝机制,数据压根不经过用户态缓冲,直接从

    内核文件系统传到网卡。要是走反向代理,就会在内部建立与后端服务的连接,把请求发过去,等响应回来再回传给

    客户端。

    整个过程中,每个 worker 用非阻塞 IO 处理成千上万个并发连接,内存占用极低。这也是为啥 Nginx 能扛住几万并发

    的底层原因。'
