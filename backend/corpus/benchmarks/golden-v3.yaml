- query_id: g-051
  scenario_type: stable_technical
  topic: RabbitMQ
  query: 'RabbitMQ: 如何在 RabbitMQ 中配置消息的 TTL(过期时间)?'
  role: backend
  difficulty: medium
  expected_technologies:
  - RabbitMQ
  relevance:
    0c86c66aed647717961292986dcfc6fcf03d2f3709d14d2f217fc847cf012876: 2
  expected_knowledge_points:
  - RabbitMQ
  - 如何在 RabbitMQ 中配置消息的 TTL(过期时间)
  reference_answer: '根据 RabbitMQ 面试题速记通关版; page 6：

    如何在 RabbitMQ 中配置消息的 TTL(过期时间)?

    消息过期时间 TTL 是控制消息生命周期的关键机制,RabbitMQ 提供了两种配置方式,适用不同场景。

    1)为队列设置统一的 TTL

    所有进入该队列的消息都会共享同一个过期时间。比如你希望订单系统里未处理的消息最多存留 5 分钟,就可以在声

    明队列时指定:

    Map<String, Object> args = newHashMap<>();

    args.put("x-message-ttl", 300000); // 毫秒

    channel.queueDeclare("order.queue", true, false, false, args);

    2)为单条消息设置 TTL

    更灵活的方式是在发送消息时单独指定,适合不同消息生命周期差异大的场景:

    AMQP.BasicPropertiesprops = newAMQP.BasicProperties.Builder()

    .expiration("60000") // 60 秒后过期

    .build();

    channel.basicPublish("", "queue.name", props, body);

    注意:如果队列和消息都设置了 TTL,以较短的那个为准。而且 TTL 到期后消息不会立刻消失,只有当它到达队头被

    消费或清理时才会被移除。

    死信队列常配合 TTL 使用。过期消息会被自动路由到 DLX(死信交换机),可用于实现延迟任务,比如用 RabbitMQ 模

    拟订单超时取消,结合 TTL 和 DLX 就能搞定。'
