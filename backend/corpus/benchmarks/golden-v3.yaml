- query_id: g-076
  scenario_type: stable_technical
  topic: ZooKeeper
  query: 'ZooKeeper: 在 ZooKeeper 的 config 命名空间中,每个 ZNode 最大能存储多少数据?'
  role: backend
  difficulty: medium
  expected_technologies:
  - ZooKeeper
  relevance:
    0b4f7b8f34684c3f95016c0ddd3fe3bd61471e408f4a8dcc2c4362773a3dda28: 2
  expected_knowledge_points:
  - ZooKeeper
  - 在 ZooKeeper 的 config 命名空间中,每个 ZNode 最大能存储多少数据
  reference_answer: '根据 ZooKeeper 面试题速记通关版; page 14：

    在 ZooKeeper 的 config 命名空间中,每个 ZNode 最大能存储多少数据?

    ZooKeeper 的单个 ZNode 节点存储数据有严格限制,最大不能超过 1MB,也就是 1048576 字节。这个限制是硬性

    的,如果尝试写入超过这个大小的数据,ZooKeeper 会直接拒绝并抛出运行时异常。

    这么设计其实是为了保证整个集群的高性能和一致性。ZooKeeper 基于 ZAB 协议实现分布式协调,所有写操作都要通

    过 Leader 广播并持久化到磁盘,同时还要复制给 Follower。如果允许存大文件,网络传输、序列化反序列化、内存

    占用都会成为瓶颈,一致性协议的效率就垮了。

    所以它压根不是用来当分布式存储用的,像配置管理、服务发现这类场景才是它的主战场。比如 Dubbo 或 Kafka 用

    ZooKeeper 存节点元数据,一般也就几 KB。你要真想存大文件,得交给 HDFS 或者对象存储,让 ZooKeeper 专心搞

    协调。

    需要特别注意的是,这个 1MB 是包含数据内容和节点自身元信息(比如版本号、ACL 等)的总和,实际可用空间略小

    一点。生产环境建议把单节点数据控制在几 KB 到几十 KB 以内,避免拖慢整体性能。

    // 创建节点时要注意数据长度

    byte[] data = "config=xxx".getBytes(StandardCharsets.UTF_8);

    if (data.length > 1024 * 1024) {

    thrownewIllegalArgumentException("DatatoolargeforZNode");

    }

    zk.create(path, data, ZooDefs.Ids.OPEN_ACL_UNSAFE, CreateMode.PERSISTENT);

    如果你看到某些资料提到可以通过修改 jute.maxbuffer 参数来调大限制,理论上可行,但官方强烈不推荐,容易

    引发各种稳定性问题。'
