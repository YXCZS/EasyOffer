  reference_answer: '根据 AI 大模型原理和应用面试题速记通关版; page 7：

    MCP 的工作流程是什么?

    MCP 其实是 ModelContextProtocol 的缩写,它不是传统中间件或 Java 领域的标准组件,而是在 AIAgent 架构中用

    来规范大模型与外部工具、数据源之间交互的协议。它的核心作用是让模型能安全、可控地访问运行时上下文。

    整个流程从用户发起请求开始。Agent 接收到输入后,会先做一次意图解析,判断是否需要调用工具。如果需要,就

    会构造一个符合 MCP 格式的请求包,里面包含动作类型、参数和上下文元信息。

    接下来这个请求会被转发给对应的工具适配器。比如你要查数据库,就会走 SQL 工具链;要发 HTTP 请求,就交给

    API 客户端处理。执行结果原路返回,由 MCP 解析器把原始响应转成模型能理解的自然语言片段。

    1)请求触发:用户输入进入 Agent 循环

    2)决策判断:Controller 判断是否需外部调用

    3)协议封装:按 MCP 标准生成 toolcall 消息

    4)工具执行:Adapter 调用具体服务并获取结果

    5)上下文注入:将结果以结构化方式回填到 prompt 上下文

    这种设计的好处是解耦了模型逻辑和外部系统。像 LangChain 或 SemanticKernel 这类框架,底层其实就是靠类似

    MCP 的机制在做调度。你不需要改模型代码,只要注册新工具就能扩展能力。'
