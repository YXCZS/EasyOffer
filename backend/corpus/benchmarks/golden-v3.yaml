  reference_answer: '根据 MySQL 面试题速记通关版; page 14：

    什么是 CDC(ChangeDataCapture)?常见的 CDC 工具有哪些?

    CDC 的本质是捕获数据变更事件,而不是定期轮询快照。数据库的事务日志比如 MySQL 的 binlog、PostgreSQL 的

    WAL 天然就是变更流,CDC 工具就是把这些日志实时解析成可消费的消息。

    这类工具不依赖业务代码侵入,能以极低延迟把增删改操作同步到下游,典型场景是保持缓存与数据库一致、数据仓

    库实时入仓、微服务间解耦。如果靠定时任务扫表,延迟高还容易把数据库搞崩。

    常见开源方案有几种路线:

    1)基于数据库日志解析,Debezium 是主流选择,它用 KafkaConnect 框架做分布式采集,支持 MySQL、

    PostgreSQL、Oracle 等多种源,能把每一行变化发到 KafkaTopic 里。

    2)阿里开源的 Canal 只针对 MySQL,模拟 slave 拉取 binlog,适合纯 Java 技术栈的公司集成,像阿里内部早期就用

    它做订单数据同步。

    3)商业产品如 OracleGoldenGate 功能更强,但成本高;现代数仓场景也有 FlinkCDC 直接嵌入计算引擎,用 SQL

    就能写变更管道。

    代码层面,Debezium 的配置核心是定义 connector 的 source 属性,指定数据库地址、binlog 位点、加密方式等,启

    动后自动生成数据流。

    注意点:DDL 变更处理要小心,字段删除可能导致消息格式不兼容;还有断点续传必须依赖可靠的 offset 存储。'
