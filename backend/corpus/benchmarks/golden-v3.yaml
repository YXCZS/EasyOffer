  role: backend
  difficulty: medium
  expected_technologies:
  - Nginx
  relevance:
    1a7b20cff7b3483a010261f4f25ac86ac8105552ad3786ca7b5bccffbc33418b: 2
  expected_knowledge_points:
  - Nginx
  - Nginx 命令中 -s 参数的作用是什么?具体有哪些用法
  reference_answer: '根据 Nginx 面试题速记通关版; page 7：

    Nginx 命令中 -s 参数的作用是什么?具体有哪些用法?

    s 是 signal 的意思,用来给 Nginx 主进程发信号,实现运行时控制。它不重启服务就能让 Nginx 重新加载配置或平

    滑升级,属于线上运维的常规操作。

    用法都通过 nginx -s <signal> 触发,前提是得有权限操作对应进程。

    1)reload

    重新加载配置文件。Nginx 会先检查 conf 文件语法是否正确,没问题就通知主进程启动新 worker 进程,老进程在处

    理完已有请求后自动退出。这是修改 nginx.conf 后的标准操作。

    2)stop

    快速关闭,发送 SIGTERM 信号,强制 worker 立刻终止。可能中断正在处理的请求,生产环境慎用。

    3)quit

    优雅关闭,发送 SIGQUIT。主进程等所有 worker 处理完当前请求后再完全退出,保证服务完整性。

    4)reopen

    重新打开日志文件,用于日志轮转场景。比如你用 logrotate 切了 access.log,发 reopen 会让 Nginx 关闭旧 fd 并打

    开新的 access.log,避免日志写不进去。

    实际命令示例:

    nginx -sreload

    这类操作依赖 masterprocess 记录的 pid,默认存在 nginx.pid 文件里。如果路径不对,可以用 -p 指定目录,比

    如:

    nginx -p /usr/local/nginx/ -sreload

    整个过程压根不经过配置重载,靠的是进程间信号通信机制。这种设计让 Nginx 在高并发下也能安全调整状态,像阿

    里云 SLB 背后的 Tengine 就大量依赖这类指令做动态管控。'
