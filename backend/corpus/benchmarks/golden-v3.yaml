  - 消息队列
  relevance:
    204920025b5acea9afef02cec03e7a5077c6bffd5ded40a2f2930ef3c6a37b68: 2
  expected_knowledge_points:
  - 消息队列
  - RabbitMQ 中主要有哪几个角色或者说概念
  reference_answer: '根据 消息队列面试题速记通关版; page 6：

    RabbitMQ 中主要有哪几个角色或者说概念?

    RabbitMQ 的模型设计其实挺清晰的,搞懂几个关键角色,用起来就顺了。

    生产者不直接把消息丢给队列,而是发给 Exchange。这玩意儿像个路由器,拿到消息后根据类型和绑定规则,决定

    往哪个队列送。

    队列(Queue)就是存消息的地方,FIFO 原则,一条消息通常只被一个消费者处理。它在 RabbitMQ 里是实际承载数

    据的实体,可以持久化、设置长度限制等。

    Exchange 怎么知道该把消息给哪个 Queue?靠的是 Binding 绑定规则。比如 Direct 类型按 routingkey 精确匹配,

    Topic 支持通配符,Fanout 直接广播。

    消费者从 Queue 里取消息,处理完要发个确认(ACK),不然 RabbitMQ 会认为没处理成功,可能重新投递。网络断

    了或者消费者挂了,也能靠这个机制保证消息不丢。

    整个链路就是:生产者 → Exchange → Queue → 消费者,中间靠 Binding 和 RoutingKey 控制流向。

    这种解耦设计让系统扩展性很强,比如换个 Exchange 类型就能实现广播或按规则分发,代码不用大改。'
