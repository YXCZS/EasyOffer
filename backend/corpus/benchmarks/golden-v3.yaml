  reference_answer: '根据 设计模式面试题速记通关版; page 9：

    什么是状态模式?一般用在什么场景?

    状态模式本质上是把对象的行为包装在不同状态类里,让对象在运行时通过切换状态类来改变行为。你不用写一堆 if-

    else 判断当前状态再执行对应逻辑,而是让“状态”自己决定该干什么。

    1)每个状态都实现统一接口,比如 handle() 方法,具体行为由子类实现

    2)上下文(Context)持有一个状态实例,所有请求都委托给当前状态处理

    3)状态之间可以互相转换,比如订单从“待支付”变成“已发货”

    这种模式特别适合状态多、状态转换复杂、每个状态行为差异大的场景。举个例子,电商系统的订单状态机⸺待支

    付、已支付、已发货、已完成、已取消,如果全用 if-else 堆在一起,改一个状态跳转就得动整个方法,后期根本搞不

    定。用状态模式,每个状态独立封装,新增状态或修改流转只影响对应类。

    游戏开发里也常见,比如角色有“ idle ”、“running”、“attacking”状态,不同状态下按键响应完全不同,用状态模

    式就很清晰。

    interfaceOrderState {

    voidpay(OrderContextctx);

    voidship(OrderContextctx);

    }

    classPendingPaymentimplementsOrderState {

    publicvoidpay(OrderContextctx) {

    ctx.setState(newShipped());

    }

    publicvoidship(OrderContextctx) { /* 不允许操作 */ }

    }

    状态模式真正发力的点在于它让状态变更和行为扩展变得可控。你不再是在一个大类里修修补补,而是用多态代替条

    件判断,代码结构更稳定。'
