  reference_answer: '根据 Java 虚拟机面试题速记通关版; page 10：

    Java 里的对象在虚拟机里面是怎么存储的?

    Java 对象在虚拟机里的存储,得从内存布局说起。对象创建后主要分布在堆上,而它的内存结构可以拆成三块:对象

    头、实例数据和对齐填充。

    对象头里存了两样东西,一个是 MarkWord,用来放哈希码、GC 分代年龄、锁状态这些信息;另一个是指向类元数据

    的指针,JVM 靠它确定这个对象是哪个类的实例。如果是数组,这里还会多出一个记录长度的字段。

    接下来是实例数据,这部分最实在,就是你定义的那些成员变量,按声明顺序排列,父类的变量也会包含进来。JVM

    会按 long/double、int、short/char、byte/boolean 这样的顺序重新排序,目的是为了内存对齐,减少空间浪费。

    最后是对齐填充,不是必须的。因为 JVM 要求对象大小必须是 8 字节的整数倍,不够就得补上。

    这种布局方式直接影响 GC 和并发性能。比如 synchronized 锁升级过程就会修改 MarkWord 的内容,从无锁到偏向

    锁、轻量级锁再到重量级锁,都是在这块做文章。理解这块结构,对排查竞争激烈时的性能问题很有帮助。'
