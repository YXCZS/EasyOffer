  reference_answer: '根据 AI 大模型原理和应用面试题速记通关版; page 44：

    什么是 A2A 协议,它的核心架构及主要组件有哪些?

    A2A(Application-to-Application)协议不是某个具体的技术标准,而是描述系统间通过预定义接口直接通信的模

    式。这类交互通常在服务之间完成数据交换或功能调用,不依赖用户参与。

    一般架构下,A2A 的核心是去中心化或轻量网关控制的服务直连。常见于微服务、B2B 集成或内部系统协同场景。比

    如订单系统自动触发库存扣减,就是典型的 A2A 调用。

    典型组件包括:

    1)服务提供方:暴露 RESTfulAPI 或 gRPC 接口,比如用 SpringBoot 实现的用户中心服务。 2)服务消费方:主动

    发起请求的应用,例如交易系统调用风控服务做决策。 3)认证与授权模块:常用 OAuth2 的 ClientCredentials 模

    式,确保机器身份可信。API 密钥也常用于轻量场景。 4)API 网关(可选):像 Kong 或 Apigee,负责限流、日志、

    路由,但高并发内网调用时常绕过网关直连以降低延迟。 5)服务注册与发现:在动态环境中,Eureka 或 Nacos 帮助

    消费方找到可用实例。

    代码上,一个简单的 A2A 调用可能长这样:

    // 使用 WebClient 发起异步请求

    webClient.get()

    .uri("http://user-service/users/123")

    .retrieve()

    .bodyToMono(User.class)

    .block();

    注意点在于网络超时、重试策略和熔断机制。如果搞不定容错,雪崩效应会迅速扩散。因此,配合 Hystrix 或

    Resilience4j 是常规操作。'
