  relevance:
    0be17a95d6f94420bc3bbf251e17dccd2d84c527d7b740a72a76811c94f2e902: 2
  expected_knowledge_points:
  - AI 大模型
  - LLMAgent 在多模态任务中如何执行推理
  reference_answer: '根据 AI 大模型原理和应用面试题速记通关版; page 57：

    LLMAgent 在多模态任务中如何执行推理?

    多模态任务里,LLMAgent 的推理不是简单看图说话,而是把文本、图像、音频这些不同模态的信息统一拉到一个向

    量空间里做对齐。模型在预训练阶段就见过大量图文对,比如用 CLIP 这类结构把图片和文字映射到同一语义空间,这

    样一张“狗追球”的图,能和对应描述在特征上挨得特别近。

    1)输入进来时,图像走视觉编码器(比如 ViT)转成 patchembeddings,文本走 tokenizer 转成 tokenembeddings,两者长度不一样没关系,关键是通过交叉注意力让
    LLM 主干能“看见”图像特征。 2)推理过程中,

    LLM 不是只靠记忆生成答案,而是结合上下文做因果推断。比如问“图中动物在干什么”,它会关联“奔跑”、“草

    地”、“球体运动轨迹”这些视觉线索,生成“狗在追球”而不是“狗在睡觉”。 3)有些复杂任务还会引入外部工具调

    用,比如先识别图像中的数学公式,再丢给 SymPy 计算,最后把结果整合进回答⸺这步就是 agent 的规划能力体

    现。

    这类系统典型代表是 LLaVA、Qwen-VL,它们在架构上做了端到端训练,确保语言模型能真正理解而不是“猜”图像

    内容。纯 prompt 工程压根搞不定跨模态语义鸿沟,必须依赖对齐训练。'
