  reference_answer: '根据 Java 并发面试题速记通关版; page 37：

    什么是 Java 的 happens-before 规则?

    Java 的 happens-before 规则是用来定义多线程环境下操作可见性的一套规则。它不等于时间先后,而是一种先行发

    生关系,保证一个操作的结果对另一个操作可见。

    比如线程 A 修改了某个变量,线程 B 读到了这个修改,这就构成了 happens-before 关系。如果没有这种规则约束,

    由于指令重排、缓存不一致等问题,B 可能压根看不到 A 的改动。

    常见的 happens-before 规则有这么几种:

    1)同一个线程中的操作,按照代码顺序自然形成 happens-before。 2)volatile 变量的写操作 happens-before 之后

    对该变量的读。 3)synchronized 块的解锁 happens-before 后续对同一锁的加锁。 4)线程的 start() 调用 happens-

    before 新线程里的任意操作。 5)线程的所有操作 happens-before 对该线程的 join() 返回。 6)传递性:Ahappens-

    beforeB,Bhappens-beforeC,则 Ahappens-beforeC。

    举个例子,用 volatile 修饰状态标志位,就能确保启动线程前的初始化操作不会被重排到写标志位之后,避免其他线

    程看到未完成初始化的状态。

    volatilebooleaninitialized = false;

    // 线程 Adata = 1;

    initialized = true; // 写 volatile

    // 线程 Bif (initialized) { // 读 volatileSystem.out.println(data); // 能安全看到 data
    = 1

    }

    这套规则其实是 JMM (Java 内存模型)的一部分,编译器和 CPU 的优化都得遵守它,才能让并发编程有据可依。'
