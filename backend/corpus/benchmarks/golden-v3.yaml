  - MyBatis 动态 sql 有什么用?执行原理?有哪些动态 sql
  reference_answer: '根据 MyBatis 面试题速记通关版; page 5：

    MyBatis 动态 sql 有什么用?执行原理?有哪些动态 sql?

    动态 SQL 是为了解决拼接 SQL 字符串的痛点。你肯定遇到过根据条件决定是否添加 WHERE 子句的情况,以前靠手拼

    字符串,容易出错还难维护。

    MyBatis 的动态 SQL 在解析阶段就把这些逻辑处理掉,最终生成一个干净的 SQL 语句交给数据库执行。整个过程发生

    在 SqlSource 构建时,通过 OGNL 表达式计算条件,生成对应的 BoundSql。

    常见的标签有这几个:

    1)<if> 最常用,条件成立才拼入 SQL2)<where> 自动处理 AND/OR 开头问题,条件为空时不生成 WHERE3)<set> 配合 update
    使用,自动加 SET 关键字并去掉末尾逗号

    4)<trim> 更底层的封装,可以自定义前后缀和前缀后缀去除规则

    5)<foreach> 遍历集合,常用于 IN 查询或批量插入

    6)<choose> 、<when> 、<otherwise> 类似 Java 的 switch-case

    比如写个查询:

    <selectid="list" resultType="User">

    SELECT * FROMuser

    <where>

    <iftest="name != null">ANDname = #{name}</if>

    <iftest="age != null">ANDage = #{age}</if>

    </where>

    </select>

    传 null 参数时,对应条件直接消失,不会影响其他部分。

    注意 <if> 标签别乱堆,复杂场景用 <trim> 控制更精准。像 IN 查询这种必须用 <foreach> ,不然搞不定参

    数绑定。'
