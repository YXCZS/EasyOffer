  reference_answer: '根据 计算机网络面试题速记通关版; page 4：

    简单谈谈你对 DNS 的理解?

    DNS 本质上就是把域名翻译成 IP 地址的一个分布式系统。你访问 google.com ,最终得知道它背后是哪个 IP 的服务器

    在扛着,这个“翻译”工作就是 DNS 干的。

    整个过程不是一蹴而就的,一般会经历几个环节。本地查 hosts 文件,没命中就问本地配置的 DNS 服务器,比如运营

    商给的或者你手动设的 8.8.8.8。这台服务器如果缓存里有就直接返回,没有就得一层层往上问:先问根域名服务器,

    再问顶级域(比如 .com ),最后找权威域名服务器拿到结果。

    1)递归查询:客户端只管发请求,期望拿到最终答案,不管中间谁去跑腿。

    2)迭代查询:DNS 服务器之间互相问,每次只返回下一级该找谁,自己不继续往下追。

    缓存在这套体系里特别关键,几乎每一层都会缓存一段时间(TTL 控制),减少重复查询压力,也提升响应速度。但

    TTL 没过期前,改了记录可能不会立刻生效。

    举个例子,用 Nginx 或者 CDN 做负载均衡时,通常会给一个域名配多个 A 记录,DNS 返回的时候可以轮询,实现最

    基础的流量分发。不过这种方案粒度粗,健康检查弱,真要搞高可用还得靠 LVS 或者云厂商的负载服务。'
