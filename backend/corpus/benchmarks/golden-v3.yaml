  - Select、Poll、Epoll 之间有什么区别
  reference_answer: '根据 操作系统面试题速记通关版; page 12：

    Select、Poll、Epoll 之间有什么区别?

    select、poll 和 epoll 都是 Linux 下处理 I/O 多路复用的机制,用来让一个线程能同时监控多个文件描述符的读写状

    态。它们的核心目标是一样的,但实现方式和性能差异很大。

    1)select 使用固定大小的位图来表示 fd 集合,通常最大支持 1024 个 fd。每次调用都要把整个 fd 集合从用户态拷贝

    到内核态,返回后还要遍历所有 fd 判断是否就绪。这种方式在连接数多时开销大,效率低。

    2)poll 其实跟 select 差不多,只是换成了链表结构传递 fd,突破了 1024 的限制。但它依然需要遍历所有 fd,而且每

    次都要传全量数据,没有解决根本的性能问题。

    3)epoll 完全换了个思路,它在内核里用红黑树管理 fd,用就绪队列回调通知。调用 epoll_ctl 添加 fd 时注册回调函

    数,一旦有事件触发,内核直接把 fd 放进就绪队列。epoll_wait 调用时只返回就绪的 fd,不用遍历全部。这种机制让

    单个线程轻松扛住几万并发,Nginx、Netty 都靠它撑着。

    简单说,select 和 poll 是“你有没有事?我去挨个问一遍”,而 epoll 是“有事我主动告诉你”。连接少的时候差别不

    大,上几千并发时,epoll 的优势就压倒性了。'
