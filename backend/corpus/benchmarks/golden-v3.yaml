  - '来源：Java 并发面试题速记通关版; page 16

    Synchronized 能不能禁止指令重排序?

    synchronized 主要解决的是互斥性和可见性问题,它能保证同一时刻只有一个线程进入同步块,同时对共享变量的修

    改对后续进入的线程可见。至于指令重排序,它确实能限制一部分,但不是靠插入内存屏障那种精细控制。

    Java 内存模型里,synchronized 的实现依赖于 monitorenter 和 exit,monitorenter 会触发一个 acquire
    操作,

    exit 会触发 release 操作。acquire-release 语义能保证:在 monitorexit 之前的所有写操作,对下一次 acquire
    同一

    把锁的线程来说都是可见的,并且不会被重排序到 exit 之后。同理,acquire 之后的操作也不会被重排序到它之前。

    这相当于在锁释放时,把之前的写操作都“刷出去”,在获取锁时,强制重新加载共享变量。所以从效果上看,多个线

    程通过同一把锁同步时,不会看到彼此内部的指令重排结果。

    但它不像 volatile 那样针对单个变量做读写屏障,它的边界是整个同步块。你不能指望 synchronized 去禁止某个特定

    变量的重排序,如果需要更细粒度控制,得用 volatile 或显式内存屏障。

    1)锁的作用范围是代码块,不是变量

    2)它靠 acquire-release 语义间接抑制重排

    3)比 volatile 更重,但适合复合操作

    说白了,它能“顺便”管住重排序,但不是为此设计的。'
