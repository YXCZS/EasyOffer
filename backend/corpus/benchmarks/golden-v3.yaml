- query_id: g-067
  scenario_type: stable_technical
  topic: SpringBoot
  query: 'SpringBoot: SpringBoot 支持哪些嵌入 Web 容器?'
  role: backend
  difficulty: medium
  expected_technologies:
  - SpringBoot
  relevance:
    22c94d574ee2ab1260195c9fd1f2cb1d6e079d28561e468657c500c50f833d1c: 2
  expected_knowledge_points:
  - SpringBoot
  - SpringBoot 支持哪些嵌入 Web 容器
  reference_answer: '根据 SpringBoot 面试题速记通关版; page 15：

    SpringBoot 支持哪些嵌入 Web 容器?

    SpringBoot 开箱就支持好几种嵌入式 Web 容器,最常用的其实是三个:Tomcat、Jetty 和 Undertow。

    1)默认是 Tomcat,你只要引入 spring-boot-starter-web ,它自带了 Tomcat 作为嵌入容器,启动后就能直

    接对外服务,不用额外部署 WAR 包。

    2)如果你想用 Jetty,比如在高并发长连接场景下压测表现更好,那就把 starter 里的 Tomcat 依赖排除,加上

    spring-boot-starter-jetty 。像 SpringCloudGateway 有些项目就会切到 Jetty 或 Undertow。

    3)Undertow 是 RedHat 出的,性能不错,内存占用也低,适合想压榨服务器资源的场景。换起来也简单,排除

    Tomcat 后引入 spring-boot-starter-undertow 就行。

    它们都是通过 ServletWebServerFactory 接口来创建具体容器实例的,SpringBoot 自动配置会根据 classpath

    上的类选择合适的实现。比如看到 org.apache.catalina.startup.Tomcat 就上 Tomcat,看到

    io.undertow.Undertow 就初始化 Undertow。

    代码上你完全不用改,切换靠依赖管理。举个 Maven 的片段:

    <exclusions>

    <exclusion>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-starter-tomcat</artifactId>

    </exclusion>

    </exclusions>

    <artifactId>spring-boot-starter-tomcat</artifactId>

    </exclusion>

    </exclusions>

    加上对应的 starter 就能替换。一般小项目用默认 Tomcat 完全够用,搞微服务网关或者追求极致性能再考虑换。'
