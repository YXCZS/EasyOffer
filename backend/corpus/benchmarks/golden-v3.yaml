    fsync 到磁盘,事务就可以返回成功,数据不会丢。 3)简化恢复。崩溃后用日志 replay 状态,比检查整个数据文件高

    效多了。

    MySQL 的 InnoDB 引擎就是靠这个撑起来的。它的 redolog 就是典型的 WAL 实现。你执行一条 UPDATE,InnoDB

    先写 redologbuffer,事务提交时刷到磁盘的 redolog 文件,之后才异步刷脏⻚到 ibd 文件。

    // 伪代码示意 WAL 流程

    write_log_to_buffer(log); // 写日志到内存

    fsync_log_file(); // 日志落盘(关键步骤)

    apply_change_to_data_page(); // 数据⻚可以晚点刷

    整个过程像极了记账:不急着改总账本,先在流水本上记一笔,回头慢慢对账。这流水本就是 redolog。'
