  query: 'MySQL: 什么是 Write-AheadLogging (WAL) 技术?它的优点是什么?MySQL 中是否用到了 WAL?'
  role: backend
  difficulty: medium
  expected_technologies:
  - MySQL
  relevance:
    0bc0fdcc9a620f2830319ba56db25271d6ec35a005cb6067c259b09987c26af0: 2
