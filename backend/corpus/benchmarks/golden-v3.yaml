  reference_answer: '根据 SpringCloud 面试题速记通关版; page 34：

    负载均衡的实现方式有哪些?

    负载均衡的实现方式从层级上看,主要分四层和七层两大类。四层基于 IP 和端口转发,核心是 LVS 这种工具,靠

    NAT、DR 或 TUN 模式把请求打到后端机器,性能强,每秒能扛几万并发,适合做最外层入口。七层在应用层做,比

    如 Nginx 或 Envoy,能解析 HTTP 头,按路径、域名甚至 Header 内容分流,灵活但性能损耗高点。

    1)网络层用 LVS 时,DR 模式最常见,前端通过修改 MAC 地址把请求直接发给真实服务器,响应不走调度器,吞吐

    高,但要求所有机器在同一个局域网。

    2)HTTP 服务一般用 Nginx 做反向代理,配置 upstream 就能实现轮询、权重或 IP 哈希,加个 keepalived 还能防单

    点故障。

    3)服务发现场景下,像 SpringCloudLoadBalancer 或 Dubbo 的内置负载策略,客户端自己选节点,减少中间环

    节,压根不经过独立网关。

    4)云环境里基本都用厂商方案,比如阿里云 SLB、AWSALB,背后是集群化 ETSI 转发,自动扩缩,运维成本低。

    代码上,Nginx 配置轮询很简单:

    upstreambackend {

    server192.168.1.10:8080;

    server192.168.1.11:8080;

    }

    LVS 的 DR 模式要注意 ARP 抑制,不然服务器可能收不到包。而七层方案得留意连接耗尽问题,尤其是代理大量后端

    时,文件描述符要调优。'
