  reference_answer: '根据 设计模式面试题速记通关版; page 27：

    23 种设计模式分为哪三大类?

    设计模式这东西,说白了就是前人踩坑总结出来的套路本子。23 种模式一般按解决的问题场景分成三类。

    1)创建型模式

    关注对象怎么生出来,把创建逻辑和使用逻辑拆开。比如你用 new 直接耦合了具体类,后面想换实现就麻烦。工厂方

    法、抽象工厂、建造者这些,都是为了让你解耦创建过程。Spring 里的 BeanFactory 就是典型的工厂思想。

    2)结构型模式

    重点在怎么组合类或对象形成更大的结构。比如你想给老系统加功能,但又不想改原来的代码。适配器模式就能让不

    兼容的接口能一起工作,装饰器模式可以在不修改原类的情况下动态加功能。JavaI/O 流里的

    BufferedInputStream 套 FileInputStream 就是装饰器的经典用法。

    3)行为型模式

    处理对象之间的职责分配和通信机制。比如一堆条件判断可以换成策略模式,状态切换复杂可以用状态模式。观察者

    模式在事件驱动场景里特别常见,像 Spring 的 ApplicationEvent 事件机制底层就用了它。'
