  reference_answer: '根据 Java 热门面试题 200 道速记通关版; page 101：

    说说 MyBatis 的缓存机制?

    MyBatis 的缓存分两级,一级缓存默认开启,作用域是 SqlSession 级别。只要你用同一个 SqlSession 执行相同的

    SQL,参数也一样,第二次查询直接从内存取结果,不用走数据库。

    1)一级缓存底层其实就是一个 HashMap,数据结构是 key(MappedStatementID + 查询参数)到缓存对象的映

    射。一旦执行 commit、update 或 close,缓存就清空。所以事务提交后,下个会话查的数据是新的。

    2)二级缓存作用范围更广,跨 SqlSession,通常集成 Redis、Ehcache 来实现。需要手动开启,对应的 Mapper 类得

    实现 Serializable,配置文件里加上 <cache/> 。多个会话查相同 Mapper 和参数时,先看二级缓存有没有。

    但要注意,二级缓存如果没设计好,可能出脏数据。比如 A 会话更新了数据还没提交,B 会话就从缓存读了旧值。一

    般在读多写少场景用,像商品信息这种,配合 TTL 控制失效时间。

    代码上,关键点是 MappedStatement 的 cache 属性是否绑定缓存实例。每次执行查询,CachingExecutor 先问

    cache 有没有,没有再委托给 BaseExecutor 去查数据库。

    简单说,一级缓存防一次会话重复查,二级缓存扛住多个会话的重复请求。真并发高并发场景,还是建议用 Redis 自

    定义缓存策略,比 MyBatis 默认的更可控。'
