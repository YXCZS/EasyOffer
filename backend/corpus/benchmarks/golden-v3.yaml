  reference_answer: '根据 RabbitMQ 面试题速记通关版; page 2：

    如何在 RabbitMQ 中声明一个队列?有哪些必要参数?

    声明一个队列,本质上是让 RabbitMQ 知道这个队列的存在,并设置它的行为。你可以在客户端通过 AMQP 协议发送

    QueueDeclare 命令来完成,一般用 channel.queueDeclare() 这个方法。

    1)队列名(queueName)

    这是最直观的参数,比如 "order.delay.queue" 。可以为空,RabbitMQ 会生成一个随机唯一的名字,适合临时

    队列。

    2)持久化(durable)

    设为 true 表示队列本身在 Broker 重启后依然存在。注意这只是队列元数据不丢,消息是否持久还要看消息属性和交

    换机绑定方式。

    3)独占性(exclusive)

    true 表示只有创建它的连接能使用,断开后自动删除。常用于 RPC 回调这种私有场景。

    4)自动删除(autoDelete)

    当没有消费者监听时,队列会被自动移除。适合短期任务或广播场景,比如用完即走的通知队列。

    5)额外参数(arguments)

    用来设置 x-message-ttl、x-max-length、x-dead-letter-exchange 等策略。比如延迟队列就靠 x-dead-letter-

    exchange 配合 TTL 实现。

    代码长这样:

    channel.queueDeclare("my.queue", true, false, false,

    Map.of("x-message-ttl", 60000));

    如果生产者或消费者都尝试声明同一个队列,只要参数一致就没问题。参数冲突会直接报错。所以通常建议由消费者

    端来声明,避免消息发到不符合预期的队列。'
