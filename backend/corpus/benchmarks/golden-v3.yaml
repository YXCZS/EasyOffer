  reference_answer: '根据 Java 基础面试题速记通关版; page 34：

    为什么在 Java 中编写代码时会遇到乱码问题?

    Java 中的乱码问题,本质是字符集不一致导致的。你从哪读数据、往哪写数据,每个环节用的编码规则必须对得上,

    不然就是“鸡同鸭讲”。

    比如你用 UTF-8 写了个中文文件,结果别人用 GBK 去读,那“你好”可能就变成“浣犲ソ”。反过来也一样。这

    种问题在 IO 操作、网络传输、数据库交互时特别常见。

    1) 文件读写时,没指定编码,默认用了系统编码。Windows 一般是 GBK ,Linux/Max 是 UTF-8 ,跨平台一跑,

    直接出事。

    2) Web 应用里,前端⻚面声明的是 UTF-8 ,但后端 Servlet 没设置 request.setCharacterEncoding("UTF-

    8") ,请求体里的中文就废了。

    3) 数据库连接 URL 没加 characterEncoding=utf8 ,存的时候就歪了。

    代码上要盯住几个点:

    // 读文件别用默认编码

    newString(Files.readAllBytes(Paths.get("a.txt")), StandardCharsets.UTF_8);

    // 写也要明确

    Files.write(path, " 内容 ".getBytes(StandardCharsets.UTF_8));

    还有个坑是 String.getBytes() 和 newString(bytes) 这俩操作,不带参数就用平台默认编码,一换环境就

    崩。所以一定要显式传 Charset 。

    只要记住:所有涉及字节和字符转换的地方,都得明确指定字符集,别偷懒。尤其是跨系统、跨语言、跨存储的时

    候,这个环节压根不经过大脑去猜,必须写死。'
