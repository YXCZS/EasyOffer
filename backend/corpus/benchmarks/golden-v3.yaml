- query_id: g-065
  scenario_type: stable_technical
  topic: Spring
  query: 'Spring: 什么是 AOP?'
  role: backend
  difficulty: medium
  expected_technologies:
  - Spring
  relevance:
    0ab8dfba032f9a59bb2054fcec0042d7d3212dde4b8fc593b5ca24456ee6a1c3: 2
  expected_knowledge_points:
  - Spring
  - 什么是 AOP
  reference_answer: '根据 Spring 面试题速记通关版; page 29：

    什么是 AOP?

    AOP,也就是面向切面编程,本质是为了解决横切关注点的代码复用和集中管理。像日志记录、权限校验、事务管理

    这些功能,散落在各个业务方法里,改起来费劲还容易漏。AOP 就是把这些横切逻辑抽出来,统一织入到目标方法的

    特定位置。

    SpringAOP 的实现依赖动态代理。如果目标类实现了接口,默认用 JDK 动态代理;没有接口就用 CGLIB。整个过程不

    需要修改原有代码,通过配置或注解就能把切面加进去。比如你用 @Around 写个环绕通知,就能在方法执行前后插

    入逻辑。

    1)切点(Pointcut)决定哪些方法要被拦截,通常用表达式匹配方法签名

    2)通知(Advice)定义在切点的哪个时机执行,比如前置、后置、环绕

    3)切面(Aspect)是切点和通知的组合,描述“在哪执行”和“执行什么”

    典型场景就是 Controller 层统一打日志,或者 Service 方法上加 @Transactional 。但别滥用,像业务逻辑本身就

    不该塞进切面里,否则别人看不懂流程。简单说,AOP 是工具,不是魔法,用好了事半功倍,用歪了就是坑。'
