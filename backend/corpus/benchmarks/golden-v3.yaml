  reference_contexts:
  - '来源：Java 虚拟机面试题速记通关版; page 14

    Java 中有哪些垃圾回收算法?

    Java 的垃圾回收算法主要围绕怎么找垃圾、怎么清理垃圾展开。不同算法适合不同场景,一般 CMS、G1 这些收集器

    会组合使用多种算法。

    1)标记-清除(Mark-Sweep)

    先标记所有存活对象,然后统一回收未被标记的垃圾。最大的问题是会产生内存碎片,比如老年代用 Serial 收集器时

    就用这个算法,长时间运行后可能因为碎片触发 FullGC。

    2)复制(Copying)

    把内存分成两块,每次只用其中一块。当这一块满了,就把存活对象复制到另一块,然后清空原来的那块。效率高,

    不会产生碎片,但可用内存直接砍半。年轻代的 MinorGC 基本都用这个思路,比如 ParNew 和 G1 在年轻代阶段。

    3)标记-整理(Mark-Compact)

    标记过程和“标记-清除”一样,但后续不是直接清理,而是把存活对象往一端滑动,再清理边界外的内存。适合老年

    代这种对象多、回收少的场景,避免碎片问题。CMS 在并发失败降级后就会用这个算法做 FullGC。

    4)分代收集(GenerationalCollection)

    这不是具体算法,而是策略。基于对象生命周期分布:90% 对象朝生夕死。年轻代用复制算法,回收快;老年代用标

    记-清除或标记-整理。G1 和 ZGC 都是基于分代思想演进出来的。

    像 G1 会把堆拆成多个 Region,逻辑上保留分代,回收时优先选垃圾多的区域,实现“增量整理”。ZGC 和

    Shenandoah 更激进,主打并发整理,停顿时间控制在 10ms 以内。'
