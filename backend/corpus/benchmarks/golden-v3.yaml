  reference_answer: '根据 Elasticsearch 面试题速记通关版; page 49：

    什么是 Elasticsearch 中的相关性得分?有哪些影响因素?

    相关性得分是 Elasticsearch 对搜索结果与查询关键词匹配程度的量化评分,分数越高代表文档越“相关”。这个分值

    由 TF-IDF 和 BM25 等相似度算法计算得出,默认从 ES5.x 开始使用 BM25。

    1)词频(TermFrequency):检索词在文档某个字段中出现的次数越多,相关性越高。比如一篇文档里“Java”出现

    了 10 次,大概率比只出现 1 次的更相关。

    2)逆文档频率(InverseDocumentFrequency):检索词在整个索引中出现的文档数越少,它的区分能力越强,权重

    就越高。“分布式”这种常见词 IDF 低,“ZooKeeper”这种少见词 IDF 高。

    3)字段长度归一化:短字段比长字段更容易获得高分。如果标题字段里命中了关键词,通常比在几万字的正文里命中

    更有意义。

    4)布尔逻辑和查询结构:must 、should 、filter 子句的影响不同。filter 不影响得分,纯用于过滤;而

    should 会贡献匹配分值。

    5)自定义权重控制:可以用 boost 参数提升某些查询或字段的优先级。例如给商品名称字段设置 boost=2 ,让

    它比描述字段更重要。

    代码上体现为 _score 字段:

    {

    "query": {

    "match": {

    "title": {

    "query": " 高性能 ",

    "boost": 3

    }

    }

    }

    }

    实际应用中,像电商搜索、日志分析这些场景都依赖精准的相关性排序。如果搞不定得分逻辑,搜出来一堆不相干的

    结果,用户体验直接崩掉。'
