- query_id: g-077
  scenario_type: stable_technical
  topic: ZooKeeper
  query: 'ZooKeeper: ZooKeeper 的默认端口是什么?各个端口分别有什么作用?'
  role: backend
  difficulty: medium
  expected_technologies:
  - ZooKeeper
  relevance:
    0cff640909000a909404220831399f4d1b31c9191368516d48f4ffa2e8275dd5: 2
  expected_knowledge_points:
