  - 什么是协程?Java 支持协程吗
  reference_answer: '根据 Java 并发面试题速记通关版; page 21：

    什么是协程?Java 支持协程吗?

    协程可以理解成“用户态的轻量级线程”,它让异步代码写起来像同步一样。线程由操作系统调度,而协程由程序自己

    控制挂起和恢复,切换成本比线程低得多,一个进程里能轻松跑几万个协程。

    Java 本身没有原生支持协程。JVM 上的 Kotlin 提供了完整的协程实现,通过 suspend 函数和 launch 等 API,

    能在不阻塞线程的情况下处理高并发 IO。比如用 Ktor 或 SpringWebFlux 配合 Kotlin 协程,一个线程就能扛住大量网

    络请求。

    如果非要用 Java 实现类似效果,一般靠响应式编程框架,比如 ProjectReactor 或 RxJava。它们用回调机制模拟异步

    流,虽然也能做到高并发,但代码复杂度比协程高不少。

    1)协程的核心是挂起函数,执行到 IO 时自动让出线程,等结果回来再恢复。 2)Kotlin 协程底层依赖编译器把

    suspend 函数拆成状态机,运行时通过 Continuation 管理上下文。 3)Java 的虚拟线程(VirtualThread)在某种程

    度上解决了类似问题。从 JDK19 开始孵化,到 JDK21 正式落地,它由 JVM 调度,能自动利用多核,写法还是传统的

    同步风格,但每个请求用一个虚拟线程,数量可以上百万。

    简单说,Java 没有协程,但 Kotlin 有;Java 自己搞了个虚拟线程来解决高并发场景下的线程成本问题,思路不同但

    目标一致。'
