  reference_answer: '根据 Elasticsearch 面试题速记通关版; page 55：

    如何优化 Elasticsearch 索引阶段的性能?

    索引阶段的性能瓶颈通常出现在数据写入时的分词、刷盘、段合并等环节。优化的核心是让写入更高效,减少资源争

    抢。

    1)调整刷新间隔

    默认 1 秒刷新一次,会频繁生成小 segment,增加 merge 压力。写入密集场景可以调大到 30s 甚至 -1(手动控制)。

    PUT /my-index/_settings

    { "refresh_interval": "30s" }

    2)批量写入代替单条提交

    bulkAPI 批量提交能显著降低网络和 I/O 开销。建议每批 5MB‒15MB 数据,避免过大导致超时。

    3)临时关闭副本

    写多读少时,可将 number_of_replicas 设为 0,写完再恢复。副本同步要等主分片落盘,关掉能提速 50% 以

    上。

    4)使用更快的合并策略

    默认 TieredMergePolicy 会自动合并小段,但可能太激进。写入高峰期可调高 merge.policy.floor_segment ,

    减少小合并。

    5)禁用不必要的特性

    不需要评分或高亮的字段,设为 index: false ;全量文本才需要分词,其他字段尽量用 keyword 避免分析开

    销。

    6)JVM 与磁盘协同

    堆内存别超过 32GB,避免指针压缩失效。索引目录挂载 SSD,文件系统用 noop 或 deadline 调度器减少延迟。

    写入前做压测,观察 threadpoolqueue 和 segmentcount,指标飙高就得调参数。记住,segment 是关键观测点。'
