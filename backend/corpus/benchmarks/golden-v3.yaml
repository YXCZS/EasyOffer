  reference_answer: '根据 Java 集合面试题速记通关版; page 3：

    JavaArrayList 的扩容机制是什么?

    ArrayList 的扩容发生在添加元素时容量不足的情况下,整个过程其实就几步:先检查是否需要扩容,再按比例增长,

    最后复制数据。

    1) 添加元素前会判断当前 size + 1 是否超过数组长度

    2) 如果超过,就会触发 grow() 方法进行扩容

    3) 新容量是旧容量的 1.5 倍,计算方式是 oldCapacity + (oldCapacity >> 1)

    4) 扩容后通过 System .arraycopy 将原数组数据拷贝到新数组

    初始容量默认是 10。第一次 add 时如果没指定大小,会创建一个长度为 10 的数组。后续每次扩容都按 1.5 倍往上

    加,比如从 10 到 15,再到 22、33......直到 Integer.MAX_VALUE。

    privatevoidgrow() {

    intoldCapacity = elementData.length;

    intnewCapacity = oldCapacity + (oldCapacity >> 1);

    elementData = Arrays.copyOf(elementData, newCapacity);

    }

    频繁扩容会影响性能,因为每次都要内存分配和数组拷贝。如果能预估数据量,建议初始化时直接指定容量,比如

    newArrayList<>(1000) ,这样能避免中间多次扩容的开销。

    扩容本身是脏活累活,但对上层透明。你只管 add,它自动帮你扛住容量问题,前提是别在循环里无脑 add 大量数据

    而不预设容量。'
