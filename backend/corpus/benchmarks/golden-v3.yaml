- query_id: g-058
  scenario_type: stable_technical
  topic: Redis
  query: 'Redis: 为什么 RedisZset 用跳表实现而不是红黑树?B+树?'
  role: backend
  difficulty: medium
  expected_technologies:
  - Redis
  relevance:
    0cca72ef59e518384994d88950c3f762a85a695f8b4eecc283ecd4cf11c5583a: 2
  expected_knowledge_points:
