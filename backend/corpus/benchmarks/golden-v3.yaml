  - 为什么 RedisZset 用跳表实现而不是红黑树?B+树
  reference_answer: '根据 Redis 面试题速记通关版; page 17：

    为什么 RedisZset 用跳表实现而不是红黑树?B+树?

    Redis 的 Zset 选择跳表(SkipList)实现,主要是在 读写性能、实现复杂度和范围查询 之间找了个好平衡。

    1)跳表在平均情况下,插入、删除、查找都是 O(logn),虽然最坏情况可能退化一点,但随机层数设计让它大概率保

    持均衡,不像红黑树那样需要频繁旋转维持平衡。你想想,每次插入都要左旋右旋,写放大严重,对 Redis 这种高并

    发场景来说,脏活累活越少越好。

    2)范围查询是硬需求,比如 ZRANGEBYSCORE 。跳表天然支持双向链表+多层索引,指针直接串着,遍历效率高。

    红黑树做中序遍历也可以,但得靠额外数据结构辅助,代码复杂。B+树倒是擅长范围扫描,但它是为磁盘 IO 设计的,

    一个节点对应一⻚,内存里用反而有额外指针开销,没必要。

    3)跳表代码实现简单,调试容易。Redis 强调稳定和可维护,不用搞复杂的树平衡逻辑,开发成本低。而且实测性能

    不输红黑树,甚至在并发插入时表现更好。

    你看这个结构,一层层往下筛,查得快,删增也方便,指针一改就行。Redis 要的就是这种“够快、够稳、别太复

    杂”的方案。'
