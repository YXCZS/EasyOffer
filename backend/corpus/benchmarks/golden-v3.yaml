  reference_answer: '根据 AI 大模型原理和应用面试题速记通关版; page 31：

    向量数据库中的 HNSW 、LSH、PQ 分别是什么意思?

    HNSW 、LSH、PQ 是向量数据库里常用的 近似最近邻搜索(ANN)技术,用来在高维空间快速找相似向量,毕竟暴力

    遍历 O(n) 在亿级数据上根本扛不住。

    1)HNSW (HierarchicalNavigableSmallWorld)本质是个多层图结构。每一层都是个近邻图,高层稀疏用

    来“跳”得快,底层密集做精细搜索。查询时从顶层开始往下走,像导航一样逐步逼近目标点。Milvus、Weaviate 都

    用它,召回率高,延迟也稳,但建索引内存开销大。

    2)LSH(Locality-SensitiveHashing)思路更粗暴:把相似的向量通过特定哈希函数尽可能甩到同一个桶里。查的时

    候只搜对应桶,大幅缩小范围。优点是实现简单、存储省,但召回率不如 HNSW ,尤其分布不均时容易漏。早期

    Annoy 用过类似思想。

    3)PQ(ProductQuantization)干的是降维压缩的脏活。它把高维向量切成几段,每段独立聚类,用聚类中心代替

    原始向量分量,存个码本就行。原来 128 维 float 能压到 16 字节内,检索时用对称距离近似算相似度。Faiss 就拿它和

    IVF 搭配,扛住了十亿级向量库。

    这仨经常混着用,比如 Faiss 里 IVFPQ 就是先用聚类定位候选集,再 PQ 压缩算距。选哪个看场景:要精度选

    HNSW ,要省资源可以试 LSH + PQ 组合。'
