- query_id: g-031
  scenario_type: stable_technical
  topic: Java 集合
  query: 'Java 集合: 为什么 Java 中 HashMap 的默认负载因子是 0.75?'
  role: backend
  difficulty: medium
  expected_technologies:
  - Java 集合
  relevance:
    1c630a182c44879c8382ae6e92d4b35670683cfc34125685828469632521eea6: 2
  expected_knowledge_points:
  - Java 集合
  - 为什么 Java 中 HashMap 的默认负载因子是 0.75
  reference_answer: '根据 Java 集合面试题速记通关版; page 12：

    为什么 Java 中 HashMap 的默认负载因子是 0.75?

    负载因子(loadfactor)决定了 HashMap 什么时候扩容。默认值 0.75 是空间和时间成本之间的一个权衡结果。

    1)如果负载因子太小,比如 0.5,那数组还没装满就触发扩容,内存利用率低,但冲突少,查找快。

    2)如果负载因子太大,比如 0.9,内存用得更满,但哈希冲突概率显著上升,链表变长,查找性能下降。

    HashMap 的设计目标是在平均情况下实现 O(1) 的存取效率。0.75 这个值能让哈希桶的填充程度适中,在不浪费太多

    空间的前提下,把冲突控制在可接受范围。

    JDK 源码注释里也提过,基于泊松分布统计,当负载因子为 0.75 时,一个桶里链长度超过 8 的概率极低,这和红黑树

    转换阈值的设计也能对上。

    代码上看,初始化时如果不指定,就是 0.75:

    publicHashMap() {

    this.loadFactor = 0.75f;

    }

    实际开发中,如果你知道数据量会很大且稳定,可以提前算好容量,避免频繁 rehash。比如要存 1000 个元素,按

    0.75 算,初始容量至少设成 1000 / 0.75 ≈ 1333 ,再向上取最接近的 2 的幂,也就是 2048。'
