  - ZooKeeper 的默认端口是什么?各个端口分别有什么作用
  reference_answer: '根据 ZooKeeper 面试题速记通关版; page 6：

    ZooKeeper 的默认端口是什么?各个端口分别有什么作用?

    ZooKeeper 的默认端口是 2181,这是客户端连接集群的主要入口。但一个完整的 ZooKeeper 节点实际会监听多个端

    口,各自承担不同职责。

    2181 是客户端通信端口,应用通过它读写数据。比如用 Curator 或原生 API 连接 zk.connect("localhost:2181"),走

    的就是这个端口。

    如果搭建的是集群,还会用到另外两个端口。3888 用于 Leader 选举,当集群启动或主节点宕机时,节点间通过这个

    端口协商选出新的 Leader。它不对外暴露,只在内部成员之间通信。

    另一个是 2888,作用是 数据同步和心跳。一旦 Leader 产生,Follower 就通过这个端口与 Leader 保持连接,接收事

    务日志(如创建节点、设置值),保证数据一致性。

    这三个端口配合起来,构成了 ZooKeeper 的运行基础。生产环境部署时,防火墙必须放行这三组端口,否则可能出现

    脑裂或节点无法加入集群的问题。

    举个例子,用 Docker 部署 zk 集群时,不仅要映射 2181,还得把 2888 和 3888 做好端口绑定,否则容器间选主失

    败。'
