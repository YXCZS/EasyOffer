  relevance:
    13ce9dc68b41cbeaab7ad523d9c6a08c4d8ec4ba958687446effb991412da46c: 2
  expected_knowledge_points:
  - RabbitMQ
  - RabbitMQ 如何与其他消息队列(如 Kafka)进行对比?它们适用的场景有哪些
  reference_answer: '根据 RabbitMQ 面试题速记通关版; page 12：

    RabbitMQ 如何与其他消息队列(如 Kafka)进行对比?它们适用的场景有哪些?

    RabbitMQ 和 Kafka 看起来都是发消息的中间件,但设计目标差得挺远。一个偏向传统企业级消息传递,另一个是为

    高吞吐流式数据准备的。

    RabbitMQ 基于 AMQP 协议,用 Erlang 写的,天生适合做复杂路由。比如订单系统要通知库存、物流、积分多个服

    务,每个可能还要按规则过滤,这时候用它的 exchange + binding 机制就很顺手。它支持多种交换机类型:direct、

    topic、fanout、headers,灵活得很。不过吞吐量一般,单机几万 TPS 就顶天了。

    Kafka 完全是另一个路子。它不搞复杂路由,所有消息按 topic 分区追加到日志文件里,顺序写磁盘+ mmap 读取,

    单机轻松扛住几十万甚至上百万条/秒。它适合日志收集、用户行为追踪这类场景,比如用 Flink 实时分析用户点击

    流,数据从 Kafka 进去再出去。

    1)RabbitMQ 更适合业务解耦、任务异步处理,像电商下单后发短信、生成优惠券这种。 2)Kafka 专注大数据管道

    和流处理,常见于 ELK 日志链路、实时数仓,跟 Spark、Flink 配合多。 3)RabbitMQ 消息确认机制强,支持事务

    (虽然很少用),能保证不丢消息;Kafka 依赖消费者自己管理 offset,控制粒度更细但容易误操作。

    代码上差别也明显:

    // RabbitMQ 发送

    channel.basicPublish("orders", "new", null, msg.getBytes());

    // Kafka 发送

    producer.send(newProducerRecord<>("user-behavior", userId, event));

    要不要持久化、要不要ACK ,两边配置逻辑完全不同。'
