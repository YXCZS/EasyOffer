- query_id: g-047
  scenario_type: stable_technical
  topic: Nginx
  query: 'Nginx: 如何在 Nginx 中处理 WebSocket 连接?需要哪些配置?'
  role: backend
  difficulty: medium
  expected_technologies:
  - Nginx
  relevance:
    122bb9e0bc6de8fb538212eb38607ee8420d0f8db5ec8fcb679d88dec84e0e17: 2
  expected_knowledge_points:
  - Nginx
  - 如何在 Nginx 中处理 WebSocket 连接?需要哪些配置
  reference_answer: '根据 Nginx 面试题速记通关版; page 62：

    如何在 Nginx 中处理 WebSocket 连接?需要哪些配置?

    WebSocket 和 HTTP 不一样,它是个长连接,需要持续通信。Nginx 默认会超时关闭空闲连接,所以处理 WebSocket

    时得手动调整几个关键配置,不然连接很快就被断了。

    1)必须设置 Upgrade 和 Connection 头

    Nginx 要识别客户端发来的是 WebSocket 协议升级请求,就得透传 Upgrade 和 Connection 这两个头。否则

    Nginx 当普通 HTTP 处理,后续的握手就失败了。

    location /ws/ {

    proxy_passhttp://backend;

    proxy_http_version1.1;

    proxy_set_headerUpgrade $http_upgrade;

    proxy_set_headerConnection "upgrade";

    }

    2)调整超时时间

    默认 60 秒不活动,Nginx 就会关掉连接。但 WebSocket 往往长时间挂在那里等消息。所以要延长读写超时。

    proxy_read_timeout86400s; # 保持连接 1 天

    proxy_send_timeout86400s;

    3)负载均衡要考虑会话保持

    如果你用多个后端服务,同一个用户的 WebSocket 连接得打到同一台机器上。可以用 IPhash 或 key-hash 的方式做

    stickysession,避免状态分散。

    upstreambackend {

    ip_hash;

    server192.168.0.10:8080;

    server192.168.0.11:8080;

    }

    其实整个过程就是:客户端发 Upgrade 请求 → Nginx 透传头并转发 → 后端服务响应 101SwitchingProtocols → 连

    接升级为 WebSocket 长连接。只要中间不丢头、不超时,就能稳住。'
