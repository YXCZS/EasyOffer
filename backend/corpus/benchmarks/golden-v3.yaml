  - 消息队列
  - 消息队列设计成推消息还是拉消息?推拉模式的优缺点
  reference_answer: '根据 消息队列面试题速记通关版; page 13：

    消息队列设计成推消息还是拉消息?推拉模式的优缺点?

    消息队列到底是推还是拉,其实没有标准答案,关键看场景和设计目标。

    1)推模式(Push)是服务端主动把消息发给消费者。好处是实时性好,消息一到就能立刻推下去,像 Kafka 的

    consumerpull 其实底层用了长轮询模拟 push。但问题也很明显,如果消费者处理能力跟不上,容易被压垮,系统搞

    不定。

    2)拉模式(Pull)是消费者自己来取消息。灵活性高,消费者可以按自己的节奏消费,比如 RocketMQ 就是典型的

    pull 模式。但缺点是可能有延迟,得靠轮询,太频繁浪费资源,间隔太久又不及时。

    3)所以很多系统走混合路线。Kafka 看起来是 pull,但通过参数控制每次拉取数量和等待时间,做到“准实时”。而

    RabbitMQ 在 direct 等交换器下更像是 push,配合 QoS 限流,避免消费者过载。

    真正的核心在于流量控制和负载均衡。push 容易造成雪崩,pull 可能增加 broker 查询压力。选择时得看吞吐要求、

    消费稳定性、网络开销这些维度。

    举个例子,日志收集这种高吞吐场景用 pull 更稳;而订单状态通知这类强实时需求,适合可控的 push + 限流组合。

    最终选哪种,不是技术决定,而是业务说了算。'
