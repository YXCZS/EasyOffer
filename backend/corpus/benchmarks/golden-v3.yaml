  reference_answer: '根据 Spring 面试题速记通关版; page 45：

    说说 Spring 启动过程?

    Spring 启动过程本质是 IoC 容器的初始化和刷新,核心入口在 refresh() 方法,整个流程大概有 12 个关键步骤。

    准备上下文环境时,先设置好环境变量、系统属性,校验必要的配置是否齐全。接着创建 BeanFactory,这一步会读

    取所有 <bean> 定义或 @Component 注解类,把元信息注册进去,但此时 bean 并没有被实例化。

    BeanFactory 创建完后,开始加载各种扩展点,比如 BeanPostProcessor 和 ApplicationListener 。这些扩

    展允许你在 bean 实例化前后插入逻辑,比如 AOP 就是在这里织入代理。

    真正的单例 bean 实例化发生在 finishBeanFactoryInitialization 这一步。容器会遍历所有非懒加载的单例

    bean,触发它们的构造、依赖注入、初始化方法(如 @PostConstruct )。循环依赖的解决就发生在这个阶段,

    Spring 用三级缓存提前暴露刚实例化但未初始化完的对象。

    最后一步是发布 ContextRefreshedEvent,通知所有监听器上下文已就绪。像 Tomcat 嵌入式容器也是这时候启动,

    对外提供服务。

    代码入口基本都集中在 AbstractApplicationContext 的 refresh() 方法里:

    publicvoidrefresh() {

    prepareRefresh();

    ConfigurableListableBeanFactorybeanFactory = obtainFreshBeanFactory();

    prepareBeanFactory(beanFactory);

    postProcessBeanFactory(beanFactory);

    invokeBeanFactoryPostProcessors(beanFactory);

    postProcessBeanFactory(beanFactory);

    invokeBeanFactoryPostProcessors(beanFactory);

    registerBeanPostProcessors(beanFactory);

    initMessageSource();

    initApplicationEventMulticaster();

    onRefresh(); // 如 Web 容器启动

    registerListeners();

    finishBeanFactoryInitialization(beanFactory);

    finishRefresh();

    }

    整个过程最关键是 BeanFactory 准备、扩展注册、bean 实例化、事件发布 四个阶段。如果某个 bean 初始化失败,

    比如数据库连不上,容器启动就会直接卡住,应用也就搞不定了。

