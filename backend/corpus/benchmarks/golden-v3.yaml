    里,扩容后还是冲突,这时候链表长度才会持续增长。

    代码上你不需要感知这个过程,HashMap 内部自动切换。但如果你的 key 没有合理实现 hashCode(),比如总返回

    1,那所有元素都挤在一个桶,性能立马崩成 O(n)。'
