  relevance:
    126ba8d8b587c7505157105fb66ce03843da777a7db317e3c0e9b7df66056e5d: 2
  expected_knowledge_points:
  - SpringCloud
  - 分布式和微服务有什么区别
  reference_answer: '根据 SpringCloud 面试题速记通关版; page 29：

    分布式和微服务有什么区别?

    分布式和微服务听起来像一对双胞胎,其实它们关注的层面不一样。

    1) 分布式系统本质是把一个大应用拆到多台机器上跑,核心目标是解耦硬件依赖、提升可用性和性能。比如数据库主

    从分离、Redis 集群,都是典型的分布式场景。它解决的是“怎么让多个节点一起干活”的问题,不关心业务长啥样。

    2) 微服务则是业务架构的演进,把单体应用按业务域拆成一堆小服务,每个服务独立开发、部署、伸缩。像订单、支

    付、库存各是一个服务,用 SpringCloud 或 Dubbo 做通信。重点在“高内聚、低耦合”的业务组织方式。

    你可以理解为:微服务天生就是分布式的,但分布式不一定是微服务。比如一个老系统做了集群部署,但它还是单

    体,就不能叫微服务。

    举个例子,淘宝早期是单体 Java 应用,后来扛不住流量,就拆成了用户、商品、交易等上百个微服务,每个服务还能

    自己做分布式部署。这时候,微服务是拆法,分布式是实现手段。

    简单说,微服务决定“怎么拆业务”,分布式解决“怎么跑在多台机器上”。两者配合,才能撑住高并发、大流量的现

    代互联网应用。'
