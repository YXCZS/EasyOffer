  reference_answer: '根据 Java 基础面试题速记通关版; page 30：

    什么是 Java 内部类?它有什么作用?

    内部类就是定义在另一个类里面的类。它能直接访问外部类的所有成员,包括私有的,这种紧密的耦合关系在某些场

    景下特别有用。

    1)解决逻辑相关的类组织问题。比如 LinkedList 里的 Node ,作为链表的节点结构,天生属于 LinkedList

    的内部实现细节,用内部类封装就很自然。

    2)实现事件监听、回调等机制时更方便。像 AWT/Swing 的事件处理,监听器作为内部类可以直接拿到外部界面组件

    的状态,不用到处传引用。

    3)替代函数式接口或简化匿名类写法。虽然现在有 Lambda,但在需要维护状态的回调里,局部内部类还是更灵活。

    匿名内部类在创建线程或注册监听时很常见:

    newThread(newRunnable() {

    publicvoidrun() {

    System.out.println(" 来自内部类的线程 ");

    }

    }).start();

    注意内存泄漏风险。非静态内部类会隐式持有外部类引用,如果它的实例生命周期比外部类长(比如被缓存了),就会

    导致外部类无法回收。Android 开发里经常踩这个坑。

    静态嵌套类没有这个问题,它和普通类差不多,只是命名空间被包装了一下:

    publicclassOuter {

    staticclassNested { } // 不依赖外部类实例

    }

    内部类最终会被编译成独立的 .class 文件,比如 Outer$Inner.class ,JVM 其实并不认识“内部类”这个概

    念,全是靠编译器生成代码和桥接方法实现的。'
