  reference_answer: '根据 Nginx 面试题速记通关版; page 23：

    Nginx 配置文件 nginx.conf 中的属性模块有哪些?

    Nginx 的配置文件结构其实是个树形嵌套模型,核心是通过作用域把指令分门别类。这些“模块”不是独立组件,而

    是配置块(block),每个块控制特定场景下的行为。

    1)main 全局块

    这是最外层,管的是 worker 进程数、日志路径、运行用户这类全局设置。比如 worker_processesauto; 就在

    这里,决定启动几个工作进程。

    2)events 块

    控制连接处理模型,比如用 epoll 还是 select,单个进程能打开的最大连接数 worker_connections1024; 。这

    直接影响并发能力。

    3)http 块

    这是重点,几乎所有 Web 服务配置都在这。它包含 MIME 类型定义、默认编码、日志格式,还能嵌套多个 server 块。

    像静态资源、反向代理、Gzip 都在这配。

    4)server 块

    代表一个虚拟主机,可以基于域名或 IP 端口区分。比如你部署了 api.example.com 和 www.example.com ,就用两

    个 server 块做路由隔离。

    5)location 块

    在 server 内部,按 URI 路径匹配请求。比如 /static/ 走静态文件,/api/ 转发给后端 SpringBoot 服务,用

    proxy_passhttp://localhost:8080; 实现。

    6)upstream 块(常配合 http 使用)

    定义后端服务器组,实现负载均衡。比如把请求分到 3 台 Tomcat,用轮询或加权方式。

    搞不定配置顺序?记住:全局 → 事件模型 → HTTP 框架 → 虚拟主机 → 路径规则,层层细化。'
