  - 什么是 SpringActuator?它有什么优势
  reference_answer: '根据 SpringBoot 面试题速记通关版; page 9：

    什么是 SpringActuator?它有什么优势?

    SpringActuator 是 SpringBoot 项目里的一个模块,它给应用加了一层监控和管理能力。你不用改业务代码,只要引

    入 starter,就能通过 HTTP 或 JMX 暴露一些预定义的端点(endpoints),比如查看健康状态、内存使用、线程堆

    栈、请求指标等。

    这些端点能帮你快速定位生产问题。比如服务挂了,调用 /actuator/health 一看就知道是数据库连不上还是

    Redis 超时。再比如流量突增,用 /actuator/metrics/jvm.memory.used 结合 Grafana 能看出内存是不是在缓

    慢上涨。

    1)暴露的端点默认有安全限制,生产上必须配合认证开启,避免信息泄露

    2)可以自定义端点,比如加个 /actuator/feature-toggle 来动态开关功能

    3)和 Micrometer 集成后,能把指标推送到 Prometheus,实现全链路监控

    代码上就两步:加依赖,开端点。

    <dependency>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-starter-actuator</artifactId>

    </dependency>

    management:

    endpoints:

    web:

    exposure:

    include: health,info,metrics

    其实它的价值不在功能多炫,而是统一了微服务的观测入口。你在用 SpringCloudGateway 还是 Eureka,所有服务

    的健康检查、指标格式都是一致的,运维脚本和告警规则能复用,省掉一堆脏活累活。'
