- query_id: g-063
  scenario_type: stable_technical
  topic: Spring
  query: 'Spring: Spring 中的 @SessionAttribute 注解的作用是什么?'
  role: backend
  difficulty: medium
  expected_technologies:
  - Spring
  relevance:
    0553000fc615ba0e1dd49549ca8d3dc84ecc5892c5d94a45dd874c55db173e62: 2
  expected_knowledge_points:
  - Spring
  - Spring 中的 @SessionAttribute 注解的作用是什么
  reference_answer: '根据 Spring 面试题速记通关版; page 16：

    Spring 中的 @SessionAttribute 注解的作用是什么?

    用来从当前 HTTP 会话中获取已存在的属性,通常用于处理用户登录状态或跨请求共享数据。它不是创建 session 属

    性的注解,而是假设 session 中已经有对应值,直接拿来用。

    如果 session 中没有找到对应属性,默认会抛出异常,除非设置 required = false 。这和

    @RequestAttribute 类似,都是“取已有”的逻辑,而不是“存”或“创建”。

    常见于需要强依赖登录用户信息的场景,比如管理员后台接口,要求用户必须已登录且 session 中有 user 对象。

    @GetMapping("/profile")

    publicStringgetProfile(@SessionAttribute("user") Useruser, Modelmodel) {

    model.addAttribute("user", user);

    return "profile";

    }

    1)只能获取已经存在于 session 中的属性,不会自动创建

    2)适用于前后端不分离的传统 MVC 场景,比如 Thymeleaf ⻚面渲染

    3)在 SpringSecurity 集成时,常配合认证后的用户信息提取使用

    现代 Web 应用越来越多采用无状态设计,像 JWT 这类方案让服务端不再维护 session,这种情况下

    @SessionAttribute 用得越来越少。但在一些内部系统、企业应用里,基于 session 的认证还是主流,这时候它

    依然是个简单可靠的工具。'
