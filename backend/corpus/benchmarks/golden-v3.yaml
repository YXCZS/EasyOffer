  reference_answer: '根据 MyBatis 面试题速记通关版; page 11：

    能详细说说 MyBatis 的执行流程吗?

    MyBatis 的执行流程,从发起一次 SQL 查询说起。你调用 Mapper 接口方法那一刻,其实背后走了一整套拦截、解

    析、执行的机制。

    1)首先,Mapper 接口并不是实现类,而是通过动态代理生成的代理对象。每次你调

    userMapper.selectById(1) ,代理就会根据方法名和参数,找到对应的 SQL 语句。

    2)接下来进入 SqlSession,它负责统筹全局。SqlSession 会拿着MappedStatement(封装了SQL和配置)去执行查

    询。如果开启了二级缓存,先查二级缓存;没有就往下走。

    3)然后到 Executor,这是执行引擎的核心。它先查一级缓存(基于 SqlSession 的本地缓存),命中直接返回。没命

    中就创建 StatementHandler。

    4)StatementHandler 负责处理 JDBC 的 Statement,做 SQL 拼接、参数映射。ParameterHandler 把你的入参按规

    则塞进预编译 SQL 里,比如 ? 替换成实际值。

    5)接着交给 JDBC 执行,ResultSet 返回后,ResultSetHandler 开始工作。它通过反射和类型处理器 TypeHandler,

    把数据库字段映射成 Java 对象。

    6)结果出来后,写入一级缓存,如果有二级缓存且配置了,则在事务提交时刷入二级缓存。

    整个过程链路清晰,组件各司其职。比如一级缓存默认开启,作用域是同一个 SqlSession;二级缓存需要手动开启,

    跨 SqlSession 共享,但要注意并发问题。'
