  reference_answer: '根据 Java 热门面试题 200 道速记通关版; page 15：

    MyBatis 中 #{} 和 ${} 的区别是什么?

    #{} 和 ${} 看似都是占位,但处理时机完全不同。

    #{} 是预编译参数占位符,MyBatis 会把 SQL 中的 #{} 替换成 ? ,然后通过 PreparedStatement 的 set

    方法赋值。这个过程能有效防止 SQL 注入,因为参数内容不会参与 SQL 解析。比如:

    <selectid="getUser" resultType="User">

    SELECT * FROMuserWHEREid = #{id}

    </select>

    最终执行的是 SELECT * FROMuserWHEREid = ? ,安全又高效。

    ${} 是字符串拼接,直接把变量值原样插入到 SQL 中,不经过预编译。这意味着如果传入恶意内容,就可能被当作

    SQL 执行。比如:

    ORDERBY ${columnName}

    这里 ${columnName} 如果是 id; DROPTABLEuser ,那后果就严重了。所以 ${} 只能在无法使用预编译的

    场景下用,比如动态表名、动态排序字段,而且必须确保输入可控。

    一般情况下,能用 #{} 就别碰 ${} 。非要用 ${} ,得自己做白名单校验,不能让用户随便输。

    1)#{} 走预编译,安全,性能好

    2)${} 是拼接,有注入风险,慎用

    3)${} 适用场景:动态表名、动态排序、动态 in 条件(需转义)'
