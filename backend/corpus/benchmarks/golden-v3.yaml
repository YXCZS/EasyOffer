  reference_answer: '根据 计算机网络面试题速记通关版; page 13：

    TCP 协议是如何保证可靠传输的?

    TCP 保证可靠传输不是靠单一机制,而是几个关键设计组合起来的结果。连接建立、数据排序、确认应答、超时重

    传、流量控制和拥塞控制这几点缺一不可。

    1)三次握手建立连接,确保双方收发能力正常。客户端和服务端各自初始化序列号(ISN),后续数据包都带 Seq 和

    Ack 号,实现有序传输和双向确认。

    2)每个发送的数据段都有序列号,接收方按序提交给应用层。如果收到乱序包,会暂存但重复发送上一个确认号的

    ACK,触发快重传。

    3)发送方启动定时器等待 ACK,一旦超时就重发。同时通过滑动窗口做流量控制,接收方通告自己的接收能力,防止

    缓冲区溢出。

    4)拥塞控制动态调整发送速率。慢启动阶段指数增长,到阈值后线性增长。一旦丢包,认为网络拥塞,cwnd 直接减

    半进入拥塞避免。

    代码上看,应用层调用 socket.send() 后,内核负责分段、加 TCP 头、维护发送队列。只有收到 ACK 才删除对应

    数据。丢包重试对应用透明。

    整个过程里,序列号、确认机制和重传策略是可靠传输的三大支柱。没有这些,像 HTTP、MySQL 这类依赖稳定连接

    的应用根本搞不定。'
