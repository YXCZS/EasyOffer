  reference_answer: '根据 计算机网络面试题速记通关版; page 19：

    HTTP 和 HTTPS 有什么区别?

    HTTP 和 HTTPS 的本质区别在于安全性,HTTPS 不是新的协议,而是 HTTP 跑在 SSL/TLS 之上。

    1)通信内容加密

    HTTP 明文传输,中间人能直接看到请求和响应内容。HTTPS 在 TCP 握手后、HTTP 通信前,先通过 SSL/TLS 协议协

    商密钥,后续数据都用对称加密传输。比如浏览器访问支付宝,账号密码要是走 HTTP,网络里的路由器都能看见。

    2)身份认证

    HTTPS 需要证书来证明“你真的是你”。服务端把数字证书发给客户端,客户端通过 CA(比如 Let''sEncrypt、

    DigiCert)验证证书合法性。没有这一步,钓⻥网站随便仿个淘宝⻚面就搞定了。

    3)防篡改

    TLS 会对数据做完整性校验,用 MAC(消息认证码)机制。哪怕中间有人改了一个字节,接收方解密时就会发现校验

    失败,直接断开。

    性能上,HTTPS 多了握手过程,首次建立连接要多花 1-2 个 RTT。但现代 TLS1.3 已优化到 1-RTT 甚至 0-RTT,加上

    CDN 普遍支持,实际差距很小。主流站点像 Google、淘宝、微信支付全默认 HTTPS。

    代码层面,Java 里用 HttpsURLConnection 替代 HttpURLConnection ,关键是要信任的证书库。Netty 或

    SpringWebFlux 中配置 SSLContext 即可启用。

    现在没有理由再用纯 HTTP,搜索引擎也优先收录 HTTPS 站点。小项目可以用 Nginx + 免费证书快速上 HTTPS。'
