  - Redis 中常见的数据类型有哪些
  reference_answer: '根据 Redis 面试题速记通关版; page 2：

    Redis 中常见的数据类型有哪些?

    Redis 支持几种核心数据结构,每种都有明确的使用场景。

    字符串(String)是最基础的类型,能存文本、序列化对象,也常用来做计数器。比如用 INCR 实现接口调用次数统

    计,简单高效。

    列表(List)底层是双向链表,支持从头尾插入删除,适合做消息队列。但随机访问慢,一般不推荐当数组用。

    LPOP/RPOP 配合 LPUSH/RPUSH 能实现简单的生产消费模型。

    集合(Set)是无序不重复的字符串集合,底层用哈希表实现,所以增删查都是 O(1)。可以用在用户标签管理、社交关

    系去重这些需要快速判断成员存在的场景。

    有序集合(SortedSet)在 Set 基础上加了 score 排序,比如排行榜类需求,ZADD 加数据,ZRANGE 按排名取,性能

    很好。score 可重复,member 才是唯一键。

    哈希(Hash)适合存储对象字段,比如用户信息,field 对应属性名,value 存值。相比直接序列化整个对象,可以单

    独更新某个 field,省带宽也省内存。

    这五种是日常最常用的,像 Stream 、Geo、Bitmap 这些属于特定场景扩展类型,用得相对少一些。'
