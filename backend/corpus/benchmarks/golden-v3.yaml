- query_id: g-062
  scenario_type: stable_technical
  topic: Spring
  query: 'Spring: SpringBean 注册到容器有哪些方式?'
  role: backend
  difficulty: medium
  expected_technologies:
  - Spring
  relevance:
    049c11c4266bb972731cfa3fc2b8d7a25cd3068a55cb87f744859d73c99eb305: 2
  expected_knowledge_points:
  - Spring
  - SpringBean 注册到容器有哪些方式
  reference_answer: '根据 Spring 面试题速记通关版; page 44：

    SpringBean 注册到容器有哪些方式?

    Spring 把 Bean 放进容器,其实不光是写个 @ Component 就完事了,方式挺多的,得看场景。

    1)最常见的是注解驱动,比如用 @ Component、@ Service 这些,配合 @ ComponentScan 扫描自动注册。这是现

    在最主流的方式,启动时扫描指定包,找到注解标记的类就注册成 Bean 定义。

    2)XML 配置虽然老派,但有些老项目还在用。在 applicationContext.xml 里写 <beanclass="com.example.User"/>
    ,容器启动时解析 XML 就把 Bean 定义加载进去了。

    3)编程式注册也很关键,比如你在配置类里写:

    @ConfigurationpublicclassMyConfig {

    @BeanpublicUseruser() {

    returnnewUser();

    }

    }

    这个方法返回的对象会被注册为单例 Bean。

    4)还有一种是直接操作 API,比如通过 ApplicationContext 的子接口 BeanDefinitionRegistry 手动注册

    Bean 定义。像一些中间件,比如 Feign,就是在启动时动态生成代理类,然后手动注册进去。

    5)最后别忘了条件注册,用 @ Conditional 注解控制是否注册,SpringBoot 的自动装配全靠它撑着。

    这些方式最终都指向一个目标:让 BeanDefinition 被加载到 BeanFactory 里。容器启动时读取这些定义,后面才好实

    例化、依赖注入。

    要不要画个流程?从配置类/组件扫描到 BeanDefinitionRegistry 的过程可以可视化一下。'
  reference_context_ids:
  - 049c11c4266bb972731cfa3fc2b8d7a25cd3068a55cb87f744859d73c99eb305
