  reference_answer: '根据 Java 并发面试题速记通关版; page 21：

    什么是 Java 的 StampedLock?

    StampedLock 是 Java8 引入的一种高性能读写锁,用来替代传统的 ReentrantReadWriteLock。它最大的特点是支

    持乐观读,这在读多写少的场景下能显著提升吞吐量。

    ReentrantReadWriteLock 在高并发读时,一旦有线程持有写锁,所有读线程都会被阻塞。而 StampedLock 的乐观读

    模式允许读操作“无锁”进行,只要数据没被修改就直接返回结果。

    使用时需要获取一个 long 类型的 stamp,这个 stamp 代表了锁的状态版本。写操作会改变 stamp,读操作通过校验

    stamp 是否被修改来判断数据一致性。

    1) 获取乐观读 stamp:longstamp = lock.tryOptimisticRead(); 2) 执行读逻辑后,必须用

    lock.validate(stamp) 校验是否失效 3) 如果校验失败,降级为悲观读:stamp = lock.readLock()

    写锁的获取和释放跟传统方式类似,但写锁不能重入,否则会死锁。这点要特别注意,业务代码里如果嵌套调用容易

    搞不定。

    典型适用场景比如缓存容器、配置中心本地快照,像 Nacos 客户端就用它来保护服务实例列表的读写。压根不经过内

    核态切换,完全是用户态的 CAS 操作,性能扛得住几千上万 QPS 的读。

    不过 API 设计较反人类,try 和 release 必须配对,且 stamp 失效后要手动重试,得包一层工具方法才好用。'
