  reference_answer: '根据 消息队列面试题速记通关版; page 6：

    说说 RabbitMQ 的工作模式?

    RabbitMQ 的工作模式本质上是消息从生产者到消费者之间的流转方式,不同的交换机类型决定了路由规则。

    1)最简单的是直连模式,用 DirectExchange ,消息的 routingkey 必须和队列绑定的 key 完全匹配。比如订单

    服务发消息到 order.create ,消费端只绑这个 key 就能收到。

    2)发布订阅模式用 FanoutExchange ,它会把消息广播给所有绑定的队列,不看 routingkey。像日志收集场

    景,多个系统都需要一份日志,就可以用这个模式。

    3)主题模式使用 TopicExchange ,支持通配符匹配 routingkey。比如 logs.user.create 和

    logs.order.update 都能被 logs.*.create 或 logs.# 这样的 bindingkey 捕获。Kafka 里类似的逻辑得自

    己做分发,而 RabbitMQ 原生支持。

    4)还有个 HeadersExchange ,按键值对匹配,基本没人用,性能差,实用性低。

    重点是交换机和队列的绑定关系由消费者决定,不是生产者。生产者只管发给哪个 exchange,后面怎么路由是

    Broker 根据绑定规则处理的。

    实际用得最多的是 direct 和 topic。SpringBoot 里配个 @RabbitListener(queues = "xxx") 就自动完成队列

    声明和绑定,底层其实靠的是 AMQP 协议在维持这套模型。'
