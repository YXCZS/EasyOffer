  expected_technologies:
  - Java 集合
  relevance:
    2ebe0b4a33775e4c0c32606634bb9032b43bf9d4ce5f92323d8d2b6321f80ae4: 2
  expected_knowledge_points:
  - Java 集合
  - Java 中 ConcurrentHashMap1.7 和 1.8 之间有哪些区别
  reference_answer: '根据 Java 集合面试题速记通关版; page 9：

    Java 中 ConcurrentHashMap1.7 和 1.8 之间有哪些区别?

    ConcurrentHashMap 的演进其实是个典型的“从锁竞争到 CAS + synchronized 优化”的过程,1.7 到 1.8 的改动几

    乎是重写级别。

    1.7 用的是分段锁 Segment,每个 Segment 是一个 ReentrantLock 保护的小哈希表。默认 16 个 Segment,意味着

    最多 16 个线程能并发写。一旦线程数超过这个数,后面的就只能阻塞等待锁。Segment 继承自 ReentrantLock,结

    构复杂,内存占用也高。

    到了 1.8,直接抛弃了 Segment,改用 CAS + synchronized 控制并发。Node 数组加链表/红黑树,写操作对数组桶

    位加 synchronized 锁,粒度更细。读操作完全无锁,靠 volatile 保证可见性。扩容时还能支持并发迁移,由多个线程

    一起搬数据。

    另一个关键变化是哈希冲突的处理。1.7 是纯链表,容易在极端情况下退化成 O(n)。1.8 引入了链表转红黑树机制,当

    链表长度超过 8 且数组长度大于 64,就转换成红黑树,查找性能从 O(n) 提升到 O(logn),抗攻击能力更强。

    扩容效率也提升了。1.8 用了“多线程协助扩容”机制,一个线程发现需要扩容,可以只负责搬一部分桶,其他线程写

    数据时也会顺手帮忙搬,真正做到并发扩容。'
