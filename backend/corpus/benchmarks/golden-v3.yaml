  query: '操作系统: 同步和异步的区别?'
  role: backend
  difficulty: medium
  expected_technologies:
  - 操作系统
  relevance:
    1d58b55c87edeb0c8bcd940ff3ba016b89acda304f8cda0a63a7894a6c63559e: 2
  expected_knowledge_points:
  - 操作系统
  - 同步和异步的区别
  reference_answer: '根据 操作系统面试题速记通关版; page 14：

    同步和异步的区别?

    同步和异步的差别,关键看调用方要不要等结果。

    1)同步操作里,线程发起一个调用后就卡着不动,得一直等到对方返回结果才能继续往下走。比如你去餐厅点餐,服

    务员站在你桌边等着厨房出菜,这期间他啥也不干,这就是典型的同步阻塞。Java 里的 Thread.join() 就是这

    样,主线程得等子线程执行完才能继续。

    2)异步操作完全不一样,调用一发出,当前线程立马就能干别的事,不用傻等。等被调用方处理完了,会通过回调、

    事件通知或者 Future 的方式告诉你结果。像发个短信说“饭好了”,你收到再过去拿,中间时间全利用起来了。

    CompletableFuture.supplyAsync() 就是这种模式,任务扔进线程池就不管了,后面用 .thenApply 处理结

    果。

    实际场景中,数据库连接池 HikariCP 在获取连接时可以选择同步等待,而像消息队列 RabbitMQ 的消费者则是异步接

    收消息,靠监听器触发处理逻辑。

    系统吞吐量上,异步天然适合高并发场景。Tomcat 的 NIO 模式就是把请求转成事件注册到 selector,一个线程能扛

    住几千连接,压根不经过阻塞等待那套流程。

    别把异步和多线程划等号,异步是一种编程模型,多线程只是实现手段之一。Node.js 单线程也能做异步 I/O,靠的是

    事件循环。'
