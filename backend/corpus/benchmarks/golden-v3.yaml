  expected_knowledge_points:
  - MyBatis
  - 使用 MyBatis 的 mapper 接口调用时有哪些要求
  reference_answer: '根据 MyBatis 面试题速记通关版; page 2：

    使用 MyBatis 的 mapper 接口调用时有哪些要求?

    接口方法名必须和 MapperXML 中的 statementid 一致,参数类型也要对应。比如 XML 里写的是

    selectUserById ,那接口方法就得叫 selectUserById ,不然找不到。

    1) 接口全限定名要和 XML 文件的 namespace 完全匹配。这是 MyBatis 绑定的依据,差一个字母都找不到。

    2) 方法的返回值类型得和 XML 里 resultType 或 resultMap 能映射上。如果数据库返回 3 个字段,但实体类没有无参

    构造或者属性不匹配,直接抛异常。

    3) 参数只能有一个,如果你有多个参数,得用 @Param 注解命名,否则 XML 里没法通过名字引用。比如 intupdateUser(@Param("id")
    Longid, @Param("name") Stringname) ,XML 才能用 #{id} 和 #

    {name} 。

    4) XML 文件必须和接口在同一个包下,且同名。SpringBoot 默认扫描 classpath*:/**/*.xml,但前提是路径对。

    Maven 还得注意别把 XML 过滤掉了。

    代码示例:

    publicinterfaceUserMapper {

    UserselectUserById(Longid);

    }

    对应 XML:

    <selectid="selectUserById" resultType="User">

    SELECT * FROMuserWHEREid = #{id}

    </select>

    实际项目里,像 MyBatis-Plus 就是靠动态代理 + 这套规则自动生成 SQL,你不用写 XML。但底层还是遵守这些约

    定。'
