  - ZooKeeper 中 ZNode 节点的 stat 结构体有哪些字段?其中 dataLength 的作用是什么
  reference_answer: '根据 ZooKeeper 面试题速记通关版; page 52：

    ZooKeeper 中 ZNode 节点的 stat 结构体有哪些字段?其中 dataLength 的作用是什么?

    ZooKeeper 里每个 ZNode 都自带一个叫 stat 的元数据结构,存的是这个节点的状态信息,一共 12 个字段。

    1)czxid :创建时的事务 ID,能判断节点创建顺序

    2)mzxid :最后一次修改的事务 ID3)ctime :创建时间戳(毫秒)

    4)mtime :最后修改时间

    5)version :节点数据的版本号,每次写操作加 16)cversion :子节点版本号,子节点增删改都触发变更

    7)aversion :ACL 版本,权限变更时递增

    8)ephemeralOwner :如果是临时节点,这里存会话的 SessionID9)dataLength :关键字段,记录当前节点存储的数据体长度,单位是字节

    10)numChildren :当前节点的直接子节点数量

    11)pzxid :子节点列表的事务 ID,子节点变动时更新

    12)ctime , mtime 等时间字段也参与事件监听和超时判断

    其中 dataLength 主要用来做监控和容量控制。比如你在用 ZooKeeper 做配置中心,像 Nacos 或 Dubbo 注册中

    心场景,如果某个节点存了大块数据,dataLength 超过几 KB 就得警惕。ZooKeeper 设计上不适合存大数据,官

    方建议单节点数据别超过 1MB,实际项目一般压到 1KB 以内,否则会影响集群性能和 GC。'
