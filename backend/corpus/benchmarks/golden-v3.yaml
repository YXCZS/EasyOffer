  reference_answer: '根据 Elasticsearch 面试题速记通关版; page 12：

    如何使用 ID 检索 Elasticsearch 中的文档?

    通过 ID 检索文档是 Elasticsearch 最直接的查询方式,走的是倒排索引的快速路径,性能极高。

    1)用 GET 请求访问指定索引下的 _doc 端点,带上 ID 即可。ES 会根据文档 ID 直接定位到所在的分片和底层存储

    位置,压根不经过全文检索流程。

    GET /users/_doc/123

    返回结果中 found: true 表示文档存在,_source 字段包含原始 JSON 数据。

    2)如果 ID 不存在,HTTP 状态码返回 404,响应体里 found: false 。你可以选择用 _source 参数控制是否返

    回源数据,或者用 _source_includes 做字段过滤。

    GET /users/_doc/123?_source_includes=name,age3)这种操作适合用户详情⻚、订单查询这类强依赖主键的场景。像 Kibana
    查看单条日志,背后也是用 ID 快速拉取。

    但别拿它当搜索用,模糊匹配得靠 queryDSL。

