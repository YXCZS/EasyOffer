  expected_technologies:
  - 操作系统
  relevance:
    2920d06038d7ea1fe421aa6390a444fbdf5ee5c2118eb535e053aa9f785f1d97: 2
  expected_knowledge_points:
  - 操作系统
  - 什么是 CPU 缓存一致性协议 MESI
  reference_answer: '根据 操作系统面试题速记通关版; page 1：

    什么是 CPU 缓存一致性协议 MESI?

    CPU 缓存一致性是多核编程里绕不开的底层机制。MESI 其实就是四个状态的缩写,用来保证多个 CPU 核心的缓存数

    据是一致的。

    每个缓存行(cacheline)在任意时刻处于以下四种状态之一:

    1)Modified:这行数据被当前核心修改过,和内存不一致,只有本核心有最新值。

    2)Exclusive:数据和内存一致,但只有当前核心在用,没人共享。

    3)Shared:多个核心都在读这个数据,大家缓存的值都一样。

    4)Invalid:这行缓存无效,不能直接用,得先去加载。

    当某个核心要写数据时,会触发总线嗅探(bussnooping),其他核心收到通知后检查自己的缓存,如果也有这行数

    据,就把它置为 Invalid。这样下次访问就得重新从内存或其它核心拉取最新值,避免脏读。

    比如你在 Java 里写 volatile 变量,背后就会触发 MESI 协议来确保可见性。虽然 volatile 不保证原子性,但它能强制

    刷新缓存,让修改立刻被其他核心看到。

    简单说,MESI 就靠这套状态机 + 总线广播,让多核之间的缓存看起来像是“同步”的。'
