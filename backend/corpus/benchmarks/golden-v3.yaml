  reference_answer: '根据 Java 热门面试题 200 道速记通关版; page 126：

    如何设计一个秒杀功能?

    秒杀本质是用技术手段把瞬时超大并发转化成系统能处理的量级,关键在于“削峰”和“前置”。

    1)流量层直接拦截无效请求。Nginx 用 Lua 做本地限流,同一用户每秒只放行 1 次请求,再多直接 503。Redis 集群

    预热商品库存,key 设成 seckill:stock:{itemId} ,值为原子整数,前端按钮灰化后仍可能被绕过,所以每扣

    减都必须走 DECR 并判断非负。

    2)异步化减少数据库冲击。用户中签后写 Kafka,消息消费端才真正落订单到 MySQL。这样数据库只扛住最终一致

    性写入,峰值写入从 10w+/s 降到几千/s,MySQL 配合分库分表就能扛住。

    3)缓存热点数据。商品详情、活动规则全放 Redis,⻚面静态化,CDN 托管前端资源。下单接口不做任何远程调用,

    所有校验在本地完成。

    4)避免超卖的核心是库存扣减原子性。Redis 扣库存 + 消息队列异步下单,两个动作必须绑定成一个逻辑单元。可以

    用 Lua 脚本保证原子性,脚本返回成功才发 MQ。

    压测要覆盖真实场景,比如用 JMeter 模拟 5w 并发抢 100 件商品。上线前做全链路压测,重点看 Redis 和 Kafka 的负

    载。一般系统按 3 倍冗余设计容量,但秒杀这种极端场景,前端拦截掉 90% 以上请求才是正解。'
