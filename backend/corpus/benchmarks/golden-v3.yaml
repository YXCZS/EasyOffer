  relevance:
    0fd996d3edc461fde87da35768d8b95e2706d34c72ba2e7887c88c5e27523203: 2
  expected_knowledge_points:
  - 计算机网络
  - TCP 和 UDP 有什么区别
  reference_answer: '根据 计算机网络面试题速记通关版; page 9：

    TCP 和 UDP 有什么区别?

    TCP 和 UDP 的本质区别在于,一个追求可靠交付,一个追求极致效率。

    TCP 会建立连接,通过三次握手确认双方收发能力没问题,数据包丢了会重传,顺序乱了会重新排序,保证你收到的

    数据和发送的一致。像 HTTP、数据库连接这些不能出错的场景都用它,背后是 可靠性 在撑腰。

    UDP 完全不握手,发出去就完事,不管对方听没听到。没有重传、没有流量控制,但正因为没这么多约束,性能高、

    延迟低。音视频通话用 UDP 多,比如 WebRTC,偶尔丢个包顶多画面卡一下,总比延迟高强。

    1)TCP 有连接状态,维护成本高,并发百万连接对服务器资源消耗大

    2)UDP 无状态,每个包独立处理,天生适合做广播、组播,像 DNS 查询、DHCP 分配 IP 都靠它

    3)TCP 头部至少 20 字节,UDP 只有 8 字节,头部开销小一半以上

    代码上看也很直观:

    // UDP 发送片段

    DatagramSocketsocket = newDatagramSocket();

    byte[] data = "hello".getBytes();

    InetAddressaddr = InetAddress.getByName("127.0.0.1");

    DatagramPacketpacket = newDatagramPacket(data, data.length, addr, 8080);

    socket.send(packet); // 扔出去就不管了

    // TCP 发送片段

    Socketsocket = newSocket("127.0.0.1", 8080);

    OutputStreamout = socket.getOutputStream();

    out.write("hello".getBytes()); // 写完也不一定立刻发,内核会缓冲

    简单说,要准确就选 TCP,要快就选 UDP。没有谁更好,只有合不合适。'
