- query_id: g-064
  scenario_type: stable_technical
  topic: Spring
  query: 'Spring: Spring中的 @ModelAttribute 注解的作用是什么?'
  role: backend
  difficulty: medium
  expected_technologies:
  - Spring
  relevance:
    0572f7ec8bc341abb36344e449af1c66d88fc843cb2dce2d5693b870de20f075: 2
  expected_knowledge_points:
  - Spring
  - Spring中的 @ModelAttribute 注解的作用是什么
  reference_answer: '根据 Spring 面试题速记通关版; page 4：

    Spring中的 @ModelAttribute 注解的作用是什么?

    @ModelAttribute 主要用来预处理请求参数,把数据提前塞进 Model 里,让后续方法能直接用。

    1)它可以加在方法上,这个方法会在每个 @RequestMapping 方法执行前先跑一遍。比如你有个表单要用到省份列

    表,就可以用它从数据库捞出来放进 Model ,这样⻚面自动能访问到。

    @ModelAttributepublicvoidpopulateStates(Modelmodel) {

    model.addAttribute("states", stateService.getStates());

    }

    2)它也能加在控制器方法的参数上,表示这个参数不是从 URL 或 body 来的,而是从 Model 里找对应名字的对

    象,或者通过参数解析器自动组装。常用于表单提交时绑定对象。

    @PostMapping("/users")

    publicStringsaveUser(@ModelAttributeUseruser) {

    // user 已经由请求参数自动填充

    userService.save(user);

    return "redirect:/users";

    }

    注意一点,如果 Model 里没有现成的 User 实例,Spring 会调用它的无参构造函数创建一个,然后再用请求里的

    name 、email 这些字段去 set。这个过程压根不经过 @RequestBody 那套反序列化流程,是靠数据绑定器

    WebDataBinder 搞定的。

    一般搭配 @SessionAttributes 用,可以把表单对象跨请求存住,比如多步骤表单。但别滥用,容易把 Model

    塞得太满,调试起来头疼。'
