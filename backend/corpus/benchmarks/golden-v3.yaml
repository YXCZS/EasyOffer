  relevance:
    114959d6e93cdd1f7d8b2a48b2a18349ca24222e5c5435f809db27fdab0840c4: 2
  expected_knowledge_points:
  - RabbitMQ
  - 在 RabbitMQ 集群中,节点间如何同步数据
  reference_answer: '根据 RabbitMQ 面试题速记通关版; page 10：

    在 RabbitMQ 集群中,节点间如何同步数据?

    RabbitMQ 集群中,节点间不主动同步消息数据,这是理解其行为的关键。队列、交换器这些元数据可以在集群内自

    动同步,但消息本身只存在于创建它的那个队列所在的节点上。

    1)每个队列有明确的“主节点”,消息的存储和消费都由这个节点负责。其他节点只是转发请求到该节点,压根不经

    过复制消息这一步。

    2)当你在节点 A 上往一个队列发消息,哪怕连接的是节点 B,请求也会被内部转发到 A。整个过程客户端无感知,但

    性能损耗是实打实的,跨节点调用延迟明显。

    3)如果要用高可用,得开启镜像队列(MirroredQueues),通过策略让队列在多个节点上保留副本。比如用 ha-

    mode=all ,所有节点都存一份完整拷贝,某个节点挂了,其他节点能立刻顶上。

    A -->| 生产消息 | queue-on-AB -->| 转发请求 | queue-on-AC -->| 转发请求 | queue-on-Aqueue-on-A
    ||--|| queue-on-B : 镜像副本(可选)

    镜像队列现在官方推荐用 QuorumQueue 替代。它基于 Raft 协议,自动处理选举和数据复制,比老的镜像模式更稳

    定。比如在 3 节点集群中,只要 2 个节点在线就能工作,适合对一致性要求高的场景。

    所以别指望普通集群自动帮你复制消息。要可靠,就得用 QuorumQueue 或早期的镜像策略,不然节点一宕,上面

    的独占队列就全废了。'
