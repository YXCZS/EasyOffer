  reference_answer: '根据 设计模式面试题速记通关版; page 8：

    什么是策略模式?一般用在什么场景?

    策略模式解决的是“一堆 if-else 或 switch 分支里塞不同算法”的问题。你想啊,比如做支付功能,微信支付、支付

    宝、银联,每种逻辑完全不同,要是全写在一个方法里,代码立马爆炸,维护起来根本搞不定。

    它的核心是把每个算法封装成独立的类,都实现同一个接口。运行时根据条件选一个具体实现来用。这样新增支付方

    式不用改老代码,符合开闭原则。

    一般在这些场景特别好使: 1)有明显的行为分支,比如计算运费,按城市、重量、会员等级有不同算价规则 2)需要

    动态切换算法,像导出报表支持 CSV、Excel、PDF 三种格式 3)避免重复的条件判断,像促销活动满减、打折、返券

    举个例子,Spring 的 Resource 接口就是典型,ClassPathResource 、FileSystemResource 、

    UrlResource 各自处理不同路径类型的资源加载,调用方压根不经过具体实现。

    publicinterfaceStrategy {

    voidexecute();

    }

    publicclassContext {

    privateStrategystrategy;

    publicvoidsetStrategy(Strategystrategy) {

    this.strategy = strategy;

    }

    publicvoidrun() {

    strategy.execute();

    }

    }

    实际项目里,配合 Spring 的 IoC,直接把所有策略实现注入进来,用 map 存好,key 是策略名,取的时候

    strategies.get("alipay").execute() 就行,干净利落。'
