  relevance:
    0cb9ee771e1083799a218208ebfbc59f055fad5c0fa275d2f2bea26580d4adb3: 2
  expected_knowledge_points:
  - Java 基础
  - JDK 和 JRE 有什么区别
  reference_answer: '根据 Java 基础面试题速记通关版; page 8：

    JDK 和 JRE 有什么区别?

    JDK 是给开发者用的,它里面不仅包含了写 Java 代码需要的编译器、调试工具,还打包了 JRE。你可以把它看作一个

    完整的开发套件。

    JRE 则是运行 Java 程序的基础环境,它包含 JVM 和运行时需要的核心类库。比如你只是想跑一个别人写好的 .jar 文

    件,装 JRE 就够了,不需要编译功能。

    所以关键在于用途不同:开发选 JDK ,纯运行选 JRE。

    打个比方,JDK 像是整套厨房设备,有刀具、灶台、调料(编译、调试、运行全都有),而 JRE 只是一个微波炉,负责

    把做好的饭菜热一下(只负责运行)。

    现在主流的 JDK 发行版,像 OpenJDK 、OracleJDK 或者国内常用的 AlibabaDragonwell,其实都自带了 JRE,安装

    后可以直接编译也能直接运行程序。

    1)JDK 包含 JRE,JRE 包含 JVM2)没有 JDK 也能运行 Java 程序,只要有 JRE3)javac 命令在 JRE 中不可用,因为它属于编译工具,只存在于
    JDK

    面试如果问到,记住一句话就行:JDK 是开发环境,JRE 是运行环境。'
