  reference_answer: '根据 Java 集合面试题速记通关版; page 4：

    Java 中的 WeakHashMap 是什么 ?

    WeakHashMap 的关键在于它对内存的敏感处理。它的 key 是弱引用,只要 GC 扫到了,不管内存够不够,这个 key

    就会被回收。

    这意味着,哪怕你还在用 value,只要 key 被回收了,整个 entry 就失效了。所以它适合做缓存,但不是那种要求强一

    致的缓存。

    典型场景是监听器注册表,比如 Swing 里的事件监听。注册的时候把 listener 当 key 放进去,一旦外面没人引用它,

    WeakHashMap 自动就清理了,避免内存泄漏。

    对比 HashMap,它不会自动清理;而 WeakHashMap 在 key 回收后,下次 get 或 size 的时候会触发

    expungeStaleEntries,把陈旧的 entry 清掉。

    代码上其实用法差不多:

    Map<SomeObject, String> map = newWeakHashMap<>();

    SomeObjectkey = newSomeObject();

    map.put(key, "data");

    key = null; // 失去强引用

    System.gc(); // 极端情况下触发

    // 下次访问 map ,可能就拿不到数据了

    1)不要指望 WeakHashMap 存长期数据

    2)别把它当普通 Map 用,尤其是 key 会被频繁丢弃的场景

    3)GC 触发时机不确定,行为有延迟性'
