- query_id: g-072
  scenario_type: stable_technical
  topic: SpringCloud
  query: 'SpringCloud: 说说什么是 API 网关?它有什么作用?'
  role: backend
  difficulty: medium
  expected_technologies:
  - SpringCloud
  relevance:
    00ddc2d6d898e8cfa7ca5172fec75e96b5f2af9acbd8e6475e587305f5e7aa94: 2
  expected_knowledge_points:
  - SpringCloud
  - 说说什么是 API 网关?它有什么作用
  reference_answer: '根据 SpringCloud 面试题速记通关版; page 17：

    说说什么是 API 网关?它有什么作用?

    API 网关本质是所有外部请求进入系统的统一入口,有点像小区的门卫。所有流量都得先经过它,再决定往哪走。

    它的核心价值不是转发,而是把一堆通用的、和业务无关的脏活累活给拦下来。比如你用 SpringCloudGateway 或者

    Kong,其实都是在配置这些能力。

    1)鉴权校验。接口不是谁都能调的,网关层可以检查 JWTtoken,没带或者过期了直接 401 拒掉,压根不经过后端服

    务。 2)限流熔断。防止突发流量把系统打崩,按 IP 或用户维度限制 QPS,超过阈值就返回 503,保护下游。 3)日

    志监控。统一记录请求响应时间、状态码,上报到 ELK 或 Prometheus,排查问题不用挨个服务翻日志。 4)协议转

    换。前端调 REST,但内部微服务可能走 gRPC,网关做一层翻译,让前端少操心。 5)路由转发。根据 path 路由到不

    同服务,比如 /user/** 转发到 user-service,路径规则集中管理,后端改了也不用前端跟着变。

    拿电商系统举例,下单请求进来,网关先看是不是登录用户,再判断当前流量有没有超限,然后记一笔 traceId 方便链

    路追踪,最后才放行到订单服务。要是没有网关,每个服务都得自己实现这一套,重复代码多,策略还不一致。'
