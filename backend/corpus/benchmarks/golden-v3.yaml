  reference_answer: '根据 SpringBoot 面试题速记通关版; page 11：

    如何理解 SpringBoot 中的 starter?

    SpringBoot 的 starter 本质是一组依赖描述符,帮你快速集成某个功能模块,不用自己一个个找依赖版本。

    比如你要用 Redis,直接引入 spring-boot-starter-data-redis ,它背后已经帮你组合好了 Lettuce 或

    Jedis、SpringDataRedis、连接池、序列化等依赖,版本也都对齐了。你压根不需要关心具体引入了哪些库,也不用

    操心版本冲突。

    1)所有 starter 都遵循统一命名规范:spring-boot-starter-xxx ,第三方框架接入也按这规则,比如

    mybatis-spring-boot-starter 。

    2)starter 里不写业务逻辑,主要是 pom.xml 的依赖管理。真正的自动配置由对应的 autoconfigure 模块实现,比

    如 spring-boot-autoconfigure 里的 RedisAutoConfiguration 会根据类路径上的组件自动创建

    RedisTemplate 、LettuceConnectionFactory 。

    3)自动装配基于条件注解,像 @ConditionalOnClass 、@ConditionalOnMissingBean ,只有满足条件才生

    效。比如发现 classpath 有 Jedis.class 才去配置 Jedis 连接工厂。

    4)你可以自定义 starter,拆成两部分:xxx-spring-boot-starter (空壳,引 autoconfigure),和 xxx-

    spring-boot-autoconfigure (核心配置,含 META-

    INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports 文件声明配置

    类)。

    INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports 文件声明配置

    类)。

    常见的像 spring-boot-starter-web 带了 Tomcat、SpringMVC、Jackson;spring-boot-starter-jdbc

    自动配好 DataSource 和 JdbcTemplate。省去了大量基础配置的脏活累活,项目一启动就能用。'
