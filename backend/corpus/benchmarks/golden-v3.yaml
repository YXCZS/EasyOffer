  reference_answer: '根据 Java 热门面试题 200 道速记通关版; page 95：

    单例模式有哪几种实现?如何保证线程安全?

    单例模式的关键是确保一个类只有一个实例,并提供全局访问点。常见的实现方式有好几种,每种都有它的适用场景

    和坑。

    1)饿汉式在类加载时就创建实例,写法最简单,天然线程安全,但可能浪费资源。

    publicclassSingleton {

    privatestaticfinalSingletonINSTANCE = newSingleton();

    privateSingleton() {}

    publicstaticSingletongetInstance() {

    returnINSTANCE;

    }

    }

    2)懒汉式延迟初始化,但直接加 synchronized 方法性能差,毕竟锁的是整个方法。

    3)双重检查锁定(DCL)是优化方案,只在实例未创建时才同步,注意必须用 volatile 修饰实例变量,防止指令重排

    序导致返回未初始化完成的对象。

    4)静态内部类方式利用了类加载机制保证线程安全,又实现了懒加载。外部类加载时不触发内部类初始化,直到第一

    次调用 getInstance 才加载 Holder 类并创建实例。

    publicclassSingleton {

    privateSingleton() {}

    privatestaticclassHolder {

    staticfinalSingletonINSTANCE = newSingleton();

    }

    publicstaticSingletongetInstance() {

    returnHolder.INSTANCE;

    }

    }

    5)枚举单例最简洁安全,不仅能防反射攻击,还能防止序列化破坏单例,EffectiveJava 推荐的方式。

    publicenumSingleton {

    INSTANCE;

    }

    一般项目里用静态内部类或枚举就够了。DCL 虽高效但容易写错,比如漏掉 volatile。如果涉及到反序列化或反射的场

    景,优先选枚举。'
