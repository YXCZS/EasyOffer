- query_id: g-073
  scenario_type: stable_technical
  topic: SpringCloud
  query: 'SpringCloud: HTTP 与 RPC 之间的区别?'
  role: backend
  difficulty: medium
  expected_technologies:
  - SpringCloud
  relevance:
    0586559211650e3e83acfef932f34b5825b2e5ebc293d6803910ebdc614a23c3: 2
  expected_knowledge_points:
  - SpringCloud
  - HTTP 与 RPC 之间的区别
  reference_answer: '根据 SpringCloud 面试题速记通关版; page 3：

    HTTP 与 RPC 之间的区别?

    HTTP 是应用层协议,本质是通信规范,而 RPC 是一种编程模型,目标是让远程服务调用像本地方法调用一样简单。

    1)通信协议上,HTTP 通常基于文本或二进制格式(如 HTTP/1.1、HTTP/2),走的是标准端口,天然支持跨平台和浏

    览器交互。RPC 框架可以自定义协议,比如 Dubbo 用 Netty + 自定义私有协议,gRPC 基于 HTTP/2 但封装了严格的

    接口契约。

    2)调用方式差异明显。HTTP 一般通过 RESTful 风格的 URL + 方法(GET/POST)交互,数据多用 JSON 传输,人眼

    可读。RPC 更关注接口抽象,客户端直接调 userService.getUser(1001) ,底层自动序列化、网络传输、服务

    寻址,开发者几乎感知不到网络细节。

    3)性能方面,RPC 协议更轻量,压根不经过浏览器那一套解析逻辑,序列化也常用 Protobuf 这类高效格式,延迟通

    常比 HTTP 低 30% 以上。像 gRPC 在内部微服务之间调用就很常见,扛住高并发没问题。

    4)典型场景:对外暴露 API 给前端或第三方,基本都用 HTTP + REST + JSON。内部服务间调用,尤其是对延迟敏感

    的场景,比如订单系统调库存,就更适合用 RPC 框架,比如 Dubbo 或 gRPC。

    图中左侧是外部 HTTP 访问路径,右侧是内部服务通过 RPC 直接交互,职责清晰。'
