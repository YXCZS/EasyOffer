- query_id: g-078
  scenario_type: stable_technical
  topic: ZooKeeper
  query: 'ZooKeeper: ZooKeeper 中的 ACL 权限模型是否支持递归权限管理?如果不支持,如何实现?'
  role: backend
  difficulty: medium
  expected_technologies:
  - ZooKeeper
  relevance:
    108d79a4517299ecfa0110d09b2ac26637b96319292f292ee5ebfa5c2a2d0ed8: 2
  expected_knowledge_points:
  - ZooKeeper
  - ZooKeeper 中的 ACL 权限模型是否支持递归权限管理?如果不支持,如何实现
  reference_answer: '根据 ZooKeeper 面试题速记通关版; page 59：

    ZooKeeper 中的 ACL 权限模型是否支持递归权限管理?如果不支持,如何实现?

    ZooKeeper 的 ACL 权限模型本身不支持递归继承。你给某个 znode 设置的权限,它的子节点压根不会自动继承这套

    规则,每个节点都是独立的。

    这就意味着,如果你在 /app 上设置了 ACL,新建的 /app/config 还是得重新设置一遍权限,不然客户端可能连

    不上。这种设计其实是为了灵活性,避免误操作导致权限扩散,但带来的问题是管理成本高,尤其是树形结构深的时

    候。

    要想实现类似“递归权限”的效果,得靠自己写代码控制。常见的做法是在创建子节点时,主动把父节点的 ACL 拷贝

    过去。ZooKeeper 提供了 getACL 和 setACL 接口,你可以先读父节点的 ACL,再应用到新子节点上。

    List<ACL> acl = zooKeeper.getACL("/app", null);

    zooKeeper.create("/app/config", data, acl, CreateMode.PERSISTENT);

    这种方式适用于 Curator 这类框架做二次封装的场景。比如用 Curator 的 Transaction 批量创建节点时,统一带上

    同一套 ACL 策略,就能减少重复操作。

    有些公司会在中间件层封装 ZooKeeper 客户端,在 create() 调用里自动处理 ACL 传递逻辑,对业务透明。这属

    于脏活累活交给基础设施去扛的典型思路。

    要不要搞这套,得看你的节点数量和安全要求。如果就几个节点,手动设也行;要是成百上千个路径,建议在客户端

    做一层自动同步。'
