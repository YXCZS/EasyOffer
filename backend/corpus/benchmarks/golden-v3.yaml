  reference_answer: '根据 SpringBoot 面试题速记通关版; page 15：

    SpringBoot 是如何通过 main 方法启动 web 项目的?

    SpringBoot 启动 Web 项目不是靠 main 方法本身多高级,而是靠 SpringApplication.run() 这个静态方法把

    一堆脏活累活给干了。

    main 方法里通常就两行代码,核心是调用 SpringApplication.run(Application.class, args) 。它会做几

    件事:推断应用类型,比如有没引入 Tomcat、Jetty 这些依赖;加载所有 META-INF/spring.factories 里配置

    的初始化器和监听器;最后创建对应的上下文容器。

    如果是 Web 应用,它会创建 AnnotationConfigServletWebServerApplicationContext,这个上下文知道怎么启动

    内嵌 Web 服务器。在刷新阶段,会触发 ServletWebServerFactoryAutoConfiguration 自动装配,根据

    classpath 选一个可用的 Web 服务器,比如默认是 Tomcat。

    1)先找有没有 ServletWebServerFactory 类型的 Bean2)通过工厂获取 WebServer 实例,比如 TomcatServletWebServerFactory3)调用
    webServer.start() 把内嵌容器跑起来

    @SpringBootApplicationpublicclassApp {

    publicstaticvoidmain(String[] args) {

    SpringApplication.run(App.class, args);

    }

    }

    整个过程最关键是自动装配 + 内嵌容器 + 特殊上下文联动。你不需要手动 newTomcat 或 configureconnector,全靠

    }

    }

    整个过程最关键是自动装配 + 内嵌容器 + 特殊上下文联动。你不需要手动 newTomcat 或 configureconnector,全靠

    条件化配置搞定。只要加了 spring-boot-starter-web ,启动时就会拉起一个预配置好的 Web 服务,监听

    8080。'
