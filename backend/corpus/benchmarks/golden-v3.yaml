    LVS 其实就是 Linux 虚拟服务器,说白了它是在操作系统内核层做的负载均衡。你发一个请求过来,LVS 在网络包到达

    服务器的第一时间就决定转发给后端哪台机器,压根不经过应用层,所以性能特别猛,单机扛几百万并发都可能。

    Nginx 也做负载均衡,但它工作在应用层(七层),能看 HTTP 头、URL、Host 这些信息,做更灵活的路由,比如把

    /api 转到 A 服务,/static 转到 CDN。但它是反向代理,请求得先被 Nginx 接收再转发出去,多了一道,性能

    上限比 LVS 低一些。

    1)LVS 工作在网络四层,基于 IP 和端口做转发,常见模式有 NAT、DR 和 TUN。DR 模式最常用,转发效率高,响应

    可以直接从后端机器返回客户端,不需要经过 LVS。

    2)Nginx 是七层代理,功能更丰富,支持限流、缓存、重写、SSL 终止等,适合做网关入口。

    3)实际架构里,经常是 LVS + Nginx 搭配用。LVS 放前面抗住连接洪峰,后面挂一批 Nginx 做精细流量调度,比如阿

    里早期的架构就是这么玩的。

    简单说,LVS 是干高并发转发的脏活累活,Nginx 是做精细化流量治理的好手,两者层级不同,经常是配合关系,不是

    非此即彼。'
