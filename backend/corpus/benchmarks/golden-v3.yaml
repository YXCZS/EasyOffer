  reference_answer: '根据 Java 基础面试题速记通关版; page 1：

    你使用过哪些 JDK 提供的工具?

    JDK 自带的工具其实是日常排查问题的利器,很多场景下压根不需要额外依赖第三方工具。

    jps 相当于 Java 版的 ps,能快速列出当前机器上所有正在运行的 Java 进程 PID。排查多实例部署时特别有用,几秒

    钟就能定位到目标进程。

    jstat 是看 JVM 运行状态最轻量的方式,尤其是监控 GC 频率和堆内存变化。比如想确认是不是频繁 FullGC,用

    jstat -gcutil <pid> 1000 每秒打一次数据,趋势一目了然。

    jstack 对应线程分析,定位死锁或高 CPU 很直接。拿到进程 PID 后执行 jstack <pid> ,输出的线程栈里如果看到

    WAITING 状态集中在某个锁对象,基本就能锁定问题点。线上服务响应卡顿,第一反应就是抓 threaddump 看有没

    有线程堆积。

    jmap 可以导出堆内存快照,配合 jhat 或 MAT 分析内存泄漏。不过要注意的是,jmap -dump 在堆大的时候会触发

    长时间 STW ,生产环境得谨慎操作。

    其实从 JDK8 开始,Arthas 虽然是阿里开源的,但已经成了事实标准。它把上面这些命令都整合了,还能动态 trace

    方法调用、watch 参数返回值,排查线上问题效率提升非常明显。'
