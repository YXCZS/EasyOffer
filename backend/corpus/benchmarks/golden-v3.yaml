- query_id: g-071
  scenario_type: stable_technical
  topic: SpringCloud
  query: 'SpringCloud: 什么是灰度发布、金丝雀部署以及蓝绿部署?'
  role: backend
  difficulty: medium
  expected_technologies:
  - SpringCloud
  relevance:
    000ecf107ec552f4a4bea4d6fa606dd0f4e604e61ed99973128a8799d0b06204: 2
  expected_knowledge_points:
  - SpringCloud
  - 什么是灰度发布、金丝雀部署以及蓝绿部署
  reference_answer: '根据 SpringCloud 面试题速记通关版; page 13：

    什么是灰度发布、金丝雀部署以及蓝绿部署?

    灰度发布、金丝雀部署和蓝绿部署都是控制流量逐步切换的发布策略,核心目标是降低上线风险。

    灰度发布是个大概念,指先让一部分用户使用新版本,反馈没问题再全量推。比如你在用某个App,突然被选中体

    验“内测版”,其实就是进入了灰度名单。这种策略常见于互联网产品,像微信、淘宝发版都走灰度,靠用户ID或地域

    分流,后端一般用Nginx或SpringCloudGateway做路由。

    金丝雀部署是灰度的一种具体实现,名字来自矿工带金丝雀下矿的传统。它更偏向基础设施层面操作,比如在

    Kubernetes里,你先起一个新版本Pod,把1%的流量导过去,观察日志和监控指标。没问题就逐步增加比例,直到全

    切。这过程可以用Istio这样的服务网格精细控制。

    蓝绿部署则是准备两套完全一样的生产环境,蓝色是当前线上,绿色是新版本。发布时直接把流量从蓝切到绿,回滚

    也是一键切回来。好处是切换快、回滚快,但成本高,毕竟要维持两套环境。AWSElasticBeanstalk和阿里云EDAS都

    支持这种模式。

    对比来看,蓝绿最稳但花钱多,金丝雀最灵活但控制复杂,灰度适合用户维度的渐进验证。'
