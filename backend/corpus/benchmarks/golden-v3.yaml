  reference_answer: '根据 Java 集合面试题速记通关版; page 12：

    为什么 JDK1.8 对 HashMap 进行了红黑树的改动?

    JDK1.8 对 HashMap 的优化,主要解决哈希冲突严重时的性能退化问题。当大量元素落在同一个桶时,链表会变得很

    长,查找从 O(1) 退化到 O(n)。为控制最坏情况的时间复杂度,引入了红黑树机制。

    具体触发条件是:某个桶内的节点数达到 8,并且当前数组长度大于等于 64,链表就会转成红黑树。这样最坏查找性

    能能稳定在 O(logn)。反过来,如果红黑树节点减少到 6,又会退化回链表,避免维护红黑树的额外开销。

    这个设计其实是空间和时间的权衡。链表占用小,但查询慢;红黑树查询快,结构更复杂。阈值选 8 和 6 是为了防止

    频繁来回转换,用了泊松分布做依据,碰撞达到 8 的概率已经极低。

    常见误区是认为只要 put 就可能转红黑树,其实前提是扩容也解决不了散列问题。比如所有 key 都只落在少数几个桶

    里,扩容后还是冲突,这时候链表长度才会持续增长。

    代码上你不需要感知这个过程,HashMap 内部自动切换。但如果你的 key 没有合理实现 hashCode(),比如总返回

    1,那所有元素都挤在一个桶,性能立马崩成 O(n)。'
