  reference_answer: '根据 设计模式面试题速记通关版; page 18：

    什么是组合模式?一般用在什么场景?

    组合模式解决的是树形结构的统一处理问题。你有一堆对象,它们之间是父子关系,形成一个树,你想让客户端不管

    是操作根节点、分支还是叶子,都用同一套接口。

    1)它把对象组织成树形结构,每个节点要么是容器(组合节点),要么是叶子节点。关键是,容器和叶子都实现同一

    个抽象接口,这样上层调用者就不需要关心当前操作的是不是还有子节点。

    2)典型场景比如文件系统,目录可以包含文件和其他目录,但你可以对它们统一调用 getSize() 或

    delete() 。再比如 UI 组件,窗口包含面板,面板包含按钮,但所有组件都能响应 draw() 调用。

    3)另一个常见例子是菜单系统。像 Swing 或 JavaFX 中的菜单项和子菜单,都可以被点击或渲染,组合模式让遍历和

    操作变得简单。

    代码核心就是一个 Component 接口,定义通用行为,然后 Composite 里维护一个 List<Component> 子节点

    列表,调用时递归下去。

    这种模式的好处是扩展性强,加新类型的节点不影响原有逻辑。但缺点也很明显,如果节点类型差异大,强行统一接

    口会让很多方法在某些子类里空实现,有点别扭。用的时候得看场景是否真的具备树形 + 统一操作的特征。'
