- query_id: g-042
  scenario_type: stable_technical
  topic: MySQL
  query: 'MySQL: MySQL 中 varchar 和 char 有什么区别?'
  role: backend
  difficulty: medium
  expected_technologies:
  - MySQL
  relevance:
    023b3c5c7eed97fcb84acb5b36ce702e41028dd37f43e7418ead980864139a84: 2
  expected_knowledge_points:
  - MySQL
  - MySQL 中 varchar 和 char 有什么区别
  reference_answer: '根据 MySQL 面试题速记通关版; page 3：

    MySQL 中 varchar 和 char 有什么区别?

    varchar 和 char 都是用来存字符串的,但用法和底层处理差别挺大。

    char 是定长的,你定义成 char(10),那它就占 10 个字符的空间,不管实际存的是 "a" 还是 "hello",都会补空格到

    10。查询快,适合存长度固定的值,比如性别、状态码这种 1-2 位的标识。但浪费空间,尤其是字段定义得大而实际

    内容短的时候。

    varchar 是变长的,存多少占多少,最大支持 65535 字节(受限于行大小)。它需要额外 1-2 个字节记录长度,所以读

    写时多一点开销。适合长度不一的场景,比如用户名、地址这些。但因为长度可变,在行内存储结构上更灵活,空间

    利用率高。

    1)char 全部按固定长度分配存储,尾部空格会被截断(除非启用 PAD_CHAR_TO_FULL_LENGTH 模式) 2)

    varchar 实际占用空间 = 内容长度 + 长度标识字节(内容小于 255 字节用 1 字节,否则 2 字节) 3)两者在检索时,

    char 的性能略好,因为位置固定;varchar 要先读长度再定位内容

    举个例子:

    CREATETABLEt (achar(10), bvarchar(10));

    INSERTINTOtVALUES (''abc'', ''abc'');

    这行数据中,a 列实际占 10 字符,b 列只占 3 字符 + 1 字节长度信息。

    注意行大小限制,一张表所有列加起来不能超过约 65KB,所以别随便把大文本塞进 char 或超长 varchar。'
