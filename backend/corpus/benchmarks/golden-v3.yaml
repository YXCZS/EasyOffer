- query_id: g-043
  scenario_type: stable_technical
  topic: MySQL
  query: 'MySQL: MySQL 中 TEXT 类型最大可以存储多长的文本?'
  role: backend
  difficulty: medium
  expected_technologies:
  - MySQL
  relevance:
    0328eab4162a277a0e2eb9e2767f5f8e862d799f219908c48e637e68561197da: 2
  expected_knowledge_points:
  - MySQL
  - MySQL 中 TEXT 类型最大可以存储多长的文本
  reference_answer: '根据 MySQL 面试题速记通关版; page 17：

    MySQL 中 TEXT 类型最大可以存储多长的文本?

    MySQL 的 TEXT 类型不是单一类型,而是一组用于存储大文本的字段类型,不同变种容量差别很大。

    1)TINYTEXT 最大 255 字节,和 VARCHAR(255) 上限一样,但存储方式不同。

    2)TEXT 最大 65,535 字节(约 64KB),实际能存的字符数取决于字符集。比如用 utf8mb4,一个字符占 4 字节,最

    多存 16383 个字符左右。

    3)MEDIUMTEXT 支持到 16,777,215 字节(约 16MB),适合存文章内容、日志片段这类中等长度文本。

    4)LONGTEXT 能到 4,294,967,295 字节(约 4GB),基本能满足绝大多数大文本场景。

    这些类型的数据不存储在行内,而是把实际内容放在额外的溢出⻚,行里只存指向它的指针。这样一来,虽然能存得

    下大文本,但访问时会有一次间接寻址,性能比 VARCHAR 差一些。

    如果字段经常用来做 WHERE 查询或 ORDERBY,尽量别用 TEXT,因为索引受限。比如普通索引最多前缀 767 字节

    (或 3072 字节,取决于 innodb_large_prefix 配置),全文检索可以用 FULLTEXT 索引,像 MySQL 自带的全文索引或

    者接入 Elasticsearch 更合适。

    代码上建表时写法很简单:

    CREATETABLEarticles (

    idINTPRIMARYKEY,

    contentLONGTEXT

    );

    一般选哪种,得看业务数据量级。存个用户简介用 TEXT 绰绰有余,存小说章节建议 MEDIUMTEXT,搞文档归档系统

    可能就得上 LONGTEXT。'
