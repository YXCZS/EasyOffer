  - MySQL 的存储引擎有哪些?它们之间有什么区别
  reference_answer: '根据 MySQL 面试题速记通关版; page 32：

    MySQL 的存储引擎有哪些?它们之间有什么区别?

    MySQL 支持多种存储引擎,但最常用的其实是 InnoDB 和 MyISAM 。面试里问这个,核心是看你对 InnoDB 的掌握程

    度。

    1)InnoDB 是 MySQL 默认引擎,从 5.5 版本开始就扛住主要业务场景。它支持事务、行级锁、外键约束,还实现了

    MVCC 来提升并发性能。大多数高并发、要求数据一致性的系统都会选它,比如电商订单、支付这类模块。

    2)MyISAM 虽然查询快,尤其是 count(*) 这种全表扫描,但它压根不支持事务和行锁,写入时会锁整张表。现在基本

    被淘汰了,只在一些日志类、读多写少的场景还能见到,比如老系统的数据分析表。

    3)其他引擎像 Memory 是把数据放内存的,断电就丢,适合做临时缓存表;Archive 用来存归档数据,压缩比高,但

    查询能力弱。

    InnoDB 的数据是按聚簇索引组织的,主键索引直接带行数据,二级索引指向主键。而 MyISAM 不管什么索引,都指向

    数据文件地址,结构上就简单很多。

    选引擎的关键是看业务需求。要事务和并发写,必须用 InnoDB;纯读且统计频繁,可以考虑 MyISAM ,但现在一般通

    过缓存或数仓解决。别在新项目里用 MyISAM ,搞不定故障恢复。'
