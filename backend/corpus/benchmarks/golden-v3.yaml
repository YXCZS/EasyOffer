  reference_answer: '根据 Java 并发面试题速记通关版; page 29：

    什么是 Java 的 CountDownLatch?

    CountDownLatch 的本质是一个一次性使用的同步工具,用来让一个或多个线程等待其他线程完成一组操作。它内部

    维护一个计数器,初始化时指定需要等待的事件数量。

    1)当某个线程调用 countDown() 方法,计数器就减 1,这个操作是线程安全的,而且不会阻塞调用线程。 2)而

    其他线程可以调用 await() 方法来阻塞自己,直到计数器归零才会继续执行。 3)一旦计数器归零,所有等待的线

    程会被释放,后续再调用 await 也会直接通过,因为这个 latch 已经被触发了。

    比如在 Web 应用启动时,主线程要等 3 个数据加载线程都完成后才开始对外提供服务,就可以初始化一个

    CountDownLatch(3),每个加载线程完成任务后调 countDown ,主线程在 await 上等着就行。

    代码上很简单:

    CountDownLatchlatch = newCountDownLatch(3);

    // 子线程中

    latch.countDown();

    // 主线程中

    latch.await(); // 阻塞直到计数归零

    注意它是一次性的,不能重置。如果需要重复使用,得换 CyclicBarrier 或者重新 new 一个实例。它也不保证线程安

    全的业务逻辑,只是控制执行时机,别把它当成数据同步手段。'
