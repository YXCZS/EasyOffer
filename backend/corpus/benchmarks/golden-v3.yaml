  reference_answer: '根据 Java 虚拟机面试题速记通关版; page 6：

    什么是 Java 中的 loggingwritebarrier?

    Java 中的 loggingwritebarrier 其实是垃圾回收过程中用来追踪对象引用变化的一种机制,主要用在像 G1 或 ZGC 这

    类关注并发标记的收集器里。

    它不直接“记录日志”到文件,而是把对象引用的修改,比如 obj.field = newRef ,这种写操作记下来。因为并

    发标记阶段用户线程还在跑,对象图可能随时变,writebarrier 就是在每次引用字段被修改时插一段逻辑,把这次变

    更记录到一个队列里。

    这些记录后续会被并发标记线程消费,确保新引用的对象不会被漏标,从而保证标记的准确性。你可以把它看作是 GC

    对“谁改了引用”这件事的监控探针。

    1)写屏障代码通常由 JVM 自动生成,不需要开发者干预

    2)它带来的开销很小,但高频调用场景下仍会有一定性能影响

    3)G1 使用 post-writebarrier 来记录 cardtable,ZGC 则用 loadbarrier 配合指针着色

    举个简单例子,G1 里一旦发现某个 region 的引用被更新,就会通过 writebarrier 标记对应 card,让后续 Remark 阶

    段能快速扫描脏卡。

    这机制说白了就是为了解决“一边干活一边记账”的一致性问题,让 GC 能在不停顿的情况下安全完成标记。'
