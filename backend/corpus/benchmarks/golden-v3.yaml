  reference_answer: '根据 Redis 面试题速记通关版; page 32：

    Redis 中如何实现分布式锁?

    实现分布式锁,最朴素的想法是用一个能共享的状态来标记“锁被谁占了”,Redis 天然适合这个场景。关键不是 set

    本身,而是怎么保证 set 的原子性和后续的可靠性。

    1)先说最基础的一招:SETresource_namerandom_valueNXPX30000NX 是“不存在才设置”,PX 是毫秒级过期时间,random
    _value 要保证唯一,一般用 UUID 或线程 ID 加时间戳。这一

    步就能防住并发重复获取。

    但光设上锁不行,释放的时候得小心。不能直接 del,不然可能删了别人的锁。正确做法是 Lua 脚本:

    ifredis.call("get", KEYS[1]) == ARGV[1] thenreturnredis.call("del", KEYS[1])

    elsereturn0end

    这个脚本保证“判断 + 删除”是原子的,值对才删,避免误删。

    2)上面这套在单 Redis 实例下够用,但主从切换时可能丢锁⸺主节点还没同步到从节点就挂了,新主没这把锁,别

    人就能抢到。这就是锁失效问题。

    想更稳就得用 Redlock 算法,它要求跨多个独立 Redis 节点加锁,必须大多数节点成功才算拿到锁。虽然性能差些,

    但提高了容错性。不过实际中很多人还是用单实例 + 高可用部署,配合超时和重试扛住大部分场景。

    3)生产里常见的是 Redisson,它封装了可重入锁、看门狗自动续期。比如锁快过期了,后台线程会自动延长过期时

    间,只要线程还活着。这解决了业务执行时间不确定的问题。'
