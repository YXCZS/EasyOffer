- query_id: g-060
  scenario_type: stable_technical
  topic: Redis
  query: 'Redis: Redis 中原生批处理命令(MSET、MGET)与 Pipeline 的区别是什么?'
  role: backend
  difficulty: medium
  expected_technologies:
  - Redis
  relevance:
    1b323c70f2824937d1fb0c4a0b0779036f207a68c9f9b7e246fd8be0766b3815: 2
  expected_knowledge_points:
  - Redis
  - Redis 中原生批处理命令(MSET、MGET)与 Pipeline 的区别是什么
  reference_answer: '根据 Redis 面试题速记通关版; page 10：

    Redis 中原生批处理命令(MSET、MGET)与 Pipeline 的区别是什么?

    原生批处理像把多个命令打包成一个请求发给 Redis,MSET 和 MGET 就是这种。Redis 收到后可以一次性执行,网络

    来回只有 1 次,指令还是原子的,顺序执行不被打断。

    Pipeline 不一样,它不是命令,而是一种通信优化手段。客户端把一堆命令连续发出去,不用等每个响应。Redis 还是

    一个个处理,但省掉了反复的网络等待时间。比如发 100 条 GET,RTT 是 1ms,传统方式要 100ms,Pipeline 可能只

    要 2ms(1次发送 + 1次回程)。

    关键区别在于 原子性 和 实现层级。MSET/MGET 是服务端支持的单命令多操作,天然原子。Pipeline 是客户端攒请

    求、批量发,服务端压根不经过“原子执行”这层逻辑,中间可能穿插别的客户端命令。

    举个例子:用 Jedis 做 Pipeline,你写:

    Pipelinep = jedis.pipelined();

    p.get("k1");

    p.get("k2");

    List<Object> resp = p.syncAndReturnAll(); // 批量获取结果

    这期间其他客户端照样能写数据,没法保证这一组读的原子视图。

    再比如,MSET 最多支持 1024 个键,超了得拆;Pipeline 理论上可以塞几千条不同命令,但得自己控制缓冲区大小,

    别把内存搞爆。

    所以,要原子性批量读写小数据,用 MGET/MSET。要是追求吞吐,操作之间不要求原子,比如缓存预热加载 1w 条数

    据,Pipeline 更合适。'
