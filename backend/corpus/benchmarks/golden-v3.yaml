- query_id: g-039
  scenario_type: stable_technical
  topic: MyBatis
  query: 'MyBatis: MyBatis 与 Hibernate 有哪些不同?'
  role: backend
  difficulty: medium
  expected_technologies:
  - MyBatis
  relevance:
    36befb6fb33f686eae6ef9ca97cc104e6b611efd7fa7373cd97ba72fab32cc6c: 2
  expected_knowledge_points:
  - MyBatis
  - MyBatis 与 Hibernate 有哪些不同
  reference_answer: '根据 MyBatis 面试题速记通关版; page 5：

    MyBatis 与 Hibernate 有哪些不同?

    MyBatis 和 Hibernate 都是 Java 里处理数据库操作的 ORM 框架,但设计哲学差得挺远。

    Hibernate 是全自动化的,你定义好实体类和映射关系,增删改查基本不用写 SQL,它自动生成并执行。比如用

    Session.save(entity) 就能把对象存进数据库,连事务都帮你管好了。这种适合业务规则稳定、表结构规范的

    项目,像传统企业管理系统用 Hibernate 能省不少事。

    MyBatis 则是半自动的,SQL 得自己写,通过 XML 或注解把参数和结果集跟 Java 对象做映射。比如一个带多表关联

    的查询,你可以精确控制 SQL 的每一部分,性能调优更方便。互联网公司搞高并发、复杂查询时,普遍选 MyBatis,

    毕竟对 SQL 的掌控力更强。

    1)Hibernate 抹平了数据库差异,HQL 可以跨数据库运行,迁移成本低

    2)MyBatis 直接暴露 SQL,灵活性高,但换数据库时可能要重写语句

    3)Hibernate 有完整的缓存体系(一级、二级缓存),MyBatis 缓存功能相对简单

    举个例子,做报表查询这种字段多、条件动态拼接的场景,Hibernate 很难搞定,SQL 不透明,拼起来费劲。MyBatis

    直接写原生 SQL,配合动态标签 <if> 、<choose> 处理条件,干净利落。

    总的来说,追求开发效率、少写 SQL 用 Hibernate;需要精细控制 SQL、应对复杂场景就上 MyBatis。'
