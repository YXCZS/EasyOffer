- query_id: g-061
  scenario_type: stable_technical
  topic: Spring
  query: 'Spring: SpringWebFlux 是什么?它与 SpringMVC 有何不同?'
  role: backend
  difficulty: medium
  expected_technologies:
  - Spring
  relevance:
    0432b410413bd0c3fc32c8e5e1e212bba27014d37dd1677f293d62b94aeda8ea: 2
  expected_knowledge_points:
  - Spring
  - SpringWebFlux 是什么?它与 SpringMVC 有何不同
  reference_answer: '根据 Spring 面试题速记通关版; page 22：

    SpringWebFlux 是什么?它与 SpringMVC 有何不同?

    SpringWebFlux 是 Spring5 引入的响应式编程框架,用来构建异步非阻塞的服务。它不是对 SpringMVC 的替代,而

    是多了一种选择,特别是在 I/O 密集或高并发场景下能更好地利用线程资源。

    1)运行模型不同

    SpringMVC 基于 Servlet 容器,每个请求对应一个线程,阻塞时线程挂起,吞吐量受限于线程池大小。比如 Tomcat

    默认最大线程数 200,超过就得排队。WebFlux 则基于 Reactor 模型,使用少量事件循环线程处理大量连接,数据流

    通过 响应式流(ReactiveStreams)传播,压根不经过传统同步 IO。

    2)编程范式不同

    MVC 是命令式编程,代码一行行执行,调试直观。WebFlux 推荐函数式风格,用 Mono 和 Flux 表达异步数据

    流。比如返回单个结果用 Mono<String> ,而不是 String 。

    @GetMapping("/async")

    publicMono<String> getData() {

    returnservice.getDataAsync(); // 非阻塞调用

    }

    3)适用场景有差异

    如果业务逻辑简单、依赖少,用 MVC 更稳更熟。但如果你在做网关类服务,比如集成 SpringCloudGateway,或者

    需要长连接支持(如 WebSocket、SSE),WebFlux 能扛住更高并发。

    4)容器支持也不同

    MVC 可以跑在任何 Servlet 容器上。WebFlux 要么用 Netty,要么用支持异步 Servlet3.1+ 的容器(如 Undertow),

    Tomcat 虽然也能跑,但优势不如在 Netty 上明显。

    要不要上 WebFlux,关键看你的瓶颈是不是在 I/O。如果是 CPU 密集型,两者差别不大。而且响应式栈对数据库驱动

    Tomcat 虽然也能跑,但优势不如在 Netty 上明显。

    要不要上 WebFlux,关键看你的瓶颈是不是在 I/O。如果是 CPU 密集型,两者差别不大。而且响应式栈对数据库驱动

    也有要求,像 R2DBC 才能真正实现全链路异步,传统 JDBC 会把整个链路堵死。'
