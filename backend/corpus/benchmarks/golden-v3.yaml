  query: 'ZooKeeper: ZooKeeper 中,什么情况下 ZAB 会进入恢复模式并选举新的 Leader?'
  role: backend
  difficulty: medium
  expected_technologies:
  - ZooKeeper
  relevance:
    1eb73058835d7029888032b988ea985845b374a69f3c9454e38205a143592244: 2
  expected_knowledge_points:
  - ZooKeeper
  - ZooKeeper 中,什么情况下 ZAB 会进入恢复模式并选举新的 Leader
  reference_answer: '根据 ZooKeeper 面试题速记通关版; page 18：

    ZooKeeper 中,什么情况下 ZAB 会进入恢复模式并选举新的 Leader?

    ZooKeeper 集群启动或运行中,一旦超过半数的 Follower 与当前 Leader 失去心跳连接,整个集群就无法保证数据同

    步和事务提交的完整性,这时候 ZAB 协议必须触发恢复流程。

    1)Leader 宕机是最常见的情况。比如部署在 K8s 上的 ZooKeeperPod 被驱逐,或者物理机断电,导致其他节点在超

    时时间内收不到 Leader 的心跳和消息广播。

    2)网络分区也会引发。假设集群跨机房部署,机房间网络中断,多数派所在的分区会发现原 Leader 不可达,为了继

    续提供服务,它们会发起新一轮选举。

    3)集群首次启动时,所有节点都处于 Looking 状态,压根没有 Leader,自然要走一遍选举流程来选出第一个

    Leader。

    恢复模式的核心是选举出具有最新事务记录的节点作为新 Leader。每个节点会广播自己的事务 ID(ZXID),这个 ID 是

    64 位长,高 32 位是纪元 Epoch,低 32 位是事务计数。比较 ZXID 时先看 Epoch,再看事务序号。拥有最大 ZXID 的

    节点大概率拥有最全的数据,更容易当选。

    选举过程采用类似 Paxos 的两阶段提交思想,通过 Proposal 和 Vote 消息完成,确保只有一个 Leader 被多数派确

    认。一旦新 Leader 产生,它会和 Follower 进行数据同步,补齐缺失的事务,之后集群进入广播模式,恢复正常服

    务。'
