- query_id: g-066
  scenario_type: stable_technical
  topic: SpringBoot
  query: 'SpringBoot: SpringBoot 打成的 jar 和普通的 jar 有什么区别 ?'
  role: backend
  difficulty: medium
  expected_technologies:
  - SpringBoot
  relevance:
    1e81cb3a9fe817672c415a8fa37716c028f7b088a0a612b7fd834631eaf2756e: 2
  expected_knowledge_points:
  - SpringBoot
  - SpringBoot 打成的 jar 和普通的 jar 有什么区别
  reference_answer: '根据 SpringBoot 面试题速记通关版; page 13：

    SpringBoot 打成的 jar 和普通的 jar 有什么区别 ?

    SpringBoot 打出来的 jar 和普通 jar 最大的不同在于可执行性和依赖打包方式。

    普通 jar 只是把 .class 文件按包结构打进去,运行得靠外部 classpath 引入依赖。你用 java -jar 跑一个普通

    Spring 项目 jar,基本会报错找不到主类或者依赖。

    SpringBoot 的 jar 是个胖 jar(fatjar),它把项目所有的编译类 + 依赖的第三方库 + 内嵌容器(比如 Tomcat)全塞

    进一个 jar 里了。启动的时候,通过自定义的类加载器 LaunchedURLClassLoader 动态加载内部的 jar 包。

    它的目录结构也特别,除了正常的 /classes ,还有 /lib 目录存着所有依赖 jar,/BOOT-INF/classes 放项

    目自己的 class,/META-INF/MANIFEST.MF 里的 Main-Class 指向的是

    org.springframework.boot.loader.JarLauncher ,不是你写的 Application 类。

    这个 JarLauncher 就是启动入口,它会先解析内部结构,把 /BOOT-INF/lib 下的 jar 全加到类路径,再反射调用

    你配置的真正启动类。

    代码上不用你操心,只要在 pom .xml 用了 spring-boot-maven-plugin ,build 时就会自动处理。

    <build>

    <plugins>

    <plugin>

    <groupId>org.springframework.boot</groupId>

    <artifactId>spring-boot-maven-plugin</artifactId>

    </plugin>

    </plugins>

    </build>

    <artifactId>spring-boot-maven-plugin</artifactId>

    </plugin>

    </plugins>

    </build>

    所以一句话:普通 jar 是模块包,SpringBootjar 是自带容器、开箱即用的部署包,适合微服务这种独立部署场景。

    像 Nacos、Eureka 的客户端启动包也是这么打的。'
