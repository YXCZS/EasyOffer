- query_id: g-054
  scenario_type: stable_technical
  topic: RabbitMQ
  query: 'RabbitMQ: 如何在 RabbitMQ 中处理消息的重复消费问题?'
  role: backend
  difficulty: medium
  expected_technologies:
  - RabbitMQ
  relevance:
    13e3b284e0e924a6950281ba53aec25f498d2cd3d9104422744b407f202d88f4: 2
  expected_knowledge_points:
  - RabbitMQ
  - 如何在 RabbitMQ 中处理消息的重复消费问题
  reference_answer: '根据 RabbitMQ 面试题速记通关版; page 15：

    如何在 RabbitMQ 中处理消息的重复消费问题?

    消息重复消费是分布式场景下的老大难问题,RabbitMQ 本身不保证“恰好一次”投递,网络抖动或消费者宕机都可

    能导致同一条消息被重新投递。解决这事,得靠业务层配合。

    1)首先确认 RabbitMQ 的 ACK 机制。手动 ACK 模式下,消费者处理完消息后才发确认,如果处理到一半挂了,

    Broker 会把消息发给别的消费者。这本来是高可用设计,但也是重复的根源。

    2)幂等性是关键。不管消息来多少遍,结果要一致。常见方案有:

    利用数据库唯一约束。比如消息带了个业务 ID,入库前先往表里插一条记录,主键就用这个 ID。重复来?直

