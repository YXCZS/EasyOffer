  reference_answer: '根据 Java 虚拟机面试题速记通关版; page 22：

    你了解 Java 的类加载器吗?

    Java 的类加载器不是简单的文件读取工具,它负责在运行时动态将 .class 文件加载到 JVM 中,并转换成

    java.lang.Class 对象。

    整个机制基于双亲委派模型。当一个类加载请求到来时,当前类加载器不会自己先去加载,而是交给它的父类加载器

    处理。只有当父类加载器无法完成加载(比如在指定路径找不到类),子加载器才会尝试自己加载。这种设计保证了像

    java.lang.Object 这种核心类不会被自定义加载器篡改,保障了安全性和一致性。

    JVM 内置三类加载器: 1)启动类加载器(BootstrapClassLoader)由 C++ 实现,加载 $JAVA_HOME/lib 下的核

    心类库,比如 rt.jar 。 2)扩展类加载器(ExtensionClassLoader)加载 $JAVA_HOME/lib/ext 目录下的类。

    3)应用程序类加载器(ApplicationClassLoader)加载用户 classpath 指定的类。

    你可以自定义类加载器,继承 ClassLoader 并重写 findClass() 方法。典型场景包括热部署(如 Tomcat 隔离

    各个 Web 应用)、模块化加载(OSGi)或远程类加载。

    publicclassCustomClassLoaderextendsClassLoader {

    @OverrideprotectedClass<?> findClass(Stringname) throwsClassNotFoundException
    {

    byte[] classData = loadClassData(name);

    if (classData == null) thrownewClassNotFoundException();

    returndefineClass(name, classData, 0, classData.length);

    }

    returndefineClass(name, classData, 0, classData.length);

    }

    }

    打破双亲委派的少数情况是线程上下文类加载器,用来解决父类加载器需要加载应用级别的实现,比如 JNDI 服务加载

    数据库驱动。'
