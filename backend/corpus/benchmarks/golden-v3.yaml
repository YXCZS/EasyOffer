  reference_answer: '根据 设计模式面试题速记通关版; page 5：

    什么是里氏替换原则?

    里氏替换原则讲的是子类应该能够替换它的父类,程序的行为不会因此出错。你用父类定义的地方,换成子类对象,

    系统照样能正常跑。

    1)关键在于行为一致性。子类可以扩展功能,但不能改变父类原有的正确行为。比如父类的某个方法约定返回正数,

    子类重写后就不能返回负数,这会破坏调用方的预期。

    2)常见违反场景是重写方法时抛出意外异常,或者对输入输出做不合理限制。像集合框架里 ArrayList 和 Vector 都继

    承自 AbstractList,它们都能替换抽象父类出现在参数、变量中,这就是遵循了该原则。

    3)它和多态有关联但不是一回事。多态是语言机制,允许运行时决定调用哪个方法;而里氏替换是一种设计约束,确

    保这种替换是安全的。搞不定这点,继承体系就会变得脆弱,上游一改,下游全挂。

    这个原则压根不关心你用了多少继承层次,只关心替换后逻辑是否成立。用的时候记住一点:别让子类“背叛”父类

    承诺。'
