  reference_answer: '根据 Java 虚拟机面试题速记通关版; page 18：

    什么是 Java 的 AOT(Ahead-Of-Time)?

    AOT 指在程序运行前就把字节码编译成机器码,和传统的 JIT(运行时编译)反过来。Java 长期依赖 JVM 的即时编

    译,启动慢、内存占用高,尤其在云原生场景下成了短板。

    GraalVM 提供了 native-image 工具实现 AOT 编译,能把 Java 程序打成一个独立的可执行文件。这个过程会做静态

    分析,把用到的类、方法、反射信息全提前编译进去。结果是启动速度从秒级压到几十毫秒,内存占用也直接砍掉一

    大半。

    但代价不小。首先,所有动态特性得手动配置,比如反射、动态代理、资源加载,都得通过配置文件告诉编译器。其

    次,不支持 Class.forName 这种运行时加载类的操作,连 java.lang.Thread 的某些 API 都受限。SpringBoot 早

    期版本完全跑不起来,直到推出 SpringNative 才逐步适配。

    适合用 AOT 的场景很明确:短生命周期、高并发拉起的服务,比如 Serverless 函数。FaaS 平台要求百毫秒内启动,

    传统 JVM 压根扛不住,这时候 nativeimage 就能派上用场。但常规的长驻 Web 服务,JIT 的热点优化能力还是更

    强,AOT 反而可能跑不过。

    代码层面没啥特别,加个插件就行:

    // pom.xml 片段

    <plugin>

    <groupId>org.graalvm.buildtools</groupId>

    <artifactId>native-maven-plugin</artifactId>

    </plugin>

    构建后生成的是二进制文件,直接 ./app 启动,不依赖 JRE。'
