  reference_answer: '根据 AI 大模型原理和应用面试题速记通关版; page 28：

    什么查询扩展?为什么在 RAG 应用中需要查询扩展?

    查询扩展本质是把用户那句简单的原始问题,变形成一个或多个更完整、信息更丰富的查询语句。你别小看这一步,

    它直接决定了后续检索能不能捞出真正相关的内容。

    1) 用户搜“苹果手机续航差”,其实他关心的是 iPhone15Pro 的电池表现和省电技巧。原始 query 太短,关键词稀

    疏,直接去向量库搜索容易匹配到无关的“苹果水果”或者泛泛的“手机耗电”。这时候就得靠查询扩展来补全意图。

    2) 常见做法有几种。一种是同义词/近义词扩写,“续航”换成“电池寿命”“使用时间”;一种是基于大模型做多跳推

    理,让 LLM 把原始问题拆成几个子问题,比如“iPhone15Pro 满电能用多久”“哪些设置能延长待机”;还有一种是

    查询重写,把口语化表达转成更标准的检索语言。

    3) 不做查询扩展的 RAG 系统,召回率通常很低。特别是面对缩写、俚语、模糊表达时,向量检索压根不经过语义深

    化,直接就去算相似度,结果就是 top-k 文档里没有命中关键段落。像 LangChain、LlamaIndex 都内置了 querytransformation
    模块,就是为了解决这个断层。

    这步看着是脏活累活,但它是连接“人话”和“机器可检索语义”的关键桥梁。搞不定查询扩展,RAG 效果就很难稳

    定。'
