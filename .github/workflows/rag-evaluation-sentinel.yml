name: RAG evaluation sentinel

on:
  pull_request:
    paths:
      - "backend/app/corpus/**"
      - "backend/tests/test_corpus_evaluation.py"
      - "backend/tests/test_rag_evaluation_extended.py"
      - "backend/corpus/benchmarks/**"
  push:
    branches: [main]

jobs:
  sentinel:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python -m app.corpus.cli --store memory validate-golden corpus/benchmarks/golden-v2.yaml
      - run: python -m pytest -q tests/test_corpus_evaluation.py tests/test_rag_evaluation_extended.py tests/test_corpus_cli.py
